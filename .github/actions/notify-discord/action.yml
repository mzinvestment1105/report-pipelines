name: notify-discord
description: >
  Discord 通知の標準文法（2026-07-07 確定・2026-09-23 平易化）で送信する composite action。
  形式: 「[絵文字] [レポート名]（M/D） — [状況を平易な1文]」＋2行目「対応: [PMがやること]」の最大2行。
  絵文字語彙は7種に固定: ✅done(ETL完了のみ) ⏱timer(遅れて届く・対応不要) ⏭none(発行なし・正常)
  ⛔blocked(本日は見送り) ⚠️partial(配信済み・注意点あり) ❌failed(内部エラー)
  🚨alert(未配信・PMへの連絡が必要)。
  2026-09-23（PM 判断・案3）: GitHub の実行リンクは本文に載せない（大きなプレビューカードになり PM が
  使えないため）。実行リンクと内部の理由（detail）はジョブログの ::notice にだけ出す。
  通知はベストエフォート（webhook 未設定・送信失敗でも job を落とさない）。

inputs:
  webhook:
    description: "Discord webhook URL（空なら通知 skip・呼び出し側で `secrets.X || secrets.DISCORD_WEBHOOK_URL` のフォールバック可）"
    required: true
  state:
    description: "状態キー: done | timer | none | blocked | partial | failed | alert"
    required: true
  label:
    description: "PM が知っている和名のレポート名だけ（例: 動意レポート）。状態や内部用語は書かない"
    required: true
  date:
    description: "対象日。YYYY-MM-DD なら M/D へ変換・M/D 等はそのまま・空なら当日 JST"
    required: false
    default: ""
  meaning:
    description: "1行目の本文: 何が起きたかを平易な日本語の1文で（内部用語・英語の仕組み名は書かない）"
    required: true
  action_required:
    description: "2行目「対応: 」の中身。不要なら「不要」、必要なら「次回 Claude Code で「{名}を復旧して」とお伝えください」の一言"
    required: true
  detail:
    description: "内部の理由・件数など（Discord には送らず、ジョブログの ::notice にだけ出す）"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Send Discord notification (standard format)
      shell: bash
      env:
        WEBHOOK: ${{ inputs.webhook }}
        STATE: ${{ inputs.state }}
        LABEL: ${{ inputs.label }}
        DATE_IN: ${{ inputs.date }}
        MEANING: ${{ inputs.meaning }}
        ACTION_REQ: ${{ inputs.action_required }}
        DETAIL: ${{ inputs.detail }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        if [ -z "$WEBHOOK" ]; then
          echo "[notify-discord] webhook 未設定・通知 skip"
          exit 0
        fi

        case "$STATE" in
          done)    EMOJI="✅" ;;
          timer)   EMOJI="⏱" ;;
          none)    EMOJI="⏭" ;;
          blocked) EMOJI="⛔" ;;
          partial) EMOJI="⚠️" ;;
          failed)  EMOJI="❌" ;;
          alert)   EMOJI="🚨" ;;
          *)       echo "[notify-discord] WARN: 不明な state '$STATE'（failed 扱い）"; EMOJI="❌" ;;
        esac

        # 日付を M/D 表記へ（YYYY-MM-DD → M/D・それ以外はそのまま・空なら当日 JST）
        if [ -n "$DATE_IN" ]; then
          case "$DATE_IN" in
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9])
              MD="$((10#${DATE_IN:5:2}))/$((10#${DATE_IN:8:2}))" ;;
            *)
              MD="$DATE_IN" ;;
          esac
        else
          MD="$((10#$(TZ=Asia/Tokyo date +%m)))/$((10#$(TZ=Asia/Tokyo date +%d)))"
        fi

        # 2026-09-23: 本文は最大2行（1行目=状況・2行目=対応）。実行リンクと内部の理由はログにだけ出す。
        NL=$'\n'
        MSG="${EMOJI} ${LABEL}（${MD}） — ${MEANING}"
        if [ -n "$ACTION_REQ" ]; then
          MSG="${MSG}${NL}対応: ${ACTION_REQ}"
        fi
        # ログ用のワークフローコマンドは % と改行をエスケープする（本文が途中で切れないように）
        esc() { local v="$1"; v="${v//%/%25}"; v="${v//$'\r'/%0D}"; v="${v//$'\n'/%0A}"; printf '%s' "$v"; }
        echo "::notice title=Discord 通知（${STATE}）::$(esc "$MSG")"
        echo "::notice title=この実行のログ::${RUN_URL}"
        if [ -n "$DETAIL" ]; then
          echo "::notice title=通知の内部情報::$(esc "$DETAIL")"
        fi

        jq -n --arg content "$MSG" '{content: $content}' \
          | curl -s -X POST "$WEBHOOK" -H "Content-Type: application/json" -d @- \
          || echo "[notify-discord] WARN: 送信失敗（通知はベストエフォート・job は落とさない）"
