name: notify-discord
description: >
  Discord 通知の composite action（2026-10-04 全面改修・PM 指示）。
  kind で送り先と文面を構造的に分ける。
    kind: status（既定）= エラー・警告・復旧などの状態通知。呼び出し側がどの webhook を渡しても
      必ず BI チャンネル（bi_webhook = secrets.DISCORD_WEBHOOK_BI）へ送る。レポート用チャンネルへは絶対に送らない。
      異常系（failed / alert / partial / blocked / timer）の本文は次の 3 行に固定:
        「{絵文字} {レポート名}（M/D） — {要旨}」
        「原因: {cause}」（cause が空なら「未特定（Claude が実行ログで特定して修正します）」）
        「対応: 要（Claude が修正）」
      正常系（done = 完了・none = 発行なし）は 1 行目だけを送る（対応行を出さない）。
      エラーは全て Claude が直す対象のため「対応は要らない」旨の文言は存在しない。本文に否定形の
      「不・要」（2 文字連続）が混入した場合は「要（Claude が修正）」へ置換して ::warning を出す
      （構造的に出せないようにする。検索で引っかからないよう本ファイルでは 2 文字を分けて組み立てる）。
    kind: report = レポート用チャンネルへ誌面に添える短い本文（リンク等）だけを送る。状態文言は含めない。
      test_mode が 'true' のときは送り先を BI へ切り替え、本文の先頭に「🧪 テスト配信」を付ける。
  GitHub の実行リンクと内部の理由（detail）は Discord に載せず、ジョブログの ::notice にだけ出す。
  通知はベストエフォート（未設定・送信失敗でも job を落とさない）。strict: 'true' の時だけ
  HTTP 2xx 以外で失敗させる（通知経路の検証用）。

inputs:
  kind:
    description: "status（状態通知 → 必ず BI へ）| report（誌面に添える本文 → レポート用チャンネル・test_mode 時は BI）"
    required: false
    default: "status"
  bi_webhook:
    description: "BI チャンネルの webhook（全呼び出しで secrets.DISCORD_WEBHOOK_BI を渡す）"
    required: true
  webhook:
    description: "レポート用チャンネルの webhook（kind: report の時だけ使う。status では無視する）"
    required: false
    default: ""
  test_mode:
    description: "'true' なら kind: report の送り先を BI へ切り替え、先頭に「🧪 テスト配信」を付ける"
    required: false
    default: "false"
  state:
    description: "status の状態キー: done | none | timer | blocked | partial | failed | alert（report では無視）"
    required: false
    default: "failed"
  label:
    description: "PM が知っている和名のレポート名だけ（例: 動意レポート）"
    required: true
  date:
    description: "対象日。YYYY-MM-DD なら M/D へ変換・M/D 等はそのまま・空なら当日 JST"
    required: false
    default: ""
  meaning:
    description: "status: 1 行目の要旨（平易な日本語の 1 文）。report: 誌面に添える本文"
    required: true
  cause:
    description: "status の「原因: 」行の中身（1 行）。空なら「未特定（Claude が実行ログで特定して修正します）」"
    required: false
    default: ""
  detail:
    description: "内部の理由・件数など（Discord には送らず、ジョブログの ::notice にだけ出す）"
    required: false
    default: ""
  strict:
    description: "'true' なら webhook 未設定・HTTP 2xx 以外で step を失敗させる（通知経路の検証用）"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Send Discord notification (kind=${{ inputs.kind }})
      shell: bash
      env:
        KIND: ${{ inputs.kind }}
        BI_WEBHOOK: ${{ inputs.bi_webhook }}
        REPORT_WEBHOOK: ${{ inputs.webhook }}
        TEST_MODE: ${{ inputs.test_mode }}
        STATE: ${{ inputs.state }}
        LABEL: ${{ inputs.label }}
        DATE_IN: ${{ inputs.date }}
        MEANING: ${{ inputs.meaning }}
        CAUSE: ${{ inputs.cause }}
        DETAIL: ${{ inputs.detail }}
        STRICT: ${{ inputs.strict }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        fail_or_skip() {
          echo "[notify-discord] $1"
          if [ "$STRICT" = "true" ]; then exit 1; fi
          exit 0
        }

        # 日付を M/D 表記へ（YYYY-MM-DD → M/D・それ以外はそのまま・空なら当日 JST）
        if [ -n "$DATE_IN" ]; then
          case "$DATE_IN" in
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9])
              MD="$((10#${DATE_IN:5:2}))/$((10#${DATE_IN:8:2}))" ;;
            *)
              MD="$DATE_IN" ;;
          esac
        else
          MD="$((10#$(TZ=Asia/Tokyo date +%m)))/$((10#$(TZ=Asia/Tokyo date +%d)))"
        fi

        NL=$'\n'
        case "$KIND" in
          report)
            if [ "$TEST_MODE" = "true" ]; then
              TARGET="$BI_WEBHOOK"; DEST="BI（テストモード）"
              MSG="🧪 テスト配信 ${LABEL}（${MD}） ${MEANING}"
            else
              TARGET="$REPORT_WEBHOOK"; DEST="レポート用チャンネル"
              MSG="${MEANING}"
            fi
            ;;
          status|"")
            # 状態通知は呼び出し側の webhook に関係なく必ず BI へ（レポート用チャンネルへは送らない）
            TARGET="$BI_WEBHOOK"; DEST="BI"
            case "$STATE" in
              done)    EMOJI="✅"; ABNORMAL=0 ;;
              none)    EMOJI="⏭"; ABNORMAL=0 ;;
              timer)   EMOJI="⏱"; ABNORMAL=1 ;;
              blocked) EMOJI="⛔"; ABNORMAL=1 ;;
              partial) EMOJI="⚠️"; ABNORMAL=1 ;;
              failed)  EMOJI="❌"; ABNORMAL=1 ;;
              alert)   EMOJI="🚨"; ABNORMAL=1 ;;
              *)       echo "::warning::[notify-discord] 不明な state '$STATE'（failed 扱い）"; EMOJI="❌"; ABNORMAL=1 ;;
            esac
            PREFIX=""
            if [ "$TEST_MODE" = "true" ]; then PREFIX="🧪 "; fi
            MSG="${PREFIX}${EMOJI} ${LABEL}（${MD}） — ${MEANING}"
            if [ "$ABNORMAL" = "1" ]; then
              C="${CAUSE//$'\n'/ }"
              [ -n "$C" ] || C="未特定（Claude が実行ログで特定して修正します）"
              MSG="${MSG}${NL}原因: ${C}${NL}対応: 要（Claude が修正）"
            fi
            ;;
          *)
            fail_or_skip "不明な kind '$KIND'（status / report のみ）"
            ;;
        esac

        # 否定形「不・要」は構造的に出さない（エラーは全て Claude が直す対象）。混入したら置換して警告する。
        # リポ内検索で 0 件を保つため、禁止語は 2 文字を連結して組み立てる。
        NG_WORD="不""要"
        if [[ "$MSG" == *"$NG_WORD"* ]]; then
          echo "::warning title=notify-discord::本文に否定形の対応文言が含まれていたため「要（Claude が修正）」へ置換しました（呼び出し側の文言を直してください）"
          MSG="${MSG//対応${NG_WORD}/対応: 要（Claude が修正）}"
          MSG="${MSG//${NG_WORD}/要（Claude が修正）}"
        fi

        esc() { local v="$1"; v="${v//%/%25}"; v="${v//$'\r'/%0D}"; v="${v//$'\n'/%0A}"; printf '%s' "$v"; }
        echo "::notice title=Discord 通知（kind=${KIND} state=${STATE} → ${DEST}）::$(esc "$MSG")"
        echo "::notice title=この実行のログ::${RUN_URL}"
        if [ -n "$DETAIL" ]; then
          echo "::notice title=通知の内部情報::$(esc "$DETAIL")"
        fi

        if [ -z "$TARGET" ]; then
          fail_or_skip "送り先 webhook（${DEST}）が未設定のため通知 skip"
        fi

        CODE=$(jq -n --arg content "$MSG" '{content: $content}' \
          | curl -s -o /tmp/notify_discord_resp.txt -w '%{http_code}' -X POST "$TARGET" \
              -H "Content-Type: application/json" -d @- || echo "000")
        echo "[notify-discord] kind=${KIND} → ${DEST}: HTTP ${CODE}"
        case "$CODE" in
          2??) ;;
          *)
            echo "::warning title=notify-discord::Discord 送信が HTTP ${CODE} で失敗しました（${DEST}）"
            head -c 300 /tmp/notify_discord_resp.txt 2>/dev/null || true; echo
            if [ "$STRICT" = "true" ]; then exit 1; fi
            ;;
        esac
