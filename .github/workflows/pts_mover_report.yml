name: 夜間PTS動意レポート

"on":
  # 配信目標（PM 2026-08-05）: 平日 JST 21:00〜21:30 着。最悪でも 22:00 まで。23 時着は不可。
  #
  # 経路1（本命）: Cloudflare Worker (mizuki-fund-scheduler-1) からの workflow_dispatch（平日 21:00 JST）。
  # 経路2（予備）: cron '30 8 * * 1-5'（UTC 08:30 = JST 17:30 起票）。
  #   GitHub の cron は実測 +1h45m〜+3h15m 遅れて着火するため実着火は JST 19:15〜20:45。
  #   guard ジョブが JST 21:08 まで待機し、本命が動いていなければ自分で配信する（着地 21:20 前後）。
  # 経路3（三段目）: cron '0 9 * * 1-5'（UTC 09:00 = JST 18:00 起票）。
  #   経路2 の run が GitHub 側で丸ごと欠落した日の保険。起床は JST 21:25 と経路2 からずらし、
  #   経路2 が先に配信していれば skip する（二重配信防止）。
  #
  # 旧構成（cron '0 13 * * 1-5' = JST 22:00 起票）は遅延で JST 23:52〜00:44 に着火し、
  # 時間帯ゲートで本体 skip → run 自体は success → 翌日の本命発火がその残骸を「本日配信済み」と
  # 誤認して無言 skip、という連鎖で平日のほとんどが未配信になっていた（2026-08-05 実測・修正）。
  # 重複判定は run 単位の conclusion ではなく build-and-send ジョブの結果で行う
  # （.github/scripts/check_delivery.sh）。
  workflow_dispatch:
    inputs:
      target_date:
        description: '対象日付 (YYYY-MM-DD・空欄で当日)'
        required: false
        default: ''
      force_rerun:
        description: 'true で当日重複ガードを無視して強制実行'
        required: false
        default: 'false'
  schedule:
    - cron: '30 8 * * 1-5'
    - cron: '0 9 * * 1-5'

# workflow 単位の concurrency は置かない。予備 run が JST 21:08 まで待機している間に
# 本命（Worker 21:00 の workflow_dispatch）が pending へ回されると 21 時配信が壊れるため。
# 二重配信の最終防波堤は build-and-send ジョブ単位の concurrency で担保する。

jobs:
  guard:
    runs-on: ubuntu-latest
    # 予備 cron は JST 21:08 / 21:25 まで sleep してから判定するため長め（最大 sleep 3h40m + 本命待ち 30 分）。
    timeout-minutes: 300
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      reason: ${{ steps.check.outputs.reason }}
      target_date: ${{ steps.check.outputs.target_date }}
    steps:
      - name: Checkout report-pipelines (通知 action / 配信判定スクリプト用)
        uses: actions/checkout@v4

      - name: 予備タイマー待機 + 当日配信判定（build-and-send ジョブ単位）
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WF_FILE: pts_mover_report.yml
          SEND_JOB: build-and-send
          MY_RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          FORCE_RERUN: ${{ github.event.inputs.force_rerun }}
          INPUT_DATE: ${{ github.event.inputs.target_date }}
          # 本命（Worker）は JST 21:00 発火。予備は 21:08、三段目は 21:25 に起床して本命へ道を譲る。
          WAKE_JST: ${{ github.event.schedule == '0 9 * * 1-5' && '21:25' || '21:08' }}
          LANE_LABEL: ${{ github.event.schedule == '0 9 * * 1-5' && '経路3(三段目)' || '経路2(予備)' }}
          WINDOW_START_JST: '12:00'
          WINDOW_END_JST: '23:30'
          WAIT_MINUTES: '30'
        run: bash .github/scripts/standby_guard.sh

      # 2026-08-19: 予備タイマー通知の文面へ実測値を埋めるためだけの補助ステップ。
      # guard 本体（.github/scripts/standby_guard.sh）は 3 workflow 共用のため変更せず、
      # 判定直後の当日実績をこの workflow 内で読み直す（数秒差のため判定材料と同値）。
      # 取得に失敗しても通知・配信を止めない（0 件表示に落とすだけ）。
      - name: 予備タイマー通知用の当日実績を取得
        id: stats
        if: github.event_name == 'schedule' && steps.check.outputs.proceed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATS=$(bash .github/scripts/check_delivery.sh pts_mover_report.yml build-and-send "${{ github.run_id }}" || echo "{}")
          echo "done_ok=$(echo "$STATS" | jq -r '.delivered // 0')" >> $GITHUB_OUTPUT
          echo "done_fail=$(echo "$STATS" | jq -r '.failed // 0')" >> $GITHUB_OUTPUT
          echo "active=$(( $(echo "$STATS" | jq -r '.sending // 0') + $(echo "$STATS" | jq -r '.dispatch_pending // 0') + $(echo "$STATS" | jq -r '.schedule_pending // 0') ))" >> $GITHUB_OUTPUT

      - name: Discord 通知（⏱ 予備タイマー起動）
        if: github.event_name == 'schedule' && steps.check.outputs.proceed == 'true'
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
          state: timer
          label: 夜間PTS動意レポート 予備タイマー起動
          date: ${{ steps.check.outputs.target_date }}
          # 2026-08-19 修正: 旧文面は「Worker 発火が届かなかった」と断定していたが、Worker が正常着弾し
          # その run が失敗した場合も同じ通知が出る。guard が実際に把握している当日実績のみを述べる。
          meaning: '本日の生成がまだ成功していないため、GHA 側の予備タイマーが救援起動しました（本日: 成功 ${{ steps.stats.outputs.done_ok }} 件・失敗 ${{ steps.stats.outputs.done_fail }} 件・実行中 ${{ steps.stats.outputs.active }} 件）。レポートはこのあと通常どおり届きます。'
          action_required: 不要（このあとレポートが届けば復旧完了。届かない場合のみ run ログを確認）

      - name: Discord 通知（🚨 自動リトライ停止）
        if: contains(steps.check.outputs.reason, 'retry_cap')
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
          state: alert
          label: 夜間PTS動意レポート 自動リトライ停止
          meaning: 当日 2 回以上失敗したため cron の自動再実行を停止しました。本日未配信です。
          action_required: run ログ確認 → 原因解消後に手動 dispatch（force_rerun=true）で再実行

      - name: Discord 通知（guard 失敗）
        if: failure() || cancelled()
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_MOVERS || secrets.DISCORD_WEBHOOK_URL }}
          state: failed
          label: 夜間PTS動意レポート guard 失敗
          meaning: 実行前チェック（当日配信済み判定）自体がエラーになり、生成ジョブが起動していません。
          action_required: run ログ確認 → 手動 dispatch（force_rerun=true）で再実行

  build-and-send:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    # PM 2026-08-19: 529 自動リトライ（2 回・待機 60/180 秒）を足したため枠を再計算して拡張。
    # 最悪ケース = 前段（clone/setup/raw 生成）15 分 + 1 回目 30 分 + 待機 1 分 + 2 回目 30 分
    #            + 待機 3 分 + 3 回目 30 分 + 注記/フォント/playwright/送信/commit 16 分 = 125 分 → 135 分。
    timeout-minutes: 135
    # 実配信ジョブだけを直列化する（workflow 単位の concurrency は本命の 21 時発火を塞ぐため置かない）。
    concurrency:
      group: pts_mover_report-send
      cancel-in-progress: false
    steps:
      - name: Determine target date
        id: date
        env:
          GUARD_DATE: ${{ needs.guard.outputs.target_date }}
        run: |
          echo "value=${GUARD_DATE}" >> $GITHUB_OUTPUT

      - name: Checkout report-pipelines
        uses: actions/checkout@v4
        with:
          path: report-pipelines

      - name: Setup SSH for private repo
        env:
          PRIVATE_REPO_DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_REPO_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone private repo (mizuki-fund)
        run: |
          git clone git@github.com:mzinvestment1105/mizuki-fund.git private-repo

      - name: Copy pipelines and static files from Public into private working tree
        run: |
          cp -f report-pipelines/bi/pipelines/*.py private-repo/bi/pipelines/
          cp -f report-pipelines/bi/pipelines/requirements.txt private-repo/bi/pipelines/
          mkdir -p private-repo/bi/pipelines/lib
          cp -rf report-pipelines/bi/pipelines/lib/*.py private-repo/bi/pipelines/lib/ 2>/dev/null || true
          mkdir -p private-repo/bi/pipelines/assets/fonts
          cp -rf report-pipelines/bi/pipelines/assets/fonts/* private-repo/bi/pipelines/assets/fonts/ 2>/dev/null || true
          mkdir -p private-repo/agents private-repo/playbook
          cp -f report-pipelines/agents/*.md private-repo/agents/ 2>/dev/null || true
          cp -f report-pipelines/playbook/*.md private-repo/playbook/ 2>/dev/null || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: report-pipelines/bi/pipelines/requirements.txt

      - name: Install dependencies
        run: pip install -r report-pipelines/bi/pipelines/requirements.txt

      - name: Generate PTS movers raw (v5 カブラボの当日終値比・動意と同一材料プロセス)
        # 値動きデータ＝カブラボ（値上がり表・値下がり表）の当日終値比。材料はTDNet/EDINET/みんかぶ/
        # Yahoo掲示板/需給で動意と同一。取得失敗は誌面用の {date}_pts_quality_flags.txt（階層1のみ）と
        # 内部追跡用の {date}_pts_internal_flags.txt（誌面へ出さない）に分けて出力し配信は止めない（絶対配信）。
        # 本 step の失敗（exit 非0）はインフラ失敗のみ。
        working-directory: ./private-repo/bi/pipelines
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          EDINETDB_API_KEYS: ${{ secrets.EDINETDB_API_KEYS }}
          PYTHONIOENCODING: utf-8
        run: |
          python make_pts_mover_report.py --date ${{ steps.date.outputs.value }}

      - name: 出力ディレクトリ作成 + 既存レポートファイル削除（前回不良ファイル読込スキップ防止）
        working-directory: ./private-repo
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: |
          mkdir -p market/daily/pts_movers
          rm -f "market/daily/pts_movers/${TARGET_DATE}.md"

      # PM 2026-08-19 承認（動意日次 mover_report_daily.yml からの横展開）: Anthropic 側の過負荷応答
      # （API Error: 529 overloaded_error）を初回 API 呼び出しで受けて即 exit 1 する事故の恒久対策。
      # 第三者製の新規 action を足さず、continue-on-error + outcome 判定の再試行ステップだけで構成する。
      # 529 は即時再試行が無意味なため待機を指数的に伸ばす（60 秒 → 180 秒）。3 ステップとも
      # continue-on-error のため、成否は最後の Verify ステップ 1 箇所（成果物ファイルが非空か）で決まる。
      - name: Generate report via Claude Code (Opus 5 + effort high)
        id: gen1
        continue-on-error: true
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-5
          prompt_file: report-pipelines/prompts/pts-mover-report.md
          allowed_tools: "Read,Write,Edit,Bash,Grep,Glob"
          timeout_minutes: "30"
          claude_env: |
            CLAUDE_CODE_EFFORT_LEVEL: high
            CLAUDE_CODE_MAX_OUTPUT_TOKENS: 64000
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
          PRIVATE_REPO_ROOT: private-repo
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: 64000

      - name: Wait before retry 2 (Claude overloaded 等の一時エラー)
        if: success() && steps.gen1.outcome == 'failure'
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: |
          F="private-repo/market/daily/pts_movers/${TARGET_DATE}.md"
          # 途中まで書かれた不完全ファイルは退避（削除しない）。再試行が白紙から書き直せるようにする。
          if [ -f "$F" ]; then
            mv "$F" "/tmp/${TARGET_DATE}_pts_movers.attempt1.partial.md"
            echo "1 回目の不完全な出力を /tmp へ退避しました（再試行が白紙から書き直せるようにするため）"
          fi
          echo "1 回目が失敗しました。60 秒待機して再試行します（529 は即時再試行が無意味なため）"
          sleep 60

      - name: Generate report via Claude Code (retry 2)
        id: gen2
        if: success() && steps.gen1.outcome == 'failure'
        continue-on-error: true
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-5
          prompt_file: report-pipelines/prompts/pts-mover-report.md
          allowed_tools: "Read,Write,Edit,Bash,Grep,Glob"
          timeout_minutes: "30"
          claude_env: |
            CLAUDE_CODE_EFFORT_LEVEL: high
            CLAUDE_CODE_MAX_OUTPUT_TOKENS: 64000
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
          PRIVATE_REPO_ROOT: private-repo
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: 64000

      - name: Wait before retry 3 (Claude overloaded 等の一時エラー)
        if: success() && steps.gen2.outcome == 'failure'
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: |
          F="private-repo/market/daily/pts_movers/${TARGET_DATE}.md"
          # 途中まで書かれた不完全ファイルは退避（削除しない）。再試行が白紙から書き直せるようにする。
          if [ -f "$F" ]; then
            mv "$F" "/tmp/${TARGET_DATE}_pts_movers.attempt2.partial.md"
            echo "2 回目の不完全な出力を /tmp へ退避しました（再試行が白紙から書き直せるようにするため）"
          fi
          echo "2 回目も失敗しました。180 秒待機して最終再試行します"
          sleep 180

      - name: Generate report via Claude Code (retry 3)
        id: gen3
        if: success() && steps.gen2.outcome == 'failure'
        continue-on-error: true
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-5
          prompt_file: report-pipelines/prompts/pts-mover-report.md
          allowed_tools: "Read,Write,Edit,Bash,Grep,Glob"
          timeout_minutes: "30"
          claude_env: |
            CLAUDE_CODE_EFFORT_LEVEL: high
            CLAUDE_CODE_MAX_OUTPUT_TOKENS: 64000
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
          PRIVATE_REPO_ROOT: private-repo
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: 64000

      - name: Verify generated PTS mover report (成否の一元判定)
        # 上の 3 ステップは全て continue-on-error のため、ジョブの成否はここだけで決まる。
        # 「どの試行で成功したか」に依存せず成果物の実在で判定するので、リトライ成功を失敗扱いする
        # / 失敗を成功扱いする判定崩れが起きない。
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: |
          F="private-repo/market/daily/pts_movers/${TARGET_DATE}.md"
          echo "attempt outcomes: gen1=${{ steps.gen1.outcome }} gen2=${{ steps.gen2.outcome }} gen3=${{ steps.gen3.outcome }}"
          if [ ! -s "$F" ]; then
            echo "::error::夜間PTS動意レポートが 3 回の試行で生成されませんでした: $F"
            exit 1
          fi
          echo "生成成功: $F ($(wc -l < "$F") lines)"

      - name: 品質注記の機械挿入（フラグ検知時のみ・タイトル直後）
        # 絶対配信原則: make_pts_mover_report.py が出力する {date}_pts_quality_flags.txt（誌面用・階層1のみ）を
        # レポート冒頭（# 夜間PTS動意レポート …）直後へ挿入。Claude 側の注記と重複しても機械挿入を正とする。
        #
        # 多層防御（2026-08-17/18 の内部フラグ漏出の再発防止）: 内部フラグは
        # {date}_pts_internal_flags.txt へ分離済みだが、この step 側でも
        #   (1) [internal] 以降を切り落とす
        #   (2) URL・例外語（Error/Exception/Traceback）を含むなら注記ごと捨てる
        #   (3) 全角60字で打ち切る
        #   (4) 空になったら注記自体を挿入しない（空の「⚠️ 品質注記:」を誌面へ出さない）
        # を行う。注記処理の失敗で配信を止めない（|| NOTE="" で握る）。
        id: annotate
        working-directory: ./private-repo
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
          PYTHONIOENCODING: utf-8
        run: |
          F=market/daily/pts_movers/${TARGET_DATE}.md
          FLAGS=market/daily/${TARGET_DATE}_pts_quality_flags.txt
          if [ ! -f "$F" ]; then
            echo "ERROR: report not found: $F"; exit 1
          fi
          NOTE=""
          if [ -s "$FLAGS" ]; then
            NOTE="$(FLAGS="$FLAGS" python3 -c 'import os,re;t=open(os.environ["FLAGS"],encoding="utf-8").read().split("[internal]")[0];t=re.sub(r"\s+"," ",t).strip();t="" if re.search(r"https?://|Error|Exception|Traceback",t) else t;print(t[:59]+"…" if len(t)>60 else t)')" || NOTE=""
          fi
          if [ -n "$NOTE" ]; then
            awk -v note="> ⚠️ **品質注記**: ${NOTE}" '{print} /^# 夜間PTS動意レポート /{print ""; print note}' "$F" > "${F}.tmp" && mv "${F}.tmp" "$F"
            echo "annotated=true" >> $GITHUB_OUTPUT
            echo "note=${NOTE}" >> $GITHUB_OUTPUT
          else
            echo "annotated=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Japanese fonts (Noto Sans CJK JP)
        # PM 2026-08-19 承認（動意日次 mover_report_daily.yml からの横展開）: `sudo apt-get update -qq`
        # が出力ゼロのまま数十分ハングし、ジョブ枠に到達して配信ごと落ちる事故（GitHub 側の一時事象）の
        # 恒久対策。①ステップ単位 timeout ②各コマンドを timeout コマンドで打ち切り ③待機つき 3 回リトライ。
        #
        # 【失敗してもジョブを落とさない理由】本 workflow の誌面生成は send_report_pdf_discord.py →
        # bi/pipelines/lib/md_to_pdf.py で行い、同モジュールは assets/fonts の日本語サブセット woff2
        # （NotoSansJP / NotoSerifJP / BIZ UDPGothic）を base64 で @font-face 埋め込みする設計＝
        # システムのフォント選択に一切依存しない。よって apt のフォントが無くても誌面が豆腐（文字化け）に
        # なることはなく、ここで落とすと「配信できたはずの日を落とす」だけになる。
        # 時間予算: 1 試行 = update 75 秒 + install 120 秒 = 最大 195 秒。新規試行は開始 280 秒までに
        # 限るので最悪 475 秒で自己終了し、ステップ枠 8 分（480 秒）内に必ず警告を出して抜ける。
        timeout-minutes: 8
        continue-on-error: true
        run: |
          set -u
          DEADLINE=$(( $(date +%s) + 280 ))
          for i in 1 2 3; do
            if [ "$i" -gt 1 ] && [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "時間予算を超過したため再試行を打ち切ります"
              break
            fi
            if timeout 75 sudo apt-get update -qq \
               && timeout 120 sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra; then
              echo "日本語フォント導入に成功しました（${i} 回目）"
              exit 0
            fi
            echo "日本語フォント導入に失敗またはハングしました（${i}/3 回目）"
            if [ "$i" -lt 3 ]; then
              sleep $((i * 15))
            fi
          done
          echo "::warning::日本語フォントの apt 導入をスキップしました。PDF は assets/fonts の埋め込みフォント（base64 @font-face）で描画するため誌面に影響はなく、配信を続行します"
          exit 0

      - name: Install Playwright Chromium
        run: |
          playwright install chromium --with-deps

      - name: Send Discord (単一 JPEG/PDF・分割なし)
        id: send
        working-directory: ./private-repo/bi/pipelines
        env:
          DISCORD_WEBHOOK_MOVERS: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
          PYTHONIOENCODING: utf-8
        run: |
          python send_report_pdf_discord.py --kind pts_movers --date ${{ steps.date.outputs.value }}

      - name: Rotate report archives (5 件超過分を archive/ へ退避)
        working-directory: ./private-repo
        env:
          PYTHONIOENCODING: utf-8
        run: |
          mkdir -p bi/pipelines/ops
          cp -f ../report-pipelines/bi/pipelines/ops/rotate_report_archives.py bi/pipelines/ops/
          python bi/pipelines/ops/rotate_report_archives.py

      - name: Commit and push to private repo
        working-directory: ./private-repo
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: |
          bash ../report-pipelines/bi/pipelines/ops/ci_commit_push.sh \
            -m "data: pts mover report ${TARGET_DATE}" market/daily

      - name: Discord 通知（⚠️ 配信済み・品質注記あり）
        if: steps.annotate.outputs.annotated == 'true' && steps.send.outcome == 'success'
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
          state: partial
          label: 夜間PTS動意レポート 配信済み（品質注記あり）
          date: ${{ steps.date.outputs.value }}
          meaning: レポートは配信済みです。品質注記（${{ steps.annotate.outputs.note }}）を冒頭に付けています。
          action_required: レポート冒頭の品質注記を確認

      - name: Discord 通知（⚠️ 配信済み・後処理のみ失敗）
        if: (failure() || cancelled()) && steps.send.outcome == 'success'
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
          state: partial
          label: 夜間PTS動意レポート 後処理のみ失敗
          date: ${{ steps.date.outputs.value }}
          meaning: レポート本体は配信済みです。配信後のアーカイブ整理または commit だけが失敗しました。
          action_required: 不要（差分は次回 run が回収）

      - name: Discord 通知（❌ 生成/送信失敗）
        if: (failure() || cancelled()) && steps.send.outcome != 'success'
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
          state: failed
          label: 夜間PTS動意レポート 失敗（生成/送信）
          date: ${{ steps.date.outputs.value }}
          meaning: raw 生成・Claude 生成・Discord 送信のいずれかが失敗し、本日未配信です。
          action_required: run ログ確認 → 手動 dispatch（force_rerun=true）で再実行。ログに「Spending cap reached」がある場合は Claude 利用枠切れ＝リセット時刻以降に force_rerun=true
