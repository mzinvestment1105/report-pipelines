name: Price History Daily Update

"on":
  # 手動実行: 初回フル取得（initial）または日次差分（daily）を input で選択
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード: initial (全銘柄 × 過去 10 年・数時間) / daily (最新営業日差分・数分)"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - initial
  # 2026-07-07 退役 → 2026-07-12 復活（PM 指示・未配信事故の根絶）:
  # price_history parquet（2023〜2026）を再び git 管理に戻し（private .gitignore に negation 追加済み）、
  # 日次 cron + push-back 同期を再開する。16:00 JST に最新営業日差分を取得・commit し、
  # 夕方/週次レポート群（make_sector_report.py 経由の週次リターン計算）の入力源とする。
  # 退役中に GHA clone から price_history が消えたことで、セクター週次 full が 3 年コールド
  # フェッチ化 → timeout → parquet 凍結 → 2026-07-10 週次動意の前週データ誤配信につながった。
  schedule:
    - cron: "0 7 * * *"

# PM 2026-06-06 追加: 二重発火を GHA 内部ロックで防ぐ。
concurrency:
  group: price_history-daily
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      # 通知 composite action（.github/actions/notify-discord）を使うため checkout が必要
      - name: Checkout report-pipelines (通知 action 用)
        uses: actions/checkout@v4

      - name: Check today's runs
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY_JST=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          TODAY_START="${TODAY_JST}T00:00:00+09:00"
          MY_RUN_ID=${{ github.run_id }}
          EVENT="${{ github.event_name }}"

          # 2026-08-05 修正: run 単位の conclusion は「guard が本体ジョブを skip した run」まで
          # success と数えてしまい、本命の発火を「本日配信済み」と誤認して無言 skip させる。
          # 実際に配信/更新を行うジョブ（update）の結果だけで判定する。
          STATS=$(bash .github/scripts/check_delivery.sh price_history.yml update "${MY_RUN_ID}")
          DONE_OK=$(echo "$STATS" | jq -r '.delivered')
          DONE_FAIL=$(echo "$STATS" | jq -r '.failed')
          ACTIVE=$(( $(echo "$STATS" | jq -r '.sending') + $(echo "$STATS" | jq -r '.dispatch_pending') + $(echo "$STATS" | jq -r '.schedule_pending') ))

          echo "Today (${TODAY_JST}): active=${ACTIVE} done_ok=${DONE_OK} done_fail=${DONE_FAIL} event=${EVENT}"

          if [ "$DONE_OK" -gt 0 ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=skip (already succeeded today)" >> $GITHUB_OUTPUT
          elif [ "$ACTIVE" -gt 0 ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=skip (active run exists)" >> $GITHUB_OUTPUT
          elif [ "$EVENT" = "schedule" ] && [ "$DONE_FAIL" -ge 2 ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=retry_cap (cron stopped: done_fail=${DONE_FAIL})" >> $GITHUB_OUTPUT
          else
            echo "proceed=true" >> $GITHUB_OUTPUT
            echo "reason=proceed" >> $GITHUB_OUTPUT
          fi

      - name: Discord 通知（guard 失敗）
        if: failure() || cancelled()
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          state: failed
          label: 価格履歴ETL guard 失敗
          meaning: 実行前チェック（当日重複判定）自体がエラーになり、更新ジョブが起動していません。
          action_required: run ログ確認 → 手動 dispatch（mode=daily）で再実行

  update:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout report-pipelines
        uses: actions/checkout@v4
        with:
          path: report-pipelines

      - name: Setup SSH for private repo
        env:
          PRIVATE_REPO_DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_REPO_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone private repo (mizuki-fund)
        run: |
          git clone git@github.com:mzinvestment1105/mizuki-fund.git private-repo

      - name: Copy pipelines into private working tree
        run: |
          cp -f report-pipelines/bi/pipelines/*.py private-repo/bi/pipelines/
          cp -f report-pipelines/bi/pipelines/requirements.txt private-repo/bi/pipelines/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: report-pipelines/bi/pipelines/requirements.txt

      - name: Install dependencies
        run: pip install -r report-pipelines/bi/pipelines/requirements.txt

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          else
            echo "mode=daily" >> $GITHUB_OUTPUT
          fi

      - name: Run ETL (${{ steps.mode.outputs.mode }})
        working-directory: ./private-repo/bi/pipelines
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          python make_price_history_master.py ${{ steps.mode.outputs.mode }} 2>&1 | tee /tmp/etl.log

      - name: Commit and push to private repo
        # rebase 方式は履歴書き換え・並行 push で index.lock 残留の構造的弱点があるため、
        # fresh-base 方式の共通ヘルパー（Public 側から直接実行・repo 内コピー禁止）へ置換。
        working-directory: ./private-repo
        run: |
          bash ../report-pipelines/bi/pipelines/ops/ci_commit_push.sh \
            -m "data: price_history $(TZ=Asia/Tokyo date +'%Y-%m-%d') (${{ steps.mode.outputs.mode }})" \
            bi/outputs/price_history

      - name: Discord 通知（✅ 完了）
        if: success()
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          state: done
          label: 価格履歴ETL 完了（${{ steps.mode.outputs.mode }}）
          meaning: 全銘柄の価格履歴 parquet を最新営業日分まで更新しました。
          action_required: 不要

      - name: Discord 通知（❌ 失敗）
        # cancelled() を含める: job timeout 超過は conclusion=cancelled になり
        # failure() だけでは発火しない穴を塞ぐ（2026-07-07）。
        if: failure() || cancelled()
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          state: failed
          label: 価格履歴ETL 失敗（${{ steps.mode.outputs.mode }}）
          meaning: 更新が完了せず（エラーまたは制限時間超過）、価格履歴は前回値のまま更新されていません。
          action_required: run ログ確認 → 手動 dispatch（mode=daily）で再実行
