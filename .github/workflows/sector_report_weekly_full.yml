name: セクター週次レポート（フルバージョン）

"on":
  # PM 2026-05-27 確定: Cloudflare Worker (mizuki-fund-scheduler-1) からの workflow_dispatch がメイン経路。
  # PM 2026-06-06 追加: Worker SPOF 回避のため GHA cron をフェイルセーフ併用。
  # PM 2026-06-29: 金曜 21:00 JST = UTC 金 12:00 へ変更（Worker と同枠・金曜終値の price_history 更新完了後）。
  # 2026-08-05 修正: 旧 cron は Worker と同じ UTC 金 12:00 に起票していたが、GitHub cron は実測
  #   +1h45m〜+3h15m 遅れて着火するため実際の配信は JST 22:16〜23:19 に落ちていた（Worker との
  #   前後関係も不定）。予備 cron を UTC 金 08:30（JST 17:30）へ前倒しし、guard 側で JST 21:10 まで
  #   待機してから判定する方式に変更（本命 Worker の JST 21:00 発火を必ず先に通し、届かなければ
  #   予備が 21:10 に起きて配信する）。金曜配信という仕様自体は変更していない。
  workflow_dispatch:
    inputs:
      target_date:
        description: '対象日付 (YYYY-MM-DD・空欄で当日の金曜)'
        required: false
        default: ''
      force_rerun:
        description: 'true で当日重複ガードを無視して強制実行（修正後の再テスト用）'
        required: false
        default: 'false'
  schedule:
    - cron: '30 8 * * 5'

# workflow 単位の concurrency は置かない（予備 run が JST 21:10 まで待機している間に
# 本命 Worker の workflow_dispatch が pending へ回されるのを避けるため）。
# 二重配信の最終防波堤は generate ジョブ単位の concurrency で担保する。

jobs:
  guard:
    runs-on: ubuntu-latest
    # 予備 cron は JST 21:10 まで sleep してから判定するため長め（最大 sleep 3h40m + 本命待ち 30 分）。
    timeout-minutes: 300
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      reason: ${{ steps.check.outputs.reason }}
      target_date: ${{ steps.check.outputs.target_date }}
    steps:
      # 通知 composite action（.github/actions/notify-discord）と判定スクリプトを使うため checkout が必要
      - name: Checkout report-pipelines (通知 action / 配信判定スクリプト用)
        uses: actions/checkout@v4

      - name: 予備タイマー待機 + 当日配信判定（generate ジョブ単位）
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WF_FILE: sector_report_weekly_full.yml
          SEND_JOB: generate
          MY_RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          FORCE_RERUN: ${{ github.event.inputs.force_rerun }}
          INPUT_DATE: ${{ github.event.inputs.target_date }}
          # 本命（Worker）は金曜 JST 21:00 発火。予備は 21:10 に起床して本命へ道を譲る。
          WAKE_JST: '21:10'
          WINDOW_START_JST: '12:00'
          WINDOW_END_JST: '23:30'
          WAIT_MINUTES: '30'
          LANE_LABEL: 予備タイマー
        run: bash .github/scripts/standby_guard.sh

      # ⏱予備タイマー起動通知は削除（PM 2026-07-09）: Worker が週次を発火しておらず cron が
      # 実質本経路のため「Worker未達」案内が毎週金曜に誤発報していた。レポート生成・送信は継続。
      # 2026-08-05 復活: Cloudflare cron の曜日フィールドが 1=日曜だったため金曜が発火せず、
      # cron が実質本経路になっていた（Worker 側で修正済み）。以後は Worker が金曜も発火するため
      # 「予備が起きた＝本当に Worker 未達」となり通知が正しい情報になる（無言 skip の禁止）。
      - name: Discord 通知（⏱ 予備タイマー起動）
        if: github.event_name == 'schedule' && steps.check.outputs.proceed == 'true'
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_SECTOR }}
          state: timer
          label: セクター週次レポート 予備タイマー起動
          date: ${{ steps.check.outputs.target_date }}
          meaning: 定時の Cloudflare Worker 発火（金曜 21 時）が届かなかったため、GHA 側の予備タイマーが代わりに生成を開始しました。レポートはこのあと通常どおり届きます。
          action_required: 不要（毎週続く場合のみ Worker 点検）

      - name: Discord 通知（🚨 自動リトライ停止）
        if: contains(steps.check.outputs.reason, 'retry_cap')
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_SECTOR }}
          state: alert
          label: セクター週次レポート 自動リトライ停止
          meaning: 当日 2 回以上失敗したため cron の自動再実行を停止しました。今週分は未配信です。
          action_required: run ログ確認 → 原因解消後に手動 dispatch（force_rerun=true）で再実行

      - name: Discord 通知（guard 失敗）
        if: failure() || cancelled()
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_SECTOR || secrets.DISCORD_WEBHOOK_URL }}
          state: failed
          label: セクター週次レポート guard 失敗
          meaning: 実行前チェック（当日重複判定）自体がエラーになり、生成ジョブが起動していません。
          action_required: run ログ確認 → 手動 dispatch で再実行

  generate:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    # PM 2026-05-31: 40 -> 90 拡張（JQuants 429 リトライ + Deep Research 含むフル版で 55+ 分実績あり）。
    # PM 2026-08-19: 529 自動リトライ（2 回・待機 60/180 秒）を足したため枠を再計算して拡張。
    # 最悪ケース = 前段（clone/setup/fonts/playwright）10 分 + Refresh 30 分 + 決定論生成 2 分
    #            + 1 回目 20 分 + 待機 1 分 + 2 回目 20 分 + 待機 3 分 + 3 回目 20 分
    #            + 検証/注記/送信/commit 8 分 = 114 分 → 125 分。
    timeout-minutes: 125
    # 実生成ジョブだけを直列化する（workflow 単位の concurrency は本命の金曜 21 時発火を塞ぐため置かない）。
    concurrency:
      group: sector_report_weekly_full-generate
      cancel-in-progress: false

    steps:
      - name: Determine target date
        id: date
        env:
          GUARD_DATE: ${{ needs.guard.outputs.target_date }}
        run: |
          echo "value=${GUARD_DATE}" >> $GITHUB_OUTPUT

      - name: Checkout report-pipelines
        uses: actions/checkout@v4
        with:
          path: report-pipelines

      - name: Setup SSH for private repo
        env:
          PRIVATE_REPO_DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_REPO_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone private repo (mizuki-fund)
        run: |
          git clone git@github.com:mzinvestment1105/mizuki-fund.git private-repo

      - name: Copy pipelines and static files from Public into private working tree
        run: |
          cp -f report-pipelines/bi/pipelines/*.py private-repo/bi/pipelines/
          cp -f report-pipelines/bi/pipelines/requirements.txt private-repo/bi/pipelines/
          mkdir -p private-repo/bi/pipelines/lib
          cp -rf report-pipelines/bi/pipelines/lib/*.py private-repo/bi/pipelines/lib/ 2>/dev/null || true
          # PDF 配信用の埋め込みフォント（assets/fonts/*.woff2）を Public から overlay
          mkdir -p private-repo/bi/pipelines/assets/fonts
          cp -rf report-pipelines/bi/pipelines/assets/fonts/* private-repo/bi/pipelines/assets/fonts/ 2>/dev/null || true
          mkdir -p private-repo/agents private-repo/playbook
          cp -f report-pipelines/agents/*.md private-repo/agents/ 2>/dev/null || true
          cp -f report-pipelines/playbook/*.md private-repo/playbook/ 2>/dev/null || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: report-pipelines/bi/pipelines/requirements.txt

      - name: Install dependencies
        run: pip install -r report-pipelines/bi/pipelines/requirements.txt

      - name: Install Japanese fonts (Noto Sans CJK JP)
        # PM 2026-08-19 承認（動意日次 mover_report_daily.yml からの横展開）: `sudo apt-get update -qq`
        # が出力ゼロのまま数十分ハングし、ジョブ枠に到達して配信ごと落ちる事故（GitHub 側の一時事象）の
        # 恒久対策。①ステップ単位 timeout ②各コマンドを timeout コマンドで打ち切り ③待機つき 3 回リトライ。
        #
        # 【失敗してもジョブを落とさない理由】本 workflow の誌面生成は send_report_pdf_discord.py →
        # bi/pipelines/lib/md_to_pdf.py で行い、同モジュールは assets/fonts の日本語サブセット woff2
        # （NotoSansJP / NotoSerifJP / BIZ UDPGothic）を base64 で @font-face 埋め込みする設計＝
        # システムのフォント選択に一切依存しない。よって apt のフォントが無くても誌面が豆腐（文字化け）に
        # なることはなく、ここで落とすと「配信できたはずの日を落とす」だけになる。
        # 時間予算: 1 試行 = update 75 秒 + install 120 秒 = 最大 195 秒。新規試行は開始 280 秒までに
        # 限るので最悪 475 秒で自己終了し、ステップ枠 8 分（480 秒）内に必ず警告を出して抜ける。
        timeout-minutes: 8
        continue-on-error: true
        run: |
          set -u
          DEADLINE=$(( $(date +%s) + 280 ))
          for i in 1 2 3; do
            if [ "$i" -gt 1 ] && [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "時間予算を超過したため再試行を打ち切ります"
              break
            fi
            if timeout 75 sudo apt-get update -qq \
               && timeout 120 sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra; then
              echo "日本語フォント導入に成功しました（${i} 回目）"
              exit 0
            fi
            echo "日本語フォント導入に失敗またはハングしました（${i}/3 回目）"
            if [ "$i" -lt 3 ]; then
              sleep $((i * 15))
            fi
          done
          echo "::warning::日本語フォントの apt 導入をスキップしました。PDF は assets/fonts の埋め込みフォント（base64 @font-face）で描画するため誌面に影響はなく、配信を続行します"
          exit 0

      - name: Install Playwright Chromium
        run: |
          playwright install chromium --with-deps

      - name: Check screening_master parquet existence (no update・PM 2026-05-23 確定)
        # PM 明示指示: screening_master 更新は 5 時間かかるため本 workflow 内で走らせない。
        # screening_master.yml の cron (16:30 JST) で別途更新される設計に依存・存在確認のみ。
        working-directory: ./private-repo/bi/pipelines
        env:
          PYTHONIOENCODING: utf-8
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          import pandas as pd

          parquet = Path("../outputs/screening_master.parquet")
          if not parquet.exists():
              print(f"[WARN] screening_master.parquet が見つかりません: {parquet}")
              print("       本 workflow では更新しない設計のため、screening_master.yml が事前に走っている前提です")
              # 存在しなくても fail させない・以降のステップは parquet 無しで動作可能なものは進める
              sys.exit(0)
          df = pd.read_parquet(parquet)
          latest = pd.to_datetime(df["DataDate"]).max().date().isoformat() if "DataDate" in df.columns else "unknown"
          target = os.environ.get("TARGET_DATE", "")
          print(f"screening_master DataDate: {latest} (target: {target})")
          print("PM 確定: 古くてもそのまま使う・更新は実行しない")
          PY

      - name: Refresh sector_weekly.parquet (make_sector_report.py --anchor friday)
        # PM 2026-05-30 確定: 週次セクターレポートに stale な sector_weekly.parquet（5/22 AsOf）が使われる事故が
        # 発生したため、Claude 実行前に必ず当週分のセクター集計を再生成する step を追加。
        # screening_master.parquet（commit 済の最新版）を universe として週次価格を取得・集計。
        # PM 2026-07-12 改定（絶対配信原則）:
        # - --cold-lookback-days 90: price_history が 1 営業日 stale なだけで top-up が 3 年コールド
        #   フェッチ化 → 90 分 timeout → 未配信、の経路を遮断（キャッシュ sector_prices.parquet は
        #   gitignore で clone に無いため）。price_history が新鮮なら従来どおり 3 年分の高速パス。
        # - --expect-price-date: 不一致でも parquet は保存済みのまま exit 3 が返る（検知シグナル）。
        # - continue-on-error + step timeout: 本 step がどう失敗しても後続の決定論生成は commit 済み
        #   parquet で必ず走り、後段の注記挿入 step が鮮度ずれを冒頭注記して必ず配信する。
        id: refresh
        continue-on-error: true
        timeout-minutes: 30
        working-directory: ./private-repo/bi/pipelines
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          python make_sector_report.py --anchor friday \
            --expect-price-date ${{ steps.date.outputs.value }} --cold-lookback-days 90

      - name: 既存セクター週次フルレポートファイルを削除（前回不良ファイル読込スキップ防止）
        working-directory: ./private-repo
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: |
          TARGET_FILE="market/daily/sector/${TARGET_DATE}_full.md"
          if [ -f "$TARGET_FILE" ]; then
            echo "Removing existing $TARGET_FILE before Claude run..."
            rm -f "$TARGET_FILE"
          fi

      - name: Generate sector full report (deterministic・make_sector_rich_md.py)
        # PM 2026-06-28: Deep Research/Claude 生成を廃止し（gen step 失敗の根本原因）、parquet から
        # 決定論的に markdown を生成する。直前の Refresh step で再生成済の sector_weekly /
        # sector_stock_weekly + 既存 screening_master から、強弱ランキング・8週トレンド帯・資金フロー・
        # 52週高値圏・主役Top5/下落主役Bottom5 を表組みで出力（色付けは lib/md_to_pdf 側）。
        working-directory: ./private-repo/bi/pipelines
        env:
          PYTHONIOENCODING: utf-8
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: |
          python make_sector_rich_md.py --date ${{ steps.date.outputs.value }}

      - name: セクター「なぜ動いた」理由補完（Claude・追記専用・失敗許容）
        # PM 2026-06-28 option 2: 決定論レポートに理由層のみ Claude で追記する。
        # この GHA 環境では WebSearch/WebFetch が 404（利用不可）のため、理由は既存ローカル一次
        # レポート（macro/movers/theme）＋各セクター主役銘柄から合成する（Web 非依存）。
        # continue-on-error: true ＝ 補完が失敗しても直前の決定論レポートをそのまま送信し、
        # 旧来の「Claude 生成失敗 → レポート欠落・parquet 凍結」事故を再発させない。
        # allowed_tools に Write/Web を含めず Read+Edit 中心＝数値・表の全文上書きを構造的に禁止。
        #
        # PM 2026-08-19 承認（動意日次 mover_report_daily.yml からの横展開）: Anthropic 側の過負荷応答
        # （API Error: 529 overloaded_error）を初回 API 呼び出しで受けて即 exit 1 する事故の恒久対策。
        # 第三者製の新規 action を足さず、continue-on-error + outcome 判定の再試行ステップだけで構成する。
        # 529 は即時再試行が無意味なため待機を指数的に伸ばす（60 秒 → 180 秒）。3 ステップとも
        # continue-on-error のため、成否は最後の Verify ステップ 1 箇所（成果物ファイルが非空か）で決まる。
        # 本ジョブに限り Claude は「決定論生成済みレポートへの理由層追記」専用のため、Verify は
        # レポート md の実在のみを必須とし、3 回とも追記に失敗した場合は警告のみで配信を続行する。
        id: gen1
        continue-on-error: true
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-5
          prompt_file: report-pipelines/prompts/sector-report-full.md
          allowed_tools: "Read,Edit,Bash,Grep,Glob"
          timeout_minutes: "20"
          claude_env: |
            CLAUDE_CODE_EFFORT_LEVEL: high
            CLAUDE_CODE_MAX_OUTPUT_TOKENS: 32000
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
          PRIVATE_REPO_ROOT: private-repo

      # PM 2026-09-05 承認: 枠切れ（Spending cap reached）は待機しても同一 run 内では回復しない。
      # 実測（2026-09-04 の夜間PTS動意 run）では枠切れ後の再試行が 1.5 秒で即時拒否されるだけで、
      # 待機が枠のリセット（数十分先）に届かず、空振りが当日の自動リトライ上限を食い潰していた。
      # よって枠切れを検出した試行の後続は打ち切る（一時障害のリトライは従来どおり残す）。
      - name: Detect spending cap (attempt 1)
        id: cap1
        if: success() && steps.gen1.outcome == 'failure'
        env:
          EXECUTION_FILE: ${{ steps.gen1.outputs.execution_file }}
          ATTEMPT: '1'
        run: bash report-pipelines/.github/scripts/detect_spending_cap.sh

      - name: Wait before retry 2 (Claude overloaded 等の一時エラー)
        if: success() && steps.gen1.outcome == 'failure' && steps.cap1.outputs.capped != 'true'
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: |
          # このジョブの Claude は既存レポートへの追記（Edit）専用のため、ファイルを退避すると
          # 決定論生成済みの本体まで失われる。よって退避はせず待機のみ行う。
          echo "1 回目が失敗しました。60 秒待機して再試行します（529 は即時再試行が無意味なため）"
          sleep 60

      - name: セクター「なぜ動いた」理由補完（Claude・追記専用） (retry 2)
        id: gen2
        if: success() && steps.gen1.outcome == 'failure' && steps.cap1.outputs.capped != 'true'
        continue-on-error: true
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-5
          prompt_file: report-pipelines/prompts/sector-report-full.md
          allowed_tools: "Read,Edit,Bash,Grep,Glob"
          timeout_minutes: "20"
          claude_env: |
            CLAUDE_CODE_EFFORT_LEVEL: high
            CLAUDE_CODE_MAX_OUTPUT_TOKENS: 32000
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
          PRIVATE_REPO_ROOT: private-repo

      - name: Detect spending cap (attempt 2)
        id: cap2
        if: success() && steps.gen2.outcome == 'failure'
        env:
          EXECUTION_FILE: ${{ steps.gen2.outputs.execution_file }}
          ATTEMPT: '2'
        run: bash report-pipelines/.github/scripts/detect_spending_cap.sh

      - name: Wait before retry 3 (Claude overloaded 等の一時エラー)
        if: success() && steps.gen2.outcome == 'failure' && steps.cap2.outputs.capped != 'true'
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: |
          # このジョブの Claude は既存レポートへの追記（Edit）専用のため、ファイルを退避すると
          # 決定論生成済みの本体まで失われる。よって退避はせず待機のみ行う。
          echo "2 回目も失敗しました。180 秒待機して最終再試行します"
          sleep 180

      - name: セクター「なぜ動いた」理由補完（Claude・追記専用） (retry 3)
        id: gen3
        if: success() && steps.gen2.outcome == 'failure' && steps.cap2.outputs.capped != 'true'
        continue-on-error: true
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-5
          prompt_file: report-pipelines/prompts/sector-report-full.md
          allowed_tools: "Read,Edit,Bash,Grep,Glob"
          timeout_minutes: "20"
          claude_env: |
            CLAUDE_CODE_EFFORT_LEVEL: high
            CLAUDE_CODE_MAX_OUTPUT_TOKENS: 32000
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
          PRIVATE_REPO_ROOT: private-repo

      - name: Verify sector full report (成否の一元判定)
        # 上の 3 ステップは全て continue-on-error のため、ジョブの成否はここだけで決まる。
        # 「どの試行で成功したか」に依存せず成果物の実在で判定するので、リトライ成功を失敗扱いする
        # / 失敗を成功扱いする判定崩れが起きない。
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: |
          F="private-repo/market/daily/sector/${TARGET_DATE}_full.md"
          echo "attempt outcomes: gen1=${{ steps.gen1.outcome }} gen2=${{ steps.gen2.outcome }} gen3=${{ steps.gen3.outcome }}"
          if [ ! -s "$F" ]; then
            echo "::error::セクター週次フルレポート（決定論生成）が見つかりません: $F"
            exit 1
          fi
          if [ "${{ steps.gen3.outcome }}" = "failure" ]; then
            echo "::warning::理由層の Claude 追記は 3 回とも失敗しました。決定論生成のレポートをそのまま配信します"
          fi
          echo "生成成功: $F ($(wc -l < "$F") lines)"

      - name: 品質注記の機械挿入（parquet 鮮度ずれ検知時のみ・タイトル行直後）
        # PM 2026-07-12（絶対配信原則）: Refresh の成否によらず、実際に使われた parquet の
        # PriceDataAsOf が対象週の金曜より古い場合（Refresh 失敗で commit 済み旧 parquet を使った
        # 場合を含む）は、実際の窓を明記した品質注記をレポート冒頭へ機械挿入して必ず配信する。
        id: annotate
        working-directory: ./private-repo
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
          PYTHONIOENCODING: utf-8
        run: |
          NOTE=$(python - <<'PY'
          import os
          from datetime import date, timedelta
          import pandas as pd
          t = date.fromisoformat(os.environ["TARGET_DATE"])
          friday = t - timedelta(days=(t.weekday() - 4) % 7)  # 対象週の金曜（アンカー）
          df = pd.read_parquet("bi/outputs/sector_weekly.parquet")
          asof = str(df["PriceDataAsOf"].iloc[0])[:10] if "PriceDataAsOf" in df.columns else ""
          if asof and date.fromisoformat(asof) < friday:
              print(f"週間ランキングの価格データ最新日は {asof}（対象週の金曜 {friday.isoformat()} に未達）。"
                    f"週次リターン・ランキングは {asof} までの窓（前週の可能性）。")
          PY
          )
          if [ -n "$NOTE" ]; then
            F=market/daily/sector/${TARGET_DATE}_full.md
            if [ -f "$F" ]; then
              awk -v note="> ⚠️ **品質注記**: ${NOTE}" 'NR==1{print; print ""; print note; next} {print}' "$F" > "${F}.tmp" && mv "${F}.tmp" "$F"
              echo "annotated=true" >> $GITHUB_OUTPUT
              echo "note=${NOTE}" >> $GITHUB_OUTPUT
              echo "品質注記を挿入: ${NOTE}"
            else
              echo "annotated=false" >> $GITHUB_OUTPUT
              echo "[WARN] レポート md が見つからないため注記なし: $F"
            fi
          else
            echo "annotated=false" >> $GITHUB_OUTPUT
            echo "品質フラグなし・注記挿入なし"
          fi

      - name: 相互参照ゲート（警告のみ・配信は止めない）
        # PM 2026-09-05 指示（_common_rules.md §40）: 誌面で他セクション・他順位・他銘柄行を
        # 指し示す表記（「〜を参照」「前述」「上記の」「同上」「再掲」等）を全レポート種別で禁止する。
        # 重複銘柄も各セクションで「何の会社」「なぜ動いた」を独立して書き切る。
        # 検出は警告のみ（continue-on-error）で配信は止めない（§36 絶対配信原則との整合）。
        # ログに残った検出は次回生成時に Claude が是正する。
        continue-on-error: true
        working-directory: ./private-repo
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python bi/pipelines/lib/crossref_check.py --file market/daily/sector/${{ steps.date.outputs.value }}_full.md || true

      - name: Send Discord (PDF)
        id: send
        working-directory: ./private-repo/bi/pipelines
        env:
          DISCORD_WEBHOOK_SECTOR: ${{ secrets.DISCORD_WEBHOOK_SECTOR }}
          PYTHONIOENCODING: utf-8
        run: |
          python send_report_pdf_discord.py --kind sector_full --date ${{ steps.date.outputs.value }}

      - name: Discord 通知（⚠️ 配信済み・品質注記あり）
        # PM 2026-07-12（絶対配信原則）: 品質問題があってもレポートは配信済み。何が注記されたかを PM へ通知。
        if: steps.annotate.outputs.annotated == 'true' && steps.send.outcome == 'success'
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_SECTOR }}
          state: partial
          label: セクター週次レポート 配信済み（品質注記あり）
          date: ${{ steps.date.outputs.value }}
          meaning: レポートは配信済みです。品質注記（${{ steps.annotate.outputs.note }}）を冒頭に付けています。
          action_required: レポート冒頭の品質注記を確認（数値を使う前に注記のデータ日付・週の窓を参照）

      - name: Commit and push to private repo
        # PM 2026-06-28: 生成 step が失敗しても再生成済 parquet を必ずコミットする（データ凍結防止）。
        # 旧来は gen 失敗で本 step がスキップされ、新鮮な sector_weekly.parquet が runner ごと破棄され
        # AsOf が 6/13 で 2 週間凍結した事故の恒久対策。
        # rebase 方式は並行 push に弱いため fresh-base 方式の共通ヘルパーへ置換。
        if: ${{ always() }}
        working-directory: ./private-repo
        run: |
          bash ../report-pipelines/bi/pipelines/ops/ci_commit_push.sh \
            -m "data: sector weekly full ${{ steps.date.outputs.value }}" \
            market/daily bi/outputs/sector_weekly.parquet bi/outputs/sector_stock_weekly.parquet

      - name: Discord 通知（⚠️ 配信済み・後処理のみ失敗）
        if: (failure() || cancelled()) && steps.send.outcome == 'success'
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_SECTOR }}
          state: partial
          label: セクター週次レポート 後処理のみ失敗
          date: ${{ steps.date.outputs.value }}
          meaning: レポート本体は配信済みです。配信後の commit だけが失敗しました。
          action_required: 不要（差分は次回 run が回収）

      - name: Discord 通知（❌ 失敗）
        if: (failure() || cancelled()) && steps.send.outcome != 'success'
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_SECTOR }}
          state: failed
          label: セクター週次レポート 失敗
          date: ${{ steps.date.outputs.value }}
          meaning: 生成または送信が完了せず、今週分は未配信です（集計 parquet は可能な範囲で commit 済み）。
          action_required: run ログ確認 → 手動 dispatch（force_rerun=true）で再実行
