name: セクター週次レポート（フルバージョン）

"on":
  # PM 2026-05-27 確定: Cloudflare Worker (mizuki-fund-scheduler-1) からの workflow_dispatch がメイン経路。
  # PM 2026-06-06 追加: Worker SPOF 回避のため GHA cron をフェイルセーフ併用。
  # 仮設定: 月曜 09:00 JST = UTC 00:00（週次レポート月曜朝想定）。
  # 正確な Worker 時刻が判明したら本値を Worker + 1h 程度に調整する。
  workflow_dispatch:
    inputs:
      target_date:
        description: '対象日付 (YYYY-MM-DD・空欄で当日の金曜)'
        required: false
        default: ''
  schedule:
    - cron: '0 0 * * 1'

concurrency:
  group: sector_report_weekly_full-weekly
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Check today's runs
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY_JST=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          TODAY_START="${TODAY_JST}T00:00:00+09:00"
          MY_RUN_ID=${{ github.run_id }}
          EVENT="${{ github.event_name }}"

          RUNS=$(gh api -X GET \
            "repos/${{ github.repository }}/actions/workflows/sector_report_weekly_full.yml/runs" \
            -f "created=>=${TODAY_START}" \
            --jq "[.workflow_runs[] | select(.id != ${MY_RUN_ID})]")

          ACTIVE=$(echo "$RUNS" | jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting" or .status=="action_required" or .status=="pending")] | length')
          DONE_OK=$(echo "$RUNS" | jq '[.[] | select(.conclusion=="success" or .conclusion=="neutral")] | length')
          DONE_FAIL=$(echo "$RUNS" | jq '[.[] | select(.conclusion=="failure" or .conclusion=="cancelled" or .conclusion=="startup_failure" or .conclusion=="timed_out" or .conclusion=="stale" or .conclusion=="action_required")] | length')

          echo "Today (${TODAY_JST}): active=${ACTIVE} done_ok=${DONE_OK} done_fail=${DONE_FAIL} event=${EVENT}"

          if [ "$DONE_OK" -gt 0 ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=skip (already succeeded today: done_ok=${DONE_OK})" >> $GITHUB_OUTPUT
          elif [ "$ACTIVE" -gt 0 ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=skip (active run exists: active=${ACTIVE})" >> $GITHUB_OUTPUT
          elif [ "$EVENT" = "schedule" ] && [ "$DONE_FAIL" -ge 2 ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=retry_cap (cron stopped: done_fail=${DONE_FAIL} >= 2)" >> $GITHUB_OUTPUT
          else
            echo "proceed=true" >> $GITHUB_OUTPUT
            if [ "$DONE_FAIL" -gt 0 ]; then
              echo "reason=recovery (done_fail=${DONE_FAIL})" >> $GITHUB_OUTPUT
            else
              echo "reason=initial" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Discord notification (cron or skip event)
        if: github.event_name == 'schedule' || steps.check.outputs.proceed == 'false'
        env:
          WH: ${{ secrets.DISCORD_WEBHOOK_SECTOR }}
        run: |
          REASON="${{ steps.check.outputs.reason }}"
          PROCEED="${{ steps.check.outputs.proceed }}"
          if [ "$PROCEED" = "true" ]; then
            MSG="🔶 GHA cron フェイルセーフ起動: セクター週次レポート (${REASON})"
          elif echo "$REASON" | grep -q "retry_cap"; then
            MSG="🚨 GHA cron 連続失敗で停止: セクター週次レポート (${REASON}) - 手動 dispatch で復旧してください"
          else
            MSG="🔵 ${{ github.event_name }} skip: セクター週次レポート (${REASON})"
          fi
          curl -s -X POST "$WH" -H "Content-Type: application/json" \
            -d "{\"content\":\"${MSG}\"}"

  generate:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90  # PM 2026-05-31: 40 -> 90 拡張（JQuants 429 リトライ + Deep Research 含むフル版で 55+ 分実績あり）

    steps:
      - name: Determine target date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            echo "value=${{ github.event.inputs.target_date }}" >> $GITHUB_OUTPUT
          else
            echo "value=$(TZ=Asia/Tokyo date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          fi

      - name: Checkout report-pipelines
        uses: actions/checkout@v4
        with:
          path: report-pipelines

      - name: Setup SSH for private repo
        env:
          PRIVATE_REPO_DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_REPO_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone private repo (mizuki-fund)
        run: |
          git clone git@github.com:mzinvestment1105/mizuki-fund.git private-repo

      - name: Copy pipelines and static files from Public into private working tree
        run: |
          cp -f report-pipelines/bi/pipelines/*.py private-repo/bi/pipelines/
          cp -f report-pipelines/bi/pipelines/requirements.txt private-repo/bi/pipelines/
          mkdir -p private-repo/bi/pipelines/lib
          cp -rf report-pipelines/bi/pipelines/lib/*.py private-repo/bi/pipelines/lib/ 2>/dev/null || true
          mkdir -p private-repo/agents private-repo/playbook
          cp -f report-pipelines/agents/*.md private-repo/agents/ 2>/dev/null || true
          cp -f report-pipelines/playbook/*.md private-repo/playbook/ 2>/dev/null || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: report-pipelines/bi/pipelines/requirements.txt

      - name: Install dependencies
        run: pip install -r report-pipelines/bi/pipelines/requirements.txt

      - name: Install Japanese fonts (Noto Sans CJK JP)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra

      - name: Install Playwright Chromium
        run: |
          playwright install chromium --with-deps

      - name: Check screening_master parquet existence (no update・PM 2026-05-23 確定)
        # PM 明示指示: screening_master 更新は 5 時間かかるため本 workflow 内で走らせない。
        # screening_master.yml の cron (16:30 JST) で別途更新される設計に依存・存在確認のみ。
        working-directory: ./private-repo/bi/pipelines
        env:
          PYTHONIOENCODING: utf-8
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          import pandas as pd

          parquet = Path("../outputs/screening_master.parquet")
          if not parquet.exists():
              print(f"[WARN] screening_master.parquet が見つかりません: {parquet}")
              print("       本 workflow では更新しない設計のため、screening_master.yml が事前に走っている前提です")
              # 存在しなくても fail させない・以降のステップは parquet 無しで動作可能なものは進める
              sys.exit(0)
          df = pd.read_parquet(parquet)
          latest = pd.to_datetime(df["DataDate"]).max().date().isoformat() if "DataDate" in df.columns else "unknown"
          target = os.environ.get("TARGET_DATE", "")
          print(f"screening_master DataDate: {latest} (target: {target})")
          print("PM 確定: 古くてもそのまま使う・更新は実行しない")
          PY

      - name: Refresh sector_weekly.parquet (make_sector_report.py --anchor friday)
        # PM 2026-05-30 確定: 週次セクターレポートに stale な sector_weekly.parquet（5/22 AsOf）が使われる事故が
        # 発生したため、Claude 実行前に必ず当週分のセクター集計を再生成する step を追加。
        # screening_master.parquet（commit 済の最新版）を universe として JQuants から週次価格を取得・集計。
        # 所要時間 5-15 分（screening_master.parquet 自体は更新しない）。
        working-directory: ./private-repo/bi/pipelines
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          python make_sector_report.py --anchor friday

      - name: 既存セクター週次フルレポートファイルを削除（前回不良ファイル読込スキップ防止）
        working-directory: ./private-repo
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: |
          TARGET_FILE="market/daily/sector/${TARGET_DATE}_full.md"
          if [ -f "$TARGET_FILE" ]; then
            echo "Removing existing $TARGET_FILE before Claude run..."
            rm -f "$TARGET_FILE"
          fi

      - name: Generate sector full report via Claude Code (Opus 4.7 + max thinking・Deep Research 内包)
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-4-7
          prompt_file: report-pipelines/prompts/sector-report-full.md
          allowed_tools: "Read,Write,Edit,Bash,Grep,Glob,WebSearch,WebFetch"
          timeout_minutes: "60"
          claude_env: |
            MAX_THINKING_TOKENS: 32000
            CLAUDE_CODE_MAX_OUTPUT_TOKENS: 64000
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
          PRIVATE_REPO_ROOT: private-repo
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          REPORT_EDITION: full

      - name: Send Discord (JPEG)
        working-directory: ./private-repo/bi/pipelines
        env:
          DISCORD_WEBHOOK_SECTOR: ${{ secrets.DISCORD_WEBHOOK_SECTOR }}
          PYTHONIOENCODING: utf-8
        run: |
          python send_report_jpeg_discord.py --kind sector_full --date ${{ steps.date.outputs.value }}

      - name: Commit and push to private repo
        working-directory: ./private-repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -- bi/pipelines/ agents/ playbook/ 2>/dev/null || true
          git clean -fd bi/pipelines/ agents/ playbook/ 2>/dev/null || true
          git add market/daily/ bi/outputs/sector_weekly.parquet bi/outputs/sector_stock_weekly.parquet 2>/dev/null || git add market/daily/
          if ! git diff --staged --quiet; then
            git stash push --keep-index --include-untracked -m "ci-cleanup" 2>/dev/null || true
            git commit -m "data: sector weekly full ${{ steps.date.outputs.value }}"
            git fetch origin master
            git rebase origin/master || (git diff --name-only --diff-filter=U | xargs -I{} git checkout --theirs {}; git diff --name-only --diff-filter=U | xargs git add; git -c core.editor=true rebase --continue)
            git push origin master
            git stash drop 2>/dev/null || true
          fi

      - name: Discord 通知（失敗）
        if: failure()
        env:
          DISCORD_WEBHOOK_SECTOR: ${{ secrets.DISCORD_WEBHOOK_SECTOR }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK_SECTOR" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"❌ セクター週次レポート（フルバージョン）失敗\n${{ steps.date.outputs.value }}\nログ確認: https://github.com/${{ github.repository }}/actions\"}"
