name: 動意銘柄レポート日次

"on":
  # PM 2026-05-27 確定: Cloudflare Worker (mizuki-fund-scheduler-1) からの workflow_dispatch がメイン経路。
  # PM 2026-06-05 追加: Worker 単一経路の SPOF 回避のため、Worker (16:33 JST) の約 1 時間後に
  # GHA cron をフェイルセーフとして併用。平日のみ（UTC 月-金 = 08:45）。
  # guard ジョブで当日既存 run を検知して重複発火を防ぐ。
  workflow_dispatch:
    inputs:
      target_date:
        description: '対象日付 (YYYY-MM-DD・空欄で当日)'
        required: false
        default: ''
      force_rerun:
        description: 'true で当日重複ガードを無視して強制実行（修正後の再テスト用）'
        required: false
        default: 'false'
  schedule:
    - cron: '45 8 * * 1-5'

# PM 2026-05-25 確定: weekly と同じく 3 並列構造に変更（32K 出力上限対策）。
# setup-raw ジョブが raw データ生成 + artifact upload。
# generate-market ジョブが matrix で prime / standard / growth を 3 並列実行。
# merge-and-send ジョブが 3 ファイル統合 + Discord 送信 + commit。

# PM 2026-06-06 修正: target_date による group 分裂を防ぐため固定 group へ変更。
concurrency:
  group: mover_report_daily-daily
  cancel-in-progress: false

jobs:
  guard:
    # PM 2026-06-05/06: status 全種類（cancelled / startup_failure / timed_out / stale 等）を漏れなく分類。
    # 判定: (1) DONE_OK >= 1 → skip / (2) ACTIVE >= 1 → skip
    #       (3) cron 起動かつ DONE_FAIL >= 2 → skip（連続失敗の課金暴走防止）
    #       (4) それ以外 → proceed（initial or recovery）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Check today's runs
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # force_rerun は「手動 workflow_dispatch かつ明示 true」の時のみ有効。
          # schedule(cron) / Cloudflare Worker / 通常 dispatch は既定 false のままで重複ガードが効く（誤再発火しない）。
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force_rerun }}" = "true" ]; then
            echo "proceed=true" >> $GITHUB_OUTPUT
            echo "reason=force_rerun (manual guard bypass)" >> $GITHUB_OUTPUT
            echo "force_rerun=true (手動): 重複ガードを無視して実行します"
            exit 0
          fi
          TODAY_JST=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          TODAY_START="${TODAY_JST}T00:00:00+09:00"
          MY_RUN_ID=${{ github.run_id }}
          EVENT="${{ github.event_name }}"

          RUNS=$(gh api -X GET \
            "repos/${{ github.repository }}/actions/workflows/mover_report_daily.yml/runs" \
            -f "created=>=${TODAY_START}" \
            --jq "[.workflow_runs[] | select(.id != ${MY_RUN_ID})]")

          ACTIVE=$(echo "$RUNS" | jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting" or .status=="action_required" or .status=="pending")] | length')
          DONE_OK=$(echo "$RUNS" | jq '[.[] | select(.conclusion=="success" or .conclusion=="neutral")] | length')
          DONE_FAIL=$(echo "$RUNS" | jq '[.[] | select(.conclusion=="failure" or .conclusion=="cancelled" or .conclusion=="startup_failure" or .conclusion=="timed_out" or .conclusion=="stale" or .conclusion=="action_required")] | length')

          echo "Today (${TODAY_JST}): active=${ACTIVE} done_ok=${DONE_OK} done_fail=${DONE_FAIL} event=${EVENT} (excluding self ${MY_RUN_ID})"

          if [ "$DONE_OK" -gt 0 ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=skip (already succeeded today: done_ok=${DONE_OK})" >> $GITHUB_OUTPUT
          elif [ "$ACTIVE" -gt 0 ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=skip (active run exists: active=${ACTIVE})" >> $GITHUB_OUTPUT
          elif [ "$EVENT" = "schedule" ] && [ "$DONE_FAIL" -ge 2 ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=retry_cap (cron stopped: done_fail=${DONE_FAIL} >= 2)" >> $GITHUB_OUTPUT
          else
            echo "proceed=true" >> $GITHUB_OUTPUT
            if [ "$DONE_FAIL" -gt 0 ]; then
              echo "reason=recovery (done_fail=${DONE_FAIL})" >> $GITHUB_OUTPUT
            else
              echo "reason=initial" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Discord notification (cron or skip event)
        if: github.event_name == 'schedule' || steps.check.outputs.proceed == 'false'
        env:
          WH: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
        run: |
          REASON="${{ steps.check.outputs.reason }}"
          PROCEED="${{ steps.check.outputs.proceed }}"
          if [ "$PROCEED" = "true" ]; then
            MSG="🔶 GHA cron フェイルセーフ起動: 動意銘柄レポート (${REASON})"
          elif echo "$REASON" | grep -q "retry_cap"; then
            MSG="🚨 GHA cron 連続失敗で停止: 動意銘柄レポート (${REASON}) - 手動 dispatch で復旧してください"
          else
            echo "skip 通知は抑制（ノイズ削減）: ${{ github.event_name }} skip (${REASON})"
            exit 0
          fi
          curl -s -X POST "$WH" -H "Content-Type: application/json" \
            -d "{\"content\":\"${MSG}\"}"

  setup-raw:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      target_date: ${{ steps.date.outputs.value }}
    steps:
      - name: Determine target date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            echo "value=${{ github.event.inputs.target_date }}" >> $GITHUB_OUTPUT
          else
            echo "value=$(TZ=Asia/Tokyo date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          fi

      - name: Checkout report-pipelines
        uses: actions/checkout@v4
        with:
          path: report-pipelines

      - name: Setup SSH for private repo
        env:
          PRIVATE_REPO_DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_REPO_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone private repo (mizuki-fund)
        run: |
          git clone git@github.com:mzinvestment1105/mizuki-fund.git private-repo

      - name: Copy pipelines and static files from Public into private working tree
        run: |
          cp -f report-pipelines/bi/pipelines/*.py private-repo/bi/pipelines/
          cp -f report-pipelines/bi/pipelines/requirements.txt private-repo/bi/pipelines/
          mkdir -p private-repo/bi/pipelines/lib
          cp -rf report-pipelines/bi/pipelines/lib/*.py private-repo/bi/pipelines/lib/ 2>/dev/null || true
          # PDF 配信用の埋め込みフォント（assets/fonts/*.woff2）を Public から overlay
          mkdir -p private-repo/bi/pipelines/assets/fonts
          cp -rf report-pipelines/bi/pipelines/assets/fonts/* private-repo/bi/pipelines/assets/fonts/ 2>/dev/null || true
          mkdir -p private-repo/agents private-repo/playbook
          cp -f report-pipelines/agents/*.md private-repo/agents/ 2>/dev/null || true
          cp -f report-pipelines/playbook/*.md private-repo/playbook/ 2>/dev/null || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: report-pipelines/bi/pipelines/requirements.txt

      - name: Install dependencies
        run: pip install -r report-pipelines/bi/pipelines/requirements.txt

      - name: Check screening_master parquet existence (no update・PM 2026-05-23 確定)
        working-directory: ./private-repo/bi/pipelines
        env:
          PYTHONIOENCODING: utf-8
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          import pandas as pd

          parquet = Path("../outputs/screening_master.parquet")
          if not parquet.exists():
              print(f"[WARN] screening_master.parquet が見つかりません: {parquet}")
              sys.exit(0)
          df = pd.read_parquet(parquet)
          latest = pd.to_datetime(df["DataDate"]).max().date().isoformat() if "DataDate" in df.columns else "unknown"
          target = os.environ.get("TARGET_DATE", "")
          print(f"screening_master DataDate: {latest} (target: {target})")
          PY

      - name: Generate movers raw (make_mover_report.py --no-pdf)
        # PM 2026-05-25 確定: setup-raw ジョブで 1 回だけ実行・artifact 共有で
        # 3 並列ジョブの JQuants API 過剰呼び出しを回避。
        working-directory: ./private-repo/bi/pipelines
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          EDINETDB_API_KEYS: ${{ secrets.EDINETDB_API_KEYS }}
          PYTHONIOENCODING: utf-8
        run: |
          python make_mover_report.py --date ${{ steps.date.outputs.value }} --no-pdf

      - name: Append 立花証券 e支店 API context to movers raw
        # 動意銘柄 raw 末尾に QUICK 個別解説（動意理由）+ AI 市況 + 信用残・逆日歩を追記
        # 認証情報未設定なら skip（後方互換）
        working-directory: ./private-repo/bi/pipelines
        env:
          TACHIBANA_DEMO_AUTH_ID: ${{ secrets.TACHIBANA_DEMO_AUTH_ID }}
          TACHIBANA_DEMO_PRIVATE_KEY_PEM: ${{ secrets.TACHIBANA_DEMO_PRIVATE_KEY_PEM }}
          TACHIBANA_DEMO_API_BASE: ${{ secrets.TACHIBANA_DEMO_API_BASE }}
          PYTHONIOENCODING: utf-8
        continue-on-error: true
        run: |
          if [ -z "$TACHIBANA_DEMO_AUTH_ID" ]; then
            echo "[INFO] 立花証券 Secrets 未設定・skip"
            exit 0
          fi
          python fetch_tachibana_mover_context.py --date ${{ steps.date.outputs.value }}

      - name: Upload movers raw as artifact
        uses: actions/upload-artifact@v4
        with:
          name: movers-raw-${{ steps.date.outputs.value }}
          path: private-repo/market/daily/${{ steps.date.outputs.value }}_movers_raw.md
          retention-days: 7
          if-no-files-found: error

  generate-market:
    needs: setup-raw
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        # PM 2026-06-14 確定: 銘柄数最多の growth を growth_a(6,7) / growth_b(8c) に2分割し
        # 1実行あたりのコンテキスト負荷を下げ、文脈喪失による raw 再読ループ・コスト枠超過を防ぐ。
        market: [prime, standard, growth_a, growth_b]
    steps:
      - name: Checkout report-pipelines
        uses: actions/checkout@v4
        with:
          path: report-pipelines

      - name: Setup SSH for private repo
        env:
          PRIVATE_REPO_DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_REPO_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone private repo (mizuki-fund)
        run: |
          git clone git@github.com:mzinvestment1105/mizuki-fund.git private-repo

      - name: Copy pipelines and static files from Public into private working tree
        run: |
          cp -f report-pipelines/bi/pipelines/*.py private-repo/bi/pipelines/
          cp -f report-pipelines/bi/pipelines/requirements.txt private-repo/bi/pipelines/
          mkdir -p private-repo/bi/pipelines/lib
          cp -rf report-pipelines/bi/pipelines/lib/*.py private-repo/bi/pipelines/lib/ 2>/dev/null || true
          # PDF 配信用の埋め込みフォント（assets/fonts/*.woff2）を Public から overlay
          mkdir -p private-repo/bi/pipelines/assets/fonts
          cp -rf report-pipelines/bi/pipelines/assets/fonts/* private-repo/bi/pipelines/assets/fonts/ 2>/dev/null || true
          mkdir -p private-repo/agents private-repo/playbook
          cp -f report-pipelines/agents/*.md private-repo/agents/ 2>/dev/null || true
          cp -f report-pipelines/playbook/*.md private-repo/playbook/ 2>/dev/null || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: report-pipelines/bi/pipelines/requirements.txt

      - name: Install dependencies
        run: pip install -r report-pipelines/bi/pipelines/requirements.txt

      - name: Install Japanese fonts (Noto Sans CJK JP)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra

      - name: Install Playwright Chromium
        run: |
          playwright install chromium --with-deps

      - name: Download movers raw artifact (from setup-raw)
        # PM 2026-05-25 確定: setup-raw ジョブで生成した raw を全 generate-market 並列で共有
        uses: actions/download-artifact@v4
        with:
          name: movers-raw-${{ needs.setup-raw.outputs.target_date }}
          path: /tmp/movers-raw

      - name: Place movers raw into private working tree
        working-directory: ./private-repo
        env:
          TARGET_DATE: ${{ needs.setup-raw.outputs.target_date }}
          TARGET_MARKET: ${{ matrix.market }}
        run: |
          mkdir -p market/daily
          SRC=/tmp/movers-raw/${TARGET_DATE}_movers_raw.md
          DST=market/daily/${TARGET_DATE}_movers_raw.md
          # PM 2026-06-13 確定: standard / growth ジョブには担当市場の節のみ渡し、
          # 担当外市場（プライム/スタンダード ~1,960 行）の無駄読み・同一 offset 再読込ループを構造的に防ぐ。
          # prime は Section 9 が全市場横断のため全 raw を保持する。
          case "$TARGET_MARKET" in
            growth_a|growth_b)
              awk '/^## グロース/{f=1} f' "$SRC" > "$DST"
              ;;
            standard)
              awk '/^## スタンダード/{f=1} /^## グロース/{f=0} f' "$SRC" > "$DST"
              ;;
            *)
              cp "$SRC" "$DST"
              ;;
          esac
          # 抽出失敗（見出し不一致等）の保険: 極端に短ければ全 raw にフォールバック
          if [ "$(wc -l < "$DST")" -lt 20 ]; then
            echo "Sliced raw too short for market=$TARGET_MARKET; falling back to full raw"
            cp "$SRC" "$DST"
          fi
          echo "Placed $DST for market=$TARGET_MARKET ($(wc -l < "$DST") lines / source $(wc -l < "$SRC") lines)"

      - name: 既存日次レポートファイル群を削除（前回不良ファイル読込スキップ防止）
        working-directory: ./private-repo
        env:
          TARGET_DATE: ${{ needs.setup-raw.outputs.target_date }}
          TARGET_MARKET: ${{ matrix.market }}
        run: |
          for SUFFIX in "" "_${TARGET_MARKET}"; do
            TARGET_FILE="market/daily/movers/${TARGET_DATE}${SUFFIX}.md"
            if [ -f "$TARGET_FILE" ]; then
              echo "Removing existing $TARGET_FILE..."
              rm -f "$TARGET_FILE"
            fi
          done

      - name: Generate ${{ matrix.market }} market section via Claude Code (Opus 4.7 + max thinking)
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-4-7
          prompt_file: report-pipelines/prompts/mover-report.md
          allowed_tools: "Read,Write,Edit,Bash,Grep,Glob,WebSearch,WebFetch"
          timeout_minutes: "45"
          claude_env: |
            MAX_THINKING_TOKENS: 32000
            CLAUDE_CODE_MAX_OUTPUT_TOKENS: 32000
        env:
          TARGET_DATE: ${{ needs.setup-raw.outputs.target_date }}
          TARGET_MARKET: ${{ matrix.market }}
          PRIVATE_REPO_ROOT: private-repo
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: 32000

      - name: Upload market section as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mover-daily-${{ matrix.market }}-${{ needs.setup-raw.outputs.target_date }}
          path: private-repo/market/daily/movers/${{ needs.setup-raw.outputs.target_date }}_${{ matrix.market }}.md
          retention-days: 7
          if-no-files-found: error

      - name: Discord 通知（市場別失敗）
        if: failure()
        env:
          DISCORD_WEBHOOK_MOVERS: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK_MOVERS" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"❌ 動意レポート（${{ matrix.market }} 市場）失敗\n${{ needs.setup-raw.outputs.target_date }}\nログ確認: https://github.com/${{ github.repository }}/actions\"}"

  merge-and-send:
    needs: [setup-raw, generate-market]
    runs-on: ubuntu-latest
    # PM 2026-07-01: フォント/Playwright の apt 導入が遅い日（実測14分）に 15 分枠だと
    # ゲート到達前にジョブ timeout でキャンセルされ未送信になる。余裕を持って 30 分へ。
    timeout-minutes: 30
    steps:
      - name: Checkout report-pipelines
        uses: actions/checkout@v4
        with:
          path: report-pipelines

      - name: Setup SSH for private repo
        env:
          PRIVATE_REPO_DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_REPO_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone private repo (mizuki-fund)
        run: |
          git clone git@github.com:mzinvestment1105/mizuki-fund.git private-repo

      - name: Copy pipelines from Public into private working tree
        run: |
          cp -f report-pipelines/bi/pipelines/*.py private-repo/bi/pipelines/
          cp -f report-pipelines/bi/pipelines/requirements.txt private-repo/bi/pipelines/
          mkdir -p private-repo/bi/pipelines/lib
          cp -rf report-pipelines/bi/pipelines/lib/*.py private-repo/bi/pipelines/lib/ 2>/dev/null || true
          # PDF 配信用の埋め込みフォント（assets/fonts/*.woff2）を Public から overlay
          mkdir -p private-repo/bi/pipelines/assets/fonts
          cp -rf report-pipelines/bi/pipelines/assets/fonts/* private-repo/bi/pipelines/assets/fonts/ 2>/dev/null || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: report-pipelines/bi/pipelines/requirements.txt

      - name: Install dependencies
        run: pip install -r report-pipelines/bi/pipelines/requirements.txt

      - name: Install Japanese fonts (Noto Sans CJK JP)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra

      - name: Install Playwright Chromium
        run: |
          playwright install chromium --with-deps

      - name: Download all market artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mover-daily-*-${{ needs.setup-raw.outputs.target_date }}
          path: /tmp/market-artifacts
          merge-multiple: true

      - name: Place market files and merge into {date}.md
        working-directory: ./private-repo
        env:
          TARGET_DATE: ${{ needs.setup-raw.outputs.target_date }}
        run: |
          MOVERS_DIR="market/daily/movers"
          mkdir -p "$MOVERS_DIR"
          rm -f "${MOVERS_DIR}/${TARGET_DATE}.md"
          for MARKET in prime standard growth_a growth_b; do
            SRC="/tmp/market-artifacts/${TARGET_DATE}_${MARKET}.md"
            DST="${MOVERS_DIR}/${TARGET_DATE}_${MARKET}.md"
            if [ ! -f "$SRC" ]; then
              echo "ERROR: artifact not found: $SRC"
              exit 1
            fi
            cp "$SRC" "$DST"
            echo "Placed $DST ($(wc -l < "$DST") lines)"
          done
          # マージ順: prime(0,2,3,8a,9) → standard(4,5,8b) → growth_a(6,7) → growth_b(8c)
          # send_report_pdf_discord.py はマージ後 {date}.md からセクション6/7/8cを集めて
          # グロース PDF を生成するため、growth_a/growth_b を分割しても送信は透過的。
          OUTPUT="${MOVERS_DIR}/${TARGET_DATE}.md"
          cat "${MOVERS_DIR}/${TARGET_DATE}_prime.md" > "$OUTPUT"
          echo "" >> "$OUTPUT"
          cat "${MOVERS_DIR}/${TARGET_DATE}_standard.md" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          cat "${MOVERS_DIR}/${TARGET_DATE}_growth_a.md" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          cat "${MOVERS_DIR}/${TARGET_DATE}_growth_b.md" >> "$OUTPUT"
          echo "Merged into $OUTPUT ($(wc -l < "$OUTPUT") lines)"

      - name: 件数ゲート（売買代金/値上がり/値下がり・不足なら送信中止）
        working-directory: ./private-repo
        env:
          TARGET_DATE: ${{ needs.setup-raw.outputs.target_date }}
          PYTHONIOENCODING: utf-8
        run: |
          python bi/pipelines/check_mover_counts.py --file market/daily/movers/${TARGET_DATE}.md

      - name: Send Discord (PDF・市場別 3 枚分割)
        working-directory: ./private-repo/bi/pipelines
        env:
          DISCORD_WEBHOOK_MOVERS: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
          PYTHONIOENCODING: utf-8
        run: |
          python send_report_pdf_discord.py --kind movers --date ${{ needs.setup-raw.outputs.target_date }}

      - name: Commit and push to private repo
        working-directory: ./private-repo
        env:
          TARGET_DATE: ${{ needs.setup-raw.outputs.target_date }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -- bi/pipelines/ 2>/dev/null || true
          git clean -fd bi/pipelines/ 2>/dev/null || true
          git add market/daily/
          if ! git diff --staged --quiet; then
            git stash push --keep-index --include-untracked -m "ci-cleanup" 2>/dev/null || true
            git commit -m "data: mover report ${TARGET_DATE}"
            git fetch origin master
            git rebase origin/master || (git diff --name-only --diff-filter=U | xargs -I{} git checkout --theirs {}; git diff --name-only --diff-filter=U | xargs git add; git -c core.editor=true rebase --continue)
            git push origin master
            git stash drop 2>/dev/null || true
          fi

      - name: Discord 通知（merge 失敗）
        if: failure()
        env:
          DISCORD_WEBHOOK_MOVERS: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK_MOVERS" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"❌ 動意レポート merge/送信失敗\n${{ needs.setup-raw.outputs.target_date }}\nログ確認: https://github.com/${{ github.repository }}/actions\"}"
