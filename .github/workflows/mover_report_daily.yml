name: 動意銘柄レポート日次

"on":
  # PM 2026-05-27 確定: Cloudflare Worker (mizuki-fund-scheduler-1) からの workflow_dispatch がメイン経路。
  # PM 2026-06-05 追加: Worker 単一経路の SPOF 回避のため、Worker (16:33 JST) の約 1 時間後に
  # GHA cron をフェイルセーフとして併用。平日のみ（UTC 月-金 = 08:45）。
  # guard ジョブで当日既存 run を検知して重複発火を防ぐ。
  workflow_dispatch:
    inputs:
      target_date:
        description: '対象日付 (YYYY-MM-DD・空欄で当日)'
        required: false
        default: ''
      force_rerun:
        description: 'true で当日重複ガードを無視して強制実行（修正後の再テスト用）'
        required: false
        default: 'false'
  schedule:
    - cron: '45 8 * * 1-5'

# PM 2026-08-26 確定: 旧 4 並列（prime/standard/growth_a/growth_b）を 1 実行へ統合。
# setup-raw ジョブが raw データ生成 + artifact upload。
# generate-market ジョブが market=all の 1 実行で全 3 市場を 1 ファイルへ生成。
# merge-and-send ジョブが単一ファイルを配置 + Discord 送信 + commit。
# 並び順はグロース → スタンダード → プライム（prompts/mover-report.md が制御）。

# PM 2026-06-06 修正: target_date による group 分裂を防ぐため固定 group へ変更。
concurrency:
  group: mover_report_daily-daily
  cancel-in-progress: false

jobs:
  guard:
    # PM 2026-06-05/06: status 全種類（cancelled / startup_failure / timed_out / stale 等）を漏れなく分類。
    # 判定: (1) DONE_OK >= 1 → skip / (2) ACTIVE >= 1 → skip
    #       (3) cron 起動かつ DONE_FAIL >= 2 → skip（連続失敗の課金暴走防止）
    #       (4) それ以外 → proceed（initial or recovery）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      # 通知 composite action（.github/actions/notify-discord）を使うため checkout が必要
      - name: Checkout report-pipelines (通知 action 用)
        uses: actions/checkout@v4

      - name: Check today's runs
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # force_rerun は「手動 workflow_dispatch かつ明示 true」の時のみ有効。
          # schedule(cron) / Cloudflare Worker / 通常 dispatch は既定 false のままで重複ガードが効く（誤再発火しない）。
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force_rerun }}" = "true" ]; then
            echo "proceed=true" >> $GITHUB_OUTPUT
            echo "reason=force_rerun (manual guard bypass)" >> $GITHUB_OUTPUT
            echo "force_rerun=true (手動): 重複ガードを無視して実行します"
            exit 0
          fi
          TODAY_JST=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          MY_RUN_ID=${{ github.run_id }}
          EVENT="${{ github.event_name }}"

          # 2026-07-07: GitHub cron は数時間遅延することがあり、深夜に遅延着火すると日付ズレ
          # レポートを発行する事故源になる（macro/position_check と同方式の時間帯ゲートを移植）。
          # schedule(cron) 起動のみ JST 15〜23 時の外なら skip。workflow_dispatch は常に通す。
          HOUR_JST=$((10#$(TZ=Asia/Tokyo date +%H)))
          if [ "$EVENT" = "schedule" ] && { [ "$HOUR_JST" -lt 15 ] || [ "$HOUR_JST" -gt 23 ]; }; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=skip (cron outside evening window: ${HOUR_JST}h JST)" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 2026-08-05 修正: run 単位の conclusion は「guard が本体ジョブを skip した run」まで
          # success と数えてしまい、本命の発火を「本日配信済み」と誤認して無言 skip させる。
          # 実際に配信/更新を行うジョブ（merge-and-send）の結果だけで判定する。
          STATS=$(bash .github/scripts/check_delivery.sh mover_report_daily.yml merge-and-send "${MY_RUN_ID}")
          DONE_OK=$(echo "$STATS" | jq -r '.delivered')
          DONE_FAIL=$(echo "$STATS" | jq -r '.failed')
          ACTIVE=$(( $(echo "$STATS" | jq -r '.sending') + $(echo "$STATS" | jq -r '.dispatch_pending') + $(echo "$STATS" | jq -r '.schedule_pending') ))

          echo "Today (${TODAY_JST}): active=${ACTIVE} done_ok=${DONE_OK} done_fail=${DONE_FAIL} event=${EVENT} (excluding self ${MY_RUN_ID})"

          # 2026-08-19: 予備タイマー通知の文面へ実測値を埋めるため、判定に使った当日実績を output 化。
          echo "active=${ACTIVE}" >> $GITHUB_OUTPUT
          echo "done_ok=${DONE_OK}" >> $GITHUB_OUTPUT
          echo "done_fail=${DONE_FAIL}" >> $GITHUB_OUTPUT

          if [ "$DONE_OK" -gt 0 ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=skip (already succeeded today: done_ok=${DONE_OK})" >> $GITHUB_OUTPUT
          elif [ "$ACTIVE" -gt 0 ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=skip (active run exists: active=${ACTIVE})" >> $GITHUB_OUTPUT
          elif [ "$EVENT" = "schedule" ] && [ "$DONE_FAIL" -ge 2 ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=retry_cap (cron stopped: done_fail=${DONE_FAIL} >= 2)" >> $GITHUB_OUTPUT
          else
            echo "proceed=true" >> $GITHUB_OUTPUT
            if [ "$DONE_FAIL" -gt 0 ]; then
              echo "reason=recovery (done_fail=${DONE_FAIL})" >> $GITHUB_OUTPUT
            else
              echo "reason=initial" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Discord 通知（⏱ 予備タイマー起動）
        if: github.event_name == 'schedule' && steps.check.outputs.proceed == 'true'
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
          state: timer
          label: 動意銘柄レポート 予備タイマー起動
          # 2026-08-19 修正: 旧文面は「Worker 発火が届かなかった」と断定していたが、Worker が正常着弾し
          # その run が失敗した場合も同じ通知が出る。guard が実際に把握している当日実績のみを述べる。
          meaning: '本日の生成がまだ成功していないため、GHA 側の予備タイマーが救援起動しました（本日: 成功 ${{ steps.check.outputs.done_ok }} 件・失敗 ${{ steps.check.outputs.done_fail }} 件・実行中 ${{ steps.check.outputs.active }} 件）。レポートはこのあと通常どおり届きます。'
          action_required: 不要（このあとレポートが届けば復旧完了。届かない場合のみ run ログを確認）

      - name: Discord 通知（🚨 自動リトライ停止）
        if: contains(steps.check.outputs.reason, 'retry_cap')
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
          state: alert
          label: 動意銘柄レポート 自動リトライ停止
          meaning: 当日 2 回以上失敗したため cron の自動再実行を停止しました。本日未配信です。
          action_required: run ログ確認 → 原因解消後に手動 dispatch（force_rerun=true）で再実行

      - name: Discord 通知（guard 失敗）
        if: failure() || cancelled()
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_MOVERS || secrets.DISCORD_WEBHOOK_URL }}
          state: failed
          label: 動意銘柄レポート guard 失敗
          meaning: 実行前チェック（当日重複判定）自体がエラーになり、生成ジョブが起動していません。
          action_required: run ログ確認 → 手動 dispatch で再実行

  setup-raw:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    # PM 2026-07-01: 株探/みんかぶ等のスクレイピングが 403 で弾かれる日（GHA IP ブロック）に
    # ニュース取得段が遅延し 20 分枠を超えてキャンセルされ未送信になる。余裕を持って 35 分へ。
    # PM 2026-07-12: 対象日 EOD 未着時の待機リトライ（20 分 × 最大 2 回）を追加したため 90 分へ。
    timeout-minutes: 90
    outputs:
      target_date: ${{ steps.date.outputs.value }}
    steps:
      - name: Determine target date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            echo "value=${{ github.event.inputs.target_date }}" >> $GITHUB_OUTPUT
          else
            echo "value=$(TZ=Asia/Tokyo date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          fi

      - name: Checkout report-pipelines
        uses: actions/checkout@v4
        with:
          path: report-pipelines

      - name: Setup SSH for private repo
        env:
          PRIVATE_REPO_DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_REPO_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone private repo (mizuki-fund)
        run: |
          git clone git@github.com:mzinvestment1105/mizuki-fund.git private-repo

      - name: Copy pipelines and static files from Public into private working tree
        run: |
          cp -f report-pipelines/bi/pipelines/*.py private-repo/bi/pipelines/
          cp -f report-pipelines/bi/pipelines/requirements.txt private-repo/bi/pipelines/
          mkdir -p private-repo/bi/pipelines/lib
          cp -rf report-pipelines/bi/pipelines/lib/*.py private-repo/bi/pipelines/lib/ 2>/dev/null || true
          # PDF 配信用の埋め込みフォント（assets/fonts/*.woff2）を Public から overlay
          mkdir -p private-repo/bi/pipelines/assets/fonts
          cp -rf report-pipelines/bi/pipelines/assets/fonts/* private-repo/bi/pipelines/assets/fonts/ 2>/dev/null || true
          mkdir -p private-repo/agents private-repo/playbook
          cp -f report-pipelines/agents/*.md private-repo/agents/ 2>/dev/null || true
          cp -f report-pipelines/playbook/*.md private-repo/playbook/ 2>/dev/null || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: report-pipelines/bi/pipelines/requirements.txt

      - name: Install dependencies
        run: pip install -r report-pipelines/bi/pipelines/requirements.txt

      - name: Check screening_master parquet existence (no update・PM 2026-05-23 確定)
        working-directory: ./private-repo/bi/pipelines
        env:
          PYTHONIOENCODING: utf-8
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          import pandas as pd

          parquet = Path("../outputs/screening_master.parquet")
          if not parquet.exists():
              print(f"[WARN] screening_master.parquet が見つかりません: {parquet}")
              sys.exit(0)
          df = pd.read_parquet(parquet)
          latest = pd.to_datetime(df["DataDate"]).max().date().isoformat() if "DataDate" in df.columns else "unknown"
          target = os.environ.get("TARGET_DATE", "")
          print(f"screening_master DataDate: {latest} (target: {target})")
          PY

      - name: Generate movers raw (make_mover_report.py --no-pdf)
        # PM 2026-05-25 確定: setup-raw ジョブで 1 回だけ実行・artifact 共有で
        # 3 並列ジョブの JQuants API 過剰呼び出しを回避。
        # PM 2026-07-12 改定（絶対配信原則）: 対象日 EOD 未着時は ①軽量プローブ（--probe-date-only）
        # で 20 分待機 × 最大 2 回の再確認 ②なお未着でも生成を中止しない（--date-gate=注記モード。
        # 真のデータ日付のまま生成し、品質注記を raw 冒頭と {date}_quality_flags.txt に出力 →
        # merge-and-send がレポート冒頭へ機械挿入して必ず配信）。旧「exit 3 → ⛔ 生成中止＝未配信」
        # 設計は PM 却下。本 step の失敗（exit 非0）はインフラ失敗（❌）のみ。
        id: raw
        working-directory: ./private-repo/bi/pipelines
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          EDINETDB_API_KEYS: ${{ secrets.EDINETDB_API_KEYS }}
          PYTHONIOENCODING: utf-8
        run: |
          D=${{ steps.date.outputs.value }}
          for i in 1 2 3; do
            if python make_mover_report.py --date "$D" --probe-date-only; then
              break
            fi
            if [ "$i" -lt 3 ]; then
              echo "対象日 EOD 未着・20 分待機して再確認します（待機 $i/2 回目）"
              sleep 1200
            fi
          done
          python make_mover_report.py --date "$D" --no-pdf --date-gate

      - name: Append 立花証券 e支店 API context to movers raw
        # 動意銘柄 raw 末尾に QUICK 個別解説（動意理由）+ AI 市況 + 信用残・逆日歩を追記
        # 認証情報未設定なら skip（後方互換）
        working-directory: ./private-repo/bi/pipelines
        env:
          TACHIBANA_DEMO_AUTH_ID: ${{ secrets.TACHIBANA_DEMO_AUTH_ID }}
          TACHIBANA_DEMO_PRIVATE_KEY_PEM: ${{ secrets.TACHIBANA_DEMO_PRIVATE_KEY_PEM }}
          TACHIBANA_DEMO_API_BASE: ${{ secrets.TACHIBANA_DEMO_API_BASE }}
          PYTHONIOENCODING: utf-8
        continue-on-error: true
        run: |
          if [ -z "$TACHIBANA_DEMO_AUTH_ID" ]; then
            echo "[INFO] 立花証券 Secrets 未設定・skip"
            exit 0
          fi
          python fetch_tachibana_mover_context.py --date ${{ steps.date.outputs.value }}

      - name: Upload movers raw as artifact
        # PM 2026-07-12: 品質フラグ（{date}_quality_flags.txt・--date-gate が常時出力）を同梱し、
        # merge-and-send の注記挿入 step へ届ける。両パスの共通親が market/daily のため
        # ダウンロード側のフラット配置（/tmp/movers-raw/ 直下）は従来と変わらない。
        uses: actions/upload-artifact@v4
        with:
          name: movers-raw-${{ steps.date.outputs.value }}
          path: |
            private-repo/market/daily/${{ steps.date.outputs.value }}_movers_raw.md
            private-repo/market/daily/${{ steps.date.outputs.value }}_quality_flags.txt
          retention-days: 7
          if-no-files-found: error

      - name: Commit theme_radar accumulation to private repo
        # PM 2026-09-02 配線修正: theme_radar の日次蓄積
        # （bi/outputs/analysis/theme_radar/movers_top100_daily.parquet・stock_context_daily.parquet）は
        # 直前の make_mover_report.py（append_movers_history / append_stock_context）が本ジョブの
        # working tree に書き出すが、どの workflow の commit 対象にも入っておらず一度も push されて
        # いなかった（merge-and-send は別ジョブの fresh clone のため、そちらでは検出できない）。
        # PTS レポート workflow は Private を clone してこの蓄積を読む（make_pts_mover_report.py が
        # theme_radar を import）ため、未 push だと PTS のテーマ欄・遡り材料が本番で機能しない。
        # -f は gitignore 対象の未追跡 parquet を ci_commit_push.sh の差分検出（--ignored=matching）と
        # git add -f に載せるために必須（Private .gitignore 側にも un-ignore 行を追加済み）。
        # 蓄積の欠落は配信を止める理由にならないため continue-on-error（絶対配信原則）。
        continue-on-error: true
        working-directory: ./private-repo
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: |
          bash ../report-pipelines/bi/pipelines/ops/ci_commit_push.sh \
            -m "data: theme_radar accumulation ${TARGET_DATE}" \
            -f bi/outputs/analysis/theme_radar

      - name: Discord 通知（❌ raw 生成失敗）
        if: failure() || cancelled()
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
          state: failed
          label: 動意銘柄レポート 失敗（raw 生成）
          date: ${{ steps.date.outputs.value }}
          meaning: 動意銘柄の元データ（raw）生成が失敗し、後続の市場別生成が始まらないため本日未配信です。
          action_required: run ログ確認 → 手動 dispatch（force_rerun=true）で再実行

  generate-market:
    needs: setup-raw
    runs-on: ubuntu-latest
    # PM 2026-08-26: 4 並列を 1 実行へ統合し、1 ジョブが 3 市場 40 銘柄を書くため各試行の枠を拡張
    # （gen1 45→60 分・gen2/gen3 30→45 分）。
    # 最悪ケース = 前段 10 分 + 1 回目 60 分 + 待機 1 分 + 2 回目 45 分 + 待機 3 分 + 3 回目 45 分
    #            + 検証/artifact 2 分 = 166 分 → 余裕を見て 175 分。
    timeout-minutes: 175
    strategy:
      fail-fast: false
      matrix:
        # PM 2026-08-26 確定: 固定プロンプト121KB×4重複を解消するため1実行へ統合。
        # 並び順はグロース→スタンダード→プライム（prompts/mover-report.md が制御）。
        # 旧構成 [prime, standard, growth_a, growth_b] の4分割は「出力32Kトークン上限」が根拠だったが、
        # 2026-07-07 に CLAUDE_CODE_MAX_OUTPUT_TOKENS を 64000 へ引き上げ済みで根拠が消滅した
        # （実績出力は4セクション合計で枠の約1/3）。matrix 構造自体は参照箇所の書き換えを
        # 最小にするため残し、値だけを [all] の1値に畳む。
        market: [all]
    steps:
      - name: Checkout report-pipelines
        uses: actions/checkout@v4
        with:
          path: report-pipelines

      - name: Setup SSH for private repo
        env:
          PRIVATE_REPO_DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_REPO_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone private repo (mizuki-fund)
        run: |
          git clone git@github.com:mzinvestment1105/mizuki-fund.git private-repo

      - name: Copy pipelines and static files from Public into private working tree
        run: |
          cp -f report-pipelines/bi/pipelines/*.py private-repo/bi/pipelines/
          cp -f report-pipelines/bi/pipelines/requirements.txt private-repo/bi/pipelines/
          mkdir -p private-repo/bi/pipelines/lib
          cp -rf report-pipelines/bi/pipelines/lib/*.py private-repo/bi/pipelines/lib/ 2>/dev/null || true
          # PDF 配信用の埋め込みフォント（assets/fonts/*.woff2）を Public から overlay
          mkdir -p private-repo/bi/pipelines/assets/fonts
          cp -rf report-pipelines/bi/pipelines/assets/fonts/* private-repo/bi/pipelines/assets/fonts/ 2>/dev/null || true
          mkdir -p private-repo/agents private-repo/playbook
          cp -f report-pipelines/agents/*.md private-repo/agents/ 2>/dev/null || true
          cp -f report-pipelines/playbook/*.md private-repo/playbook/ 2>/dev/null || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: report-pipelines/bi/pipelines/requirements.txt

      - name: Install dependencies
        run: pip install -r report-pipelines/bi/pipelines/requirements.txt

      # PM 2026-07-05: generate-market は .md 生成のみ（PDF 化は merge-and-send 側）のため
      # Japanese fonts / Playwright のインストールは不要・削除。

      - name: Download movers raw artifact (from setup-raw)
        # PM 2026-05-25 確定: setup-raw ジョブで生成した raw を全 generate-market 並列で共有
        uses: actions/download-artifact@v4
        with:
          name: movers-raw-${{ needs.setup-raw.outputs.target_date }}
          path: /tmp/movers-raw

      - name: Place movers raw into private working tree
        working-directory: ./private-repo
        env:
          TARGET_DATE: ${{ needs.setup-raw.outputs.target_date }}
          TARGET_MARKET: ${{ matrix.market }}
        run: |
          mkdir -p market/daily
          SRC=/tmp/movers-raw/${TARGET_DATE}_movers_raw.md
          DST=market/daily/${TARGET_DATE}_movers_raw.md
          # PM 2026-08-26 確定: 統合後は全市場を1実行が担当するため raw は無加工で全量を渡す
          # （旧 case 文による市場別スライス〈standard / growth へ担当市場の節のみ渡す〉は統合により不要）。
          # raw ヘッダ（タイトル・価格比較・「対象日市場概況」ブロック）も全量に含まれるため、
          # 「本日の地合い」の引用元と対象日検証のアンカーはそのまま届く。
          cp "$SRC" "$DST"
          echo "Placed $DST for market=$TARGET_MARKET ($(wc -l < "$DST") lines / source $(wc -l < "$SRC") lines)"

      - name: 既存日次レポートファイル群を削除（前回不良ファイル読込スキップ防止）
        working-directory: ./private-repo
        env:
          TARGET_DATE: ${{ needs.setup-raw.outputs.target_date }}
          TARGET_MARKET: ${{ matrix.market }}
        run: |
          for SUFFIX in "" "_${TARGET_MARKET}"; do
            TARGET_FILE="market/daily/movers/${TARGET_DATE}${SUFFIX}.md"
            if [ -f "$TARGET_FILE" ]; then
              echo "Removing existing $TARGET_FILE..."
              rm -f "$TARGET_FILE"
            fi
          done

      # PM 2026-08-19 承認: Anthropic 側の過負荷応答（API Error: 529 overloaded_error）を初回 API 呼び出しで
      # 受けて即 exit 1 する事故（run 32236017797・standard）の恒久対策。第三者製 action を足さず、
      # continue-on-error + outcome 判定の再試行ステップだけで構成する。529 は即時再試行が無意味なため
      # 待機を指数的に伸ばす（60 秒 → 180 秒）。最終判定は「成果物ファイルが存在するか」で一元化する。
      - name: Generate ${{ matrix.market }} market section via Claude Code (Opus 5 + effort high)
        id: gen1
        continue-on-error: true
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-5
          prompt_file: report-pipelines/prompts/mover-report.md
          allowed_tools: "Read,Write,Edit,Bash,Grep,Glob,WebSearch,WebFetch"
          timeout_minutes: "60"
          # PM 2026-07-07: 32001 出力トークン上限で市場セクションが途中終了する事故の予防で 64000 へ。
          claude_env: |
            CLAUDE_CODE_EFFORT_LEVEL: high
            CLAUDE_CODE_MAX_OUTPUT_TOKENS: 64000
        env:
          TARGET_DATE: ${{ needs.setup-raw.outputs.target_date }}
          TARGET_MARKET: ${{ matrix.market }}
          PRIVATE_REPO_ROOT: private-repo
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: 64000

      - name: Wait before retry 2 (Claude overloaded 等の一時エラー)
        if: steps.gen1.outcome == 'failure'
        env:
          TARGET_DATE: ${{ needs.setup-raw.outputs.target_date }}
          TARGET_MARKET: ${{ matrix.market }}
        run: |
          F="private-repo/market/daily/movers/${TARGET_DATE}_${TARGET_MARKET}.md"
          # 途中まで書かれた不完全ファイルは退避（削除しない）。再試行が白紙から書き直せるようにする。
          if [ -f "$F" ]; then
            mv "$F" "/tmp/${TARGET_DATE}_${TARGET_MARKET}.attempt1.partial.md"
            echo "1 回目の不完全な出力を /tmp へ退避しました（再試行が白紙から書き直せるようにするため）"
          fi
          echo "1 回目が失敗しました。60 秒待機して再試行します（529 は即時再試行が無意味なため）"
          sleep 60

      - name: Generate ${{ matrix.market }} market section via Claude Code (retry 2)
        id: gen2
        if: steps.gen1.outcome == 'failure'
        continue-on-error: true
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-5
          prompt_file: report-pipelines/prompts/mover-report.md
          allowed_tools: "Read,Write,Edit,Bash,Grep,Glob,WebSearch,WebFetch"
          timeout_minutes: "45"
          claude_env: |
            CLAUDE_CODE_EFFORT_LEVEL: high
            CLAUDE_CODE_MAX_OUTPUT_TOKENS: 64000
        env:
          TARGET_DATE: ${{ needs.setup-raw.outputs.target_date }}
          TARGET_MARKET: ${{ matrix.market }}
          PRIVATE_REPO_ROOT: private-repo
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: 64000

      - name: Wait before retry 3 (Claude overloaded 等の一時エラー)
        if: steps.gen2.outcome == 'failure'
        env:
          TARGET_DATE: ${{ needs.setup-raw.outputs.target_date }}
          TARGET_MARKET: ${{ matrix.market }}
        run: |
          F="private-repo/market/daily/movers/${TARGET_DATE}_${TARGET_MARKET}.md"
          if [ -f "$F" ]; then
            mv "$F" "/tmp/${TARGET_DATE}_${TARGET_MARKET}.attempt2.partial.md"
            echo "2 回目の不完全な出力を /tmp へ退避しました（再試行が白紙から書き直せるようにするため）"
          fi
          echo "2 回目も失敗しました。180 秒待機して最終再試行します"
          sleep 180

      - name: Generate ${{ matrix.market }} market section via Claude Code (retry 3)
        id: gen3
        if: steps.gen2.outcome == 'failure'
        continue-on-error: true
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-5
          prompt_file: report-pipelines/prompts/mover-report.md
          allowed_tools: "Read,Write,Edit,Bash,Grep,Glob,WebSearch,WebFetch"
          timeout_minutes: "45"
          claude_env: |
            CLAUDE_CODE_EFFORT_LEVEL: high
            CLAUDE_CODE_MAX_OUTPUT_TOKENS: 64000
        env:
          TARGET_DATE: ${{ needs.setup-raw.outputs.target_date }}
          TARGET_MARKET: ${{ matrix.market }}
          PRIVATE_REPO_ROOT: private-repo
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: 64000

      - name: Verify generated market section (成否の一元判定)
        # 上の 3 ステップは全て continue-on-error のため、ジョブの成否はここだけで決まる。
        # 「どの試行で成功したか」に依存せず成果物の実在で判定するので、リトライ成功を失敗扱いする
        # / 失敗を成功扱いする判定崩れが起きない。
        env:
          TARGET_DATE: ${{ needs.setup-raw.outputs.target_date }}
          TARGET_MARKET: ${{ matrix.market }}
        run: |
          F="private-repo/market/daily/movers/${TARGET_DATE}_${TARGET_MARKET}.md"
          echo "attempt outcomes: gen1=${{ steps.gen1.outcome }} gen2=${{ steps.gen2.outcome }} gen3=${{ steps.gen3.outcome }}"
          if [ ! -s "$F" ]; then
            echo "::error::${TARGET_MARKET} 市場セクションが 3 回の試行で生成されませんでした: $F"
            exit 1
          fi
          echo "生成成功: $F ($(wc -l < "$F") lines)"

      - name: Upload market section as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mover-daily-${{ matrix.market }}-${{ needs.setup-raw.outputs.target_date }}
          path: private-repo/market/daily/movers/${{ needs.setup-raw.outputs.target_date }}_${{ matrix.market }}.md
          retention-days: 7
          if-no-files-found: error

      - name: Discord 通知（❌ 市場別失敗）
        if: failure() || cancelled()
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
          state: failed
          label: 動意銘柄レポート 失敗（${{ matrix.market }} 市場の生成）
          date: ${{ needs.setup-raw.outputs.target_date }}
          meaning: ${{ matrix.market }} 市場セクションの生成が失敗し、統合レポートが組めないため本日未配信です。
          action_required: run ログ確認 → 手動 dispatch（force_rerun=true）で再実行。ログに「Spending cap reached」がある場合は Claude 利用枠切れ＝リセット時刻以降に force_rerun=true

  merge-and-send:
    needs: [setup-raw, generate-market]
    runs-on: ubuntu-latest
    # PM 2026-07-01: フォント/Playwright の apt 導入が遅い日（実測14分）に 15 分枠だと
    # ゲート到達前にジョブ timeout でキャンセルされ未送信になる。余裕を持って 30 分へ。
    timeout-minutes: 30
    steps:
      - name: Checkout report-pipelines
        uses: actions/checkout@v4
        with:
          path: report-pipelines

      - name: Setup SSH for private repo
        env:
          PRIVATE_REPO_DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_REPO_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone private repo (mizuki-fund)
        run: |
          git clone git@github.com:mzinvestment1105/mizuki-fund.git private-repo

      - name: Copy pipelines from Public into private working tree
        run: |
          cp -f report-pipelines/bi/pipelines/*.py private-repo/bi/pipelines/
          cp -f report-pipelines/bi/pipelines/requirements.txt private-repo/bi/pipelines/
          mkdir -p private-repo/bi/pipelines/lib
          cp -rf report-pipelines/bi/pipelines/lib/*.py private-repo/bi/pipelines/lib/ 2>/dev/null || true
          # PDF 配信用の埋め込みフォント（assets/fonts/*.woff2）を Public から overlay
          mkdir -p private-repo/bi/pipelines/assets/fonts
          cp -rf report-pipelines/bi/pipelines/assets/fonts/* private-repo/bi/pipelines/assets/fonts/ 2>/dev/null || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: report-pipelines/bi/pipelines/requirements.txt

      - name: Install dependencies
        run: pip install -r report-pipelines/bi/pipelines/requirements.txt

      - name: Install Japanese fonts (Noto Sans CJK JP)
        # PM 2026-08-19 承認: 2026-08-19 に `sudo apt-get update -qq` が出力ゼロのまま 30 分以上
        # ハングし、ジョブ枠に到達して配信ごと落ちた（GitHub 側の一時事象）。恒久対策として
        # ①ステップ単位 timeout ②各コマンドを timeout コマンドで打ち切り ③待機つき 3 回リトライ。
        #
        # 【失敗してもジョブを落とさない理由】本ジョブの誌面生成は bi/pipelines/lib/md_to_pdf.py で行い、
        # 同モジュールは assets/fonts の日本語サブセット woff2（NotoSansJP / NotoSerifJP / BIZ UDPGothic）を
        # base64 で @font-face 埋め込みする設計＝システムのフォント選択に一切依存しない。
        # 実際に PDF を作る send_report_pdf_discord.py は md_to_pdf のみを呼び、システムフォント指定の
        # md_to_jpeg は使わない（KIND_CONFIG 等の定数を import するだけ）。したがって apt のフォントが
        # 無くても誌面が豆腐（文字化け）になることはなく、ここで落とすと「配信できたはずの日を落とす」
        # だけになる。よって最終失敗時も警告を出して継続する。
        # 時間予算: 1 試行 = update 75 秒 + install 120 秒 = 最大 195 秒。新規試行は開始 280 秒までに
        # 限るので最悪 475 秒で自己終了し、ステップ枠 8 分（480 秒）内に必ず警告を出して抜ける。
        # ジョブ枠 30 分の内訳: 前段 ~5 分 + 本ステップ ≤8 分 + Playwright ~6 分 + 統合/送信 ~5 分。
        timeout-minutes: 8
        continue-on-error: true
        run: |
          set -u
          DEADLINE=$(( $(date +%s) + 280 ))
          for i in 1 2 3; do
            if [ "$i" -gt 1 ] && [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "時間予算を超過したため再試行を打ち切ります"
              break
            fi
            if timeout 75 sudo apt-get update -qq \
               && timeout 120 sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra; then
              echo "日本語フォント導入に成功しました（${i} 回目）"
              exit 0
            fi
            echo "日本語フォント導入に失敗またはハングしました（${i}/3 回目）"
            if [ "$i" -lt 3 ]; then
              sleep $((i * 15))
            fi
          done
          echo "::warning::日本語フォントの apt 導入をスキップしました。PDF は assets/fonts の埋め込みフォント（base64 @font-face）で描画するため誌面に影響はなく、配信を続行します"
          exit 0

      - name: Install Playwright Chromium
        run: |
          playwright install chromium --with-deps

      - name: Download all market artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mover-daily-*-${{ needs.setup-raw.outputs.target_date }}
          path: /tmp/market-artifacts
          merge-multiple: true

      - name: Place market file as {date}.md
        working-directory: ./private-repo
        env:
          TARGET_DATE: ${{ needs.setup-raw.outputs.target_date }}
        run: |
          MOVERS_DIR="market/daily/movers"
          mkdir -p "$MOVERS_DIR"
          rm -f "${MOVERS_DIR}/${TARGET_DATE}.md"
          # PM 2026-08-26 確定: 4 並列統合により artifact は単一（{date}_all.md）。
          # 旧 4 ファイル cat 結合は不要になり、そのまま cp する。
          # ファイル内の市場並び順はグロース → スタンダード → プライム
          # （prompts/mover-report.md が制御）。PM 2026-09-02 確定で送信は
          # 1 メッセージ・1 PDF（movers_{date}.pdf）へ統一した。send_report_pdf_discord.py は
          # ファイル全体をそのまま 1 本の PDF にし、市場タイトル行は本文中の区切り帯になる。
          # PM 2026-09-02 確定: 同一内容の md を _all.md と {date}.md の 2 本 commit する
          # 二重出力を廃止し、private repo へ配置するのは {date}.md の 1 本だけにする。
          # （artifact 側のファイル名 {date}_all.md は generate-market の verify/retry が
          #   その名前で成否判定しているため据え置く。）
          SRC="/tmp/market-artifacts/${TARGET_DATE}_all.md"
          OUTPUT="${MOVERS_DIR}/${TARGET_DATE}.md"
          if [ ! -f "$SRC" ]; then
            echo "ERROR: artifact not found: $SRC"
            exit 1
          fi
          cp "$SRC" "$OUTPUT"
          echo "Placed $OUTPUT ($(wc -l < "$OUTPUT") lines)"

      - name: Download movers raw artifact (品質フラグ取得用)
        # PM 2026-07-12（絶対配信原則）: setup-raw が出力した {date}_quality_flags.txt（対象日 EOD
        # 未着等の注記）を注記挿入 step へ渡す。
        uses: actions/download-artifact@v4
        with:
          name: movers-raw-${{ needs.setup-raw.outputs.target_date }}
          path: /tmp/movers-raw

      - name: 品質検査（件数/タイトル日付・不合格でも送信は止めない）
        # PM 2026-07-12 改定（絶対配信原則）: check_mover_counts の exit 3（品質不合格）で送信を
        # 中止する旧設計は PM 却下。exit 3 は検知シグナルとして受けて step は成功で通し、次の
        # 注記挿入 step がレポート冒頭へ品質注記を機械挿入して必ず配信する。
        # exit 1（ファイル読込不可等のインフラ失敗）のみ step 失敗（❌）。
        id: gate
        working-directory: ./private-repo
        env:
          TARGET_DATE: ${{ needs.setup-raw.outputs.target_date }}
          PYTHONIOENCODING: utf-8
        run: |
          set +e
          python bi/pipelines/check_mover_counts.py --file market/daily/movers/${TARGET_DATE}.md --date ${TARGET_DATE} 2>&1 | tee /tmp/gate.log
          ec=${PIPESTATUS[0]}
          echo "exit_code=$ec" >> $GITHUB_OUTPUT
          if [ "$ec" -eq 3 ]; then
            echo "品質ゲート不合格 → 注記を挿入して配信を続行します（PM 2026-07-12 絶対配信原則）"
            exit 0
          fi
          exit $ec

      - name: 品質注記の機械挿入（フラグ検知時のみ・各市場タイトル直後）
        # PM 2026-07-12（絶対配信原則）: データ未着注記（setup-raw のフラグ）と品質検査の不合格
        # 内容を、市場別 PDF すべてに載るよう各タイトル行（# 動意銘柄レポート …）直後へ挿入する。
        # Claude 側の注記と重複しても可（機械挿入を正とする）。
        id: annotate
        working-directory: ./private-repo
        env:
          TARGET_DATE: ${{ needs.setup-raw.outputs.target_date }}
        run: |
          NOTE=""
          FLAGS=/tmp/movers-raw/${TARGET_DATE}_quality_flags.txt
          if [ -s "$FLAGS" ]; then
            NOTE="$(tr '\n' ' ' < "$FLAGS" | sed 's/ *$//')"
          fi
          if [ "${{ steps.gate.outputs.exit_code }}" = "3" ]; then
            # paste -d はマルチバイト区切りをバイト分割するため awk で連結（・区切り）
            DETAIL=$(grep '^  - ' /tmp/gate.log | head -5 | sed 's/^  - //' | awk 'NR>1{printf "・"} {printf "%s", $0} END{print ""}')
            NOTE="${NOTE}${NOTE:+ ／ }機械検査で不合格項目あり（${DETAIL}）"
          fi
          if [ -n "$NOTE" ]; then
            F=market/daily/movers/${TARGET_DATE}.md
            awk -v note="> ⚠️ **品質注記**: ${NOTE}" '{print} /^# 動意銘柄レポート /{print ""; print note}' "$F" > "${F}.tmp" && mv "${F}.tmp" "$F"
            echo "annotated=true" >> $GITHUB_OUTPUT
            echo "note=${NOTE}" >> $GITHUB_OUTPUT
            echo "品質注記を挿入: ${NOTE}"
          else
            echo "annotated=false" >> $GITHUB_OUTPUT
            echo "品質フラグなし・注記挿入なし"
          fi

      - name: Send Discord (PDF・全市場 1 本)
        id: send
        working-directory: ./private-repo/bi/pipelines
        env:
          DISCORD_WEBHOOK_MOVERS: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
          PYTHONIOENCODING: utf-8
        run: |
          python send_report_pdf_discord.py --kind movers --date ${{ needs.setup-raw.outputs.target_date }}

      - name: Rotate report archives (5 件超過分を archive/ へ退避)
        working-directory: ./private-repo
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # ops/ は Copy pipelines step の対象外のため Public 側から都度 overlay（最新版を保証）
          mkdir -p bi/pipelines/ops
          cp -f ../report-pipelines/bi/pipelines/ops/rotate_report_archives.py bi/pipelines/ops/
          python bi/pipelines/ops/rotate_report_archives.py

      - name: Commit and push to private repo
        # rebase 方式は履歴書き換え・並行 push で index.lock 残留の構造的弱点があるため、
        # fresh-base 方式の共通ヘルパー（Public 側から直接実行・repo 内コピー禁止）へ置換。
        # PM 2026-09-02: theme_radar の蓄積 parquet は本ジョブの clone には存在しない
        # （書き出しは setup-raw の make_mover_report.py）。そちらの専用 commit step が push する。
        working-directory: ./private-repo
        env:
          TARGET_DATE: ${{ needs.setup-raw.outputs.target_date }}
        run: |
          bash ../report-pipelines/bi/pipelines/ops/ci_commit_push.sh \
            -m "data: mover report ${TARGET_DATE}" market/daily

      - name: Discord 通知（⚠️ 配信済み・品質注記あり）
        # PM 2026-07-12（絶対配信原則）: 品質問題があってもレポートは配信済み。何が注記されたかを PM へ通知。
        if: steps.annotate.outputs.annotated == 'true' && steps.send.outcome == 'success'
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
          state: partial
          label: 動意銘柄レポート 配信済み（品質注記あり）
          date: ${{ needs.setup-raw.outputs.target_date }}
          meaning: レポートは配信済みです。品質注記（${{ steps.annotate.outputs.note }}）を各市場の冒頭に付けています。
          action_required: レポート冒頭の品質注記を確認（数値を使う前に注記のデータ日付を参照）

      - name: Discord 通知（⚠️ 配信済み・後処理のみ失敗）
        if: (failure() || cancelled()) && steps.send.outcome == 'success'
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
          state: partial
          label: 動意銘柄レポート 後処理のみ失敗
          date: ${{ needs.setup-raw.outputs.target_date }}
          meaning: レポート本体は配信済みです。配信後のアーカイブ整理または commit だけが失敗しました。
          action_required: 不要（差分は次回 run が回収）

      - name: Discord 通知（❌ merge/送信失敗）
        if: (failure() || cancelled()) && steps.send.outcome != 'success'
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
          state: failed
          label: 動意銘柄レポート 失敗（統合/送信）
          date: ${{ needs.setup-raw.outputs.target_date }}
          meaning: 市場別セクションの統合または Discord 送信が失敗し、本日未配信です。
          action_required: run ログ確認 → 手動 dispatch（force_rerun=true）で再実行
