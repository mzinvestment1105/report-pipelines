          exit 0

      - name: Install Playwright Chromium
        run: |
          playwright install chromium --with-deps

      - name: Download all market artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mover-weekly-*-${{ needs.setup-raw.outputs.target_date }}
