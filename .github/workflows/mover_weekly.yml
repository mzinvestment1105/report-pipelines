        run: |
          MOVERS_DIR="market/daily/movers"
          mkdir -p "$MOVERS_DIR"
          # 既存統合ファイルを削除
          rm -f "${MOVERS_DIR}/${TARGET_DATE}_weekly.md"
          # PM 2026-08-26 確定: 4 並列統合により artifact は単一（{date}_weekly_all.md）。
          # 旧 4 ファイル cat 結合は不要になり、そのまま cp する。
          # ファイル内の市場並び順はグロース → スタンダード → プライム
          # （prompts/mover-weekly.md が制御）。PM 2026-09-02 確定で send_report_pdf_discord.py
          # （--kind movers_weekly）は分割せず 1 本の PDF にし、
          # ファイル内の出現順のまま送るため、送信は無改修で透過する。
          SRC="/tmp/market-artifacts/${TARGET_DATE}_weekly_all.md"
