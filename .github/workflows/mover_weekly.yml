name: 動意銘柄レポート週次

"on":
  schedule:
    - cron: '0 13 * * 5'   # 金曜 22:00 JST (= 13:00 UTC・日次フル版 17:30 JST の後・週末入り前)
  workflow_dispatch:
    inputs:
      target_date:
        description: '対象日付 (YYYY-MM-DD・空欄で当日の金曜)'
        required: false
        default: ''

# PM 2026-05-23 確定: プライム / スタンダード / グロースの 3 市場を並列ジョブで実行。
# 直列実行 (~50 分) を並列化することで全体 ~22 分に短縮。
# generate-market ジョブが matrix で 3 並列、merge-and-send ジョブが needs で 3 ジョブ完了を待つ。

jobs:
  setup-date:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.date.outputs.value }}
    steps:
      - name: Determine target date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            echo "value=${{ github.event.inputs.target_date }}" >> $GITHUB_OUTPUT
          else
            echo "value=$(TZ=Asia/Tokyo date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          fi

  generate-market:
    needs: setup-date
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        market: [prime, standard, growth]
    steps:
      - name: Checkout report-pipelines
        uses: actions/checkout@v4
        with:
          path: report-pipelines

      - name: Setup SSH for private repo
        env:
          PRIVATE_REPO_DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_REPO_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone private repo (mizuki-fund)
        run: |
          git clone git@github.com:mzinvestment1105/mizuki-fund.git private-repo

      - name: Copy pipelines and static files from Public into private working tree
        run: |
          cp -f report-pipelines/bi/pipelines/*.py private-repo/bi/pipelines/
          cp -f report-pipelines/bi/pipelines/requirements.txt private-repo/bi/pipelines/
          mkdir -p private-repo/bi/pipelines/lib
          cp -rf report-pipelines/bi/pipelines/lib/*.py private-repo/bi/pipelines/lib/ 2>/dev/null || true
          mkdir -p private-repo/agents private-repo/playbook
          cp -f report-pipelines/agents/*.md private-repo/agents/ 2>/dev/null || true
          cp -f report-pipelines/playbook/*.md private-repo/playbook/ 2>/dev/null || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: report-pipelines/bi/pipelines/requirements.txt

      - name: Install dependencies
        run: pip install -r report-pipelines/bi/pipelines/requirements.txt

      - name: Install Japanese fonts (Noto Sans CJK JP)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra

      - name: Install Playwright Chromium
        run: |
          playwright install chromium --with-deps

      - name: Check screening_master parquet existence (no update・PM 2026-05-23 確定)
        working-directory: ./private-repo/bi/pipelines
        env:
          PYTHONIOENCODING: utf-8
          TARGET_DATE: ${{ needs.setup-date.outputs.value }}
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          import pandas as pd

          parquet = Path("../outputs/screening_master.parquet")
          if not parquet.exists():
              print(f"[WARN] screening_master.parquet が見つかりません: {parquet}")
              sys.exit(0)
          df = pd.read_parquet(parquet)
          latest = pd.to_datetime(df["DataDate"]).max().date().isoformat() if "DataDate" in df.columns else "unknown"
          target = os.environ.get("TARGET_DATE", "")
          print(f"screening_master DataDate: {latest} (target: {target})")
          PY

      - name: 既存週次レポートファイルを削除（前回不良ファイル読込スキップ防止）
        working-directory: ./private-repo
        env:
          TARGET_DATE: ${{ needs.setup-date.outputs.value }}
          TARGET_MARKET: ${{ matrix.market }}
        run: |
          for SUFFIX in "" "_${TARGET_MARKET}"; do
            TARGET_FILE="market/daily/movers/${TARGET_DATE}_weekly${SUFFIX}.md"
            if [ -f "$TARGET_FILE" ]; then
              echo "Removing existing $TARGET_FILE..."
              rm -f "$TARGET_FILE"
            fi
          done

      - name: Generate ${{ matrix.market }} market section via Claude Code (Opus 4.7 + max thinking)
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-4-7
          prompt_file: report-pipelines/prompts/mover-weekly.md
          allowed_tools: "Read,Write,Edit,Bash,Grep,Glob,WebSearch,WebFetch"
          timeout_minutes: "30"
          claude_env: |
            MAX_THINKING_TOKENS: 32000
            CLAUDE_CODE_MAX_OUTPUT_TOKENS: 32000
        env:
          TARGET_DATE: ${{ needs.setup-date.outputs.value }}
          TARGET_MARKET: ${{ matrix.market }}
          PRIVATE_REPO_ROOT: private-repo
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: 32000

      - name: Upload market section as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mover-weekly-${{ matrix.market }}-${{ needs.setup-date.outputs.value }}
          path: private-repo/market/daily/movers/${{ needs.setup-date.outputs.value }}_weekly_${{ matrix.market }}.md
          retention-days: 7
          if-no-files-found: error

      - name: Discord 通知（市場別失敗）
        if: failure()
        env:
          DISCORD_WEBHOOK_MOVERS: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK_MOVERS" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"❌ 動意週次レポート（${{ matrix.market }} 市場）失敗\n${{ needs.setup-date.outputs.value }}\nログ確認: https://github.com/${{ github.repository }}/actions\"}"

  merge-and-send:
    needs: [setup-date, generate-market]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout report-pipelines
        uses: actions/checkout@v4
        with:
          path: report-pipelines

      - name: Setup SSH for private repo
        env:
          PRIVATE_REPO_DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_REPO_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone private repo (mizuki-fund)
        run: |
          git clone git@github.com:mzinvestment1105/mizuki-fund.git private-repo

      - name: Copy pipelines from Public into private working tree
        run: |
          cp -f report-pipelines/bi/pipelines/*.py private-repo/bi/pipelines/
          cp -f report-pipelines/bi/pipelines/requirements.txt private-repo/bi/pipelines/
          mkdir -p private-repo/bi/pipelines/lib
          cp -rf report-pipelines/bi/pipelines/lib/*.py private-repo/bi/pipelines/lib/ 2>/dev/null || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: report-pipelines/bi/pipelines/requirements.txt

      - name: Install dependencies
        run: pip install -r report-pipelines/bi/pipelines/requirements.txt

      - name: Install Japanese fonts (Noto Sans CJK JP)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra

      - name: Install Playwright Chromium
        run: |
          playwright install chromium --with-deps

      - name: Download all market artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mover-weekly-*-${{ needs.setup-date.outputs.value }}
          path: /tmp/market-artifacts
          merge-multiple: true

      - name: Place market files and merge into {date}_weekly.md
        working-directory: ./private-repo
        env:
          TARGET_DATE: ${{ needs.setup-date.outputs.value }}
        run: |
          MOVERS_DIR="market/daily/movers"
          mkdir -p "$MOVERS_DIR"
          # 既存統合ファイルを削除
          rm -f "${MOVERS_DIR}/${TARGET_DATE}_weekly.md"
          # 3 つの market artifact を配置
          for MARKET in prime standard growth; do
            SRC="/tmp/market-artifacts/${TARGET_DATE}_weekly_${MARKET}.md"
            DST="${MOVERS_DIR}/${TARGET_DATE}_weekly_${MARKET}.md"
            if [ ! -f "$SRC" ]; then
              echo "ERROR: artifact not found: $SRC"
              exit 1
            fi
            cp "$SRC" "$DST"
            echo "Placed $DST ($(wc -l < "$DST") lines)"
          done
          # 統合
          OUTPUT="${MOVERS_DIR}/${TARGET_DATE}_weekly.md"
          PRIME_FILE="${MOVERS_DIR}/${TARGET_DATE}_weekly_prime.md"
          STANDARD_FILE="${MOVERS_DIR}/${TARGET_DATE}_weekly_standard.md"
          GROWTH_FILE="${MOVERS_DIR}/${TARGET_DATE}_weekly_growth.md"
          cat "$PRIME_FILE" > "$OUTPUT"
          echo "" >> "$OUTPUT"
          cat "$STANDARD_FILE" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          cat "$GROWTH_FILE" >> "$OUTPUT"
          echo "Merged into $OUTPUT ($(wc -l < "$OUTPUT") lines)"

      - name: Send Discord (JPEG・市場別 3 枚分割)
        working-directory: ./private-repo/bi/pipelines
        env:
          DISCORD_WEBHOOK_MOVERS: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
          PYTHONIOENCODING: utf-8
        run: |
          python send_report_jpeg_discord.py --kind movers_weekly --date ${{ needs.setup-date.outputs.value }}

      - name: Commit and push to private repo
        working-directory: ./private-repo
        env:
          TARGET_DATE: ${{ needs.setup-date.outputs.value }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -- bi/pipelines/ 2>/dev/null || true
          git clean -fd bi/pipelines/ 2>/dev/null || true
          git add market/daily/
          if ! git diff --staged --quiet; then
            git stash push --keep-index --include-untracked -m "ci-cleanup" 2>/dev/null || true
            git commit -m "data: mover weekly ${TARGET_DATE}"
            git fetch origin master
            git rebase origin/master || (git diff --name-only --diff-filter=U | xargs -I{} git checkout --theirs {}; git diff --name-only --diff-filter=U | xargs git add; git -c core.editor=true rebase --continue)
            git push origin master
            git stash drop 2>/dev/null || true
          fi

      - name: Discord 通知（merge 失敗）
        if: failure()
        env:
          DISCORD_WEBHOOK_MOVERS: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK_MOVERS" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"❌ 動意週次レポート merge/送信失敗\n${{ needs.setup-date.outputs.value }}\nログ確認: https://github.com/${{ github.repository }}/actions\"}"
