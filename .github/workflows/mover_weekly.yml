name: 動意銘柄レポート週次

"on":
  schedule:
    - cron: '0 13 * * 5'   # 金曜 22:00 JST (= 13:00 UTC・日次フル版 17:30 JST の後・週末入り前)
  workflow_dispatch:
    inputs:
      target_date:
        description: '対象日付 (YYYY-MM-DD・空欄で当日の金曜)'
        required: false
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Determine target date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            echo "value=${{ github.event.inputs.target_date }}" >> $GITHUB_OUTPUT
          else
            echo "value=$(TZ=Asia/Tokyo date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          fi

      - name: Checkout report-pipelines
        uses: actions/checkout@v4
        with:
          path: report-pipelines

      - name: Setup SSH for private repo
        env:
          PRIVATE_REPO_DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_REPO_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone private repo (mizuki-fund)
        run: |
          git clone git@github.com:mzinvestment1105/mizuki-fund.git private-repo

      - name: Copy pipelines and static files from Public into private working tree
        run: |
          cp -f report-pipelines/bi/pipelines/*.py private-repo/bi/pipelines/
          cp -f report-pipelines/bi/pipelines/requirements.txt private-repo/bi/pipelines/
          mkdir -p private-repo/bi/pipelines/lib
          cp -rf report-pipelines/bi/pipelines/lib/*.py private-repo/bi/pipelines/lib/ 2>/dev/null || true
          mkdir -p private-repo/agents private-repo/playbook
          cp -f report-pipelines/agents/*.md private-repo/agents/ 2>/dev/null || true
          cp -f report-pipelines/playbook/*.md private-repo/playbook/ 2>/dev/null || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: report-pipelines/bi/pipelines/requirements.txt

      - name: Install dependencies
        run: pip install -r report-pipelines/bi/pipelines/requirements.txt

      - name: Install Japanese fonts (Noto Sans CJK JP)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra

      - name: Install Playwright Chromium
        run: |
          playwright install chromium --with-deps

      - name: Check screening_master parquet existence (no update・PM 2026-05-23 確定)
        # PM 明示指示: screening_master 更新は 5 時間かかるため本 workflow 内で走らせない。
        # screening_master.yml の cron (16:30 JST) で別途更新される設計に依存・存在確認のみ。
        working-directory: ./private-repo/bi/pipelines
        env:
          PYTHONIOENCODING: utf-8
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          import pandas as pd

          parquet = Path("../outputs/screening_master.parquet")
          if not parquet.exists():
              print(f"[WARN] screening_master.parquet が見つかりません: {parquet}")
              print("       本 workflow では更新しない設計のため、screening_master.yml が事前に走っている前提です")
              sys.exit(0)
          df = pd.read_parquet(parquet)
          latest = pd.to_datetime(df["DataDate"]).max().date().isoformat() if "DataDate" in df.columns else "unknown"
          target = os.environ.get("TARGET_DATE", "")
          print(f"screening_master DataDate: {latest} (target: {target})")
          print("PM 確定: 古くてもそのまま使う・更新は実行しない")
          PY

      - name: 既存週次レポートファイルを削除（前回不良ファイル読込スキップ防止）
        # PM 2026-05-23 確定: Claude が前回不良ファイル（commit 3a562b0 等）を読んで
        # 「既に完成」と判定し全 step スキップする構造的失敗（run 26325536581）を防止。
        # Workflow 起動毎に対象日のファイルを削除して Claude を必ずゼロから走らせる。
        working-directory: ./private-repo
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: |
          TARGET_FILE="market/daily/movers/${TARGET_DATE}_weekly.md"
          if [ -f "$TARGET_FILE" ]; then
            echo "Removing existing $TARGET_FILE before Claude run..."
            rm -f "$TARGET_FILE"
            echo "Done. Claude will generate from scratch."
          else
            echo "No existing $TARGET_FILE - Claude will generate fresh."
          fi

      - name: Generate mover weekly report via Claude Code (Opus 4.7 + max thinking・Deep Research 内包)
        # PM 2026-05-23 確定: ローカルと全く同じ精度を担保する。Deep Research は GHA 内で
        # Claude Code Action が WebSearch を使って実施 → make_sector_raw.py に --deep-research-file
        # で渡す → メインレポート生成、までを 1 Action で完結する。
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-4-7
          prompt_file: report-pipelines/prompts/mover-weekly.md
          allowed_tools: "Read,Write,Edit,Bash,Grep,Glob,WebSearch,WebFetch"
          timeout_minutes: "60"
          claude_env: |
            MAX_THINKING_TOKENS: 32000
            CLAUDE_CODE_MAX_OUTPUT_TOKENS: 64000
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
          PRIVATE_REPO_ROOT: private-repo
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}

      - name: Send Discord (JPEG・市場別 3 枚分割)
        working-directory: ./private-repo/bi/pipelines
        env:
          DISCORD_WEBHOOK_MOVERS: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
          PYTHONIOENCODING: utf-8
        run: |
          python send_report_jpeg_discord.py --kind movers_weekly --date ${{ steps.date.outputs.value }}

      - name: Commit and push to private repo
        working-directory: ./private-repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -- bi/pipelines/ agents/ playbook/ 2>/dev/null || true
          git clean -fd bi/pipelines/ agents/ playbook/ 2>/dev/null || true
          git add market/daily/ bi/outputs/sector_weekly.parquet bi/outputs/sector_stock_weekly.parquet 2>/dev/null || git add market/daily/
          if ! git diff --staged --quiet; then
            git stash push --keep-index --include-untracked -m "ci-cleanup" 2>/dev/null || true
            git commit -m "data: mover weekly ${{ steps.date.outputs.value }}"
            git fetch origin master
            git rebase origin/master || (git diff --name-only --diff-filter=U | xargs -I{} git checkout --theirs {}; git diff --name-only --diff-filter=U | xargs git add; git -c core.editor=true rebase --continue)
            git push origin master
            git stash drop 2>/dev/null || true
          fi

      - name: Discord 通知（失敗）
        if: failure()
        env:
          DISCORD_WEBHOOK_MOVERS: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK_MOVERS" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"❌ 動意週次レポート失敗\n${{ steps.date.outputs.value }}\nログ確認: https://github.com/${{ github.repository }}/actions\"}"
