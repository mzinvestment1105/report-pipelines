name: 動意銘柄レポート週次

"on":
  # PM 2026-05-27 確定: Cloudflare Worker (mizuki-fund-scheduler-1) からの workflow_dispatch がメイン経路。
  # PM 2026-06-06 追加: Worker SPOF 回避のため GHA cron をフェイルセーフ併用。
  # 2026-08-05 修正: 本命 Worker の発火は金曜 JST 22:43（UTC 13:43）だが、旧 GHA cron は
  #   UTC 12:00（JST 21:00 起票）で Worker より先に走り、成功すると Worker 分が guard skip されて
  #   前後関係が壊れていた。加えて GitHub cron は実測 +1h45m〜+3h15m 遅延するため実配信は
  #   JST 22:27〜23:13 に散っていた。
  #   予備 cron を UTC 金 10:30（JST 19:30 起票）へ前倒しし、guard 側で JST 22:53 まで待機してから
  #   判定する方式へ変更（本命 22:43 を必ず先に通し、届かなければ予備が 22:53 に起きて配信する）。
  #   金曜配信という仕様自体は変更していない。
  workflow_dispatch:
    inputs:
      target_date:
        description: '対象日付 (YYYY-MM-DD・空欄で当日の金曜)'
        required: false
        default: ''
      force_rerun:
        description: 'true で当日重複ガードを無視して強制実行（修正後の再テスト用）'
        required: false
        default: 'false'
  schedule:
    # ---------------------------------------------------------------------------------
    # PM 2026-08-29 確定（案3 + 自動再試行レーン）
    #   「回らないまま週を終えるようなことがあってはならない／回らなかった場合にも必ず
    #     数時間後に正しく回るようにしろ」
    #
    # 金曜 22 時台の生成は price_history.yml の当日分 commit（実測 JST 翌 04 時台着地）より
    # 前に走るため、構造的に対象日 EOD が未着になる。そこで予備レーンを土曜以降へ移し、
    # さらに「対象週が未配信のままなら時間をずらして何度でも回り直す」再試行レーンを敷く。
    # 8/28 の実績では price_history の着地が起票から約 12 時間遅延しており、1 回きりの
    # 予備では取りこぼす。対象週の翌週が始まる前に計 5 回のチャンスを置く。
    #
    #   UTC 01:00 土 → JST 土 10:00 起票 / 起床 11:00  … 第1試行（本命 Worker 未達の受け皿）
    #   UTC 08:00 土 → JST 土 17:00 起票 / 起床 18:00  … 第2試行
    #   UTC 00:00 日 → JST 日 09:00 起票 / 起床 10:00  … 第3試行
    #   UTC 10:00 日 → JST 日 19:00 起票 / 起床 20:00  … 第4試行
    #   UTC 21:00 日 → JST 月 06:00 起票 / 起床 07:00  … 第5試行（最終・月曜寄り付き前）
    #
    # GitHub cron は実測 +1h45m〜+3h15m 遅延するため、各レーンとも起票を 1 時間早めに置き
    # guard 側の WAKE_JST まで待って判定する方式（standby_guard.sh）を踏襲する。
    # 全レーンが weekcheck（対象週起点・delivered/sending 判定）を通るため、配信済み・
    # 実行中なら即 skip され二重配信は起きない。
    # 対象日データ未着なら price-gate ジョブが generate-market 以降を止める（二重防御）。
    # ---------------------------------------------------------------------------------
    - cron: '0 1 * * 6'
    - cron: '0 8 * * 6'
    - cron: '0 0 * * 0'
    - cron: '0 10 * * 0'
    - cron: '0 21 * * 0'

# PM 2026-08-26 確定: 旧 4 並列（prime/standard/growth_a/growth_b）を 1 実行へ統合。
# generate-market ジョブが market=all の 1 実行で全 3 市場を 1 ファイルへ生成し、
# merge-and-send ジョブが単一ファイルを配置して Discord 送信する。
# 並び順はグロース → スタンダード → プライム（prompts/mover-weekly.md が制御）。

# 2026-08-05: workflow 単位の concurrency は廃止（予備 run が JST 22:53 まで待機している間に
# 本命 Worker の workflow_dispatch が pending へ回されるのを避けるため）。
# 二重発火の最終防波堤は setup-raw ジョブ単位の concurrency で担保する。

# ===================================================================================
# 【配信原則の優先関係】PM 2026-08-29 確定
#   PM 2026-07-12 の「絶対配信原則」（品質問題を理由に配信を止めない）は撤回していない。
#   ただしそれは【データが揃っている前提での配信絶対】である。対象週金曜の株価データが
#   price_history parquet に入っていない場合は、前週の窓の数値を「今週」として出すことに
#   なるため、絶対配信原則より「対象日データ未着時は生成しない」が優先する
#   （PM 指示: parquet の数値が出ていなかったら回らないように設計しろ）。
#   実装: price-gate ジョブ（待機・補完・リトライつきハードゲート）と setup-raw の exit 3。
#   これ以外の品質問題（件数不足・誌面の軽微な不備等）は従来どおり注記つきで必ず配信する。
# ===================================================================================

jobs:
  guard:
    runs-on: ubuntu-latest
    # 予備 cron は JST 22:53 まで sleep してから判定するため長め（最大 sleep 3h25m + 本命待ち 30 分）。
    timeout-minutes: 300
    outputs:
      # PM 2026-08-29 改定: 予備レーンが土曜へ移ったため、guard の生判定日（実行日 JST）を
      # そのまま対象日にすると土曜日付でレポートを作ってしまう。normalize ステップで
      # 「対象週の金曜」へ寄せた値を対象日として下流へ渡す。
      # PM 2026-08-29 改定: schedule 起動（再試行レーン）では weekcheck が唯一の権威。
      #   - 対象週が配信済み / 別 run 走行中 → weekcheck が false を返し必ず降りる（二重配信防止）
      #   - 対象週が未配信 → standby_guard の当日スコープ retry_cap を上書きして回す
      # workflow_dispatch（本命 Worker / 手動）では weekcheck は skip され check の判定を使う。
      proceed: ${{ github.event_name == 'schedule' && steps.weekcheck.outputs.proceed == 'true' || github.event_name != 'schedule' && steps.check.outputs.proceed == 'true' }}
      reason: ${{ steps.weekcheck.outputs.state || steps.check.outputs.reason }}
      lane: ${{ steps.lane.outputs.label }}
      lane_id: ${{ steps.lane.outputs.lane_id }}
      target_date: ${{ steps.normalize.outputs.target_date }}
      raw_date: ${{ steps.check.outputs.target_date }}
    steps:
      # 通知 composite action（.github/actions/notify-discord）と判定スクリプトを使うため checkout が必要
      - name: Checkout report-pipelines (通知 action / 配信判定スクリプト用)
        uses: actions/checkout@v4

      - name: 再試行レーンの識別（起票時刻から起床時刻・受付窓を決める）
        # PM 2026-08-29 追加: 再試行レーンが 5 本になったため、WAKE_JST を 1 つの固定値では
        # 賄えない。cron の起票時刻（JST）からどのレーンかを判定し、そのレーンの起床時刻と
        # 受付窓を出力する。GitHub cron の実測遅延（+1h45m〜+3h15m）を吸収するため、
        # 受付窓は「起票予定時刻の 1 時間前 〜 起床時刻の 4 時間後」と広めに取り、
        # 遅延着火でもレーンが死なないようにする（窓外 skip は日付ズレ防止の最終手段）。
        id: lane
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "schedule" ]; then
            # 手動 / Worker dispatch は待機せず即判定（従来どおり）
            echo "wake=00:00" >> "$GITHUB_OUTPUT"
            echo "win_start=00:00" >> "$GITHUB_OUTPUT"
            echo "win_end=23:59" >> "$GITHUB_OUTPUT"
            echo "label=本命" >> "$GITHUB_OUTPUT"
            echo "lane_id=dispatch" >> "$GITHUB_OUTPUT"
            echo "手動/dispatch 起動のためレーン判定をスキップします"
            exit 0
          fi
          DOW=$(TZ=Asia/Tokyo date +%u)   # 1=月 … 6=土 7=日
          HH=$(TZ=Asia/Tokyo date +%H)
          H=$((10#$HH))
          # 各レーンの起票予定 JST: 土10 / 土17 / 日09 / 日19 / 月06
          # ID は ASCII 固定（GHA 式の startsWith 判定に使うため・表示名とは分離）
          if   [ "$DOW" = "6" ] && [ "$H" -lt 14 ]; then WAKE=11:00; WS=09:00; WE=15:00; ID=retry1; L="再試行1(土11時)"
          elif [ "$DOW" = "6" ];                     then WAKE=18:00; WS=16:00; WE=22:00; ID=retry2; L="再試行2(土18時)"
          elif [ "$DOW" = "7" ] && [ "$H" -lt 14 ]; then WAKE=10:00; WS=08:00; WE=14:00; ID=retry3; L="再試行3(日10時)"
          elif [ "$DOW" = "7" ];                     then WAKE=20:00; WS=18:00; WE=23:59; ID=retry4; L="再試行4(日20時)"
          elif [ "$DOW" = "1" ];                     then WAKE=07:00; WS=05:00; WE=11:00; ID=retry5; L="再試行5(月7時・最終)"
          else                                            WAKE=11:00; WS=00:00; WE=23:59; ID=retryX; L="再試行(想定外曜日)"
          fi
          echo "レーン判定: dow=${DOW} 現在 $(TZ=Asia/Tokyo date +%H:%M) JST → ${L} / 起床 ${WAKE} / 受付窓 ${WS}〜${WE}"
          echo "wake=$WAKE"       >> "$GITHUB_OUTPUT"
          echo "win_start=$WS"    >> "$GITHUB_OUTPUT"
          echo "win_end=$WE"      >> "$GITHUB_OUTPUT"
          echo "label=$L"         >> "$GITHUB_OUTPUT"
          echo "lane_id=$ID"      >> "$GITHUB_OUTPUT"

      - name: 予備タイマー待機 + 当日配信判定（merge-and-send ジョブ単位）
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WF_FILE: mover_weekly.yml
          SEND_JOB: merge-and-send
          MY_RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          FORCE_RERUN: ${{ github.event.inputs.force_rerun }}
          INPUT_DATE: ${{ github.event.inputs.target_date }}
          # PM 2026-08-29 改定: 5 本の再試行レーンをまたぐため lane step の判定値を使う。
          WAKE_JST: ${{ steps.lane.outputs.wake }}
          WINDOW_START_JST: ${{ steps.lane.outputs.win_start }}
          WINDOW_END_JST: ${{ steps.lane.outputs.win_end }}
          WAIT_MINUTES: '30'
          LANE_LABEL: ${{ steps.lane.outputs.label }}
        run: bash .github/scripts/standby_guard.sh

      - name: 対象日を「対象週の金曜」へ正規化（土曜レーン対応）
        # PM 2026-08-29 追加: standby_guard.sh の TARGET_DATE は実行日（JST）であり、
        # 予備レーンを土曜へ移した結果そのままでは土曜日付になる。週次動意の対象日は常に
        # 「対象週の金曜」なので、土曜なら 1 日前・日曜なら 2 日前へ寄せる（月〜金はそのまま）。
        # workflow_dispatch で target_date を明示した場合はその値を尊重する。
        id: normalize
        env:
          RAW_DATE: ${{ steps.check.outputs.target_date }}
          INPUT_DATE: ${{ github.event.inputs.target_date }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_DATE:-}" ]; then
            VALUE="$INPUT_DATE"
            echo "手動指定の対象日をそのまま使用します: $VALUE"
          else
            DOW=$(date -u -d "$RAW_DATE" +%u)   # 1=月 … 6=土 7=日
            case "$DOW" in
              6) VALUE=$(date -u -d "$RAW_DATE -1 day" +%Y-%m-%d) ;;
              7) VALUE=$(date -u -d "$RAW_DATE -2 day" +%Y-%m-%d) ;;
              *) VALUE="$RAW_DATE" ;;
            esac
            echo "実行日 $RAW_DATE (dow=$DOW) → 対象日（対象週の金曜）= $VALUE"
          fi
          echo "value=$VALUE"
          echo "target_date=$VALUE" >> "$GITHUB_OUTPUT"

      - name: 対象週の重複配信チェック（金曜起点・再試行レーンの二重配信防止）
        # ===============================================================================
        # PM 2026-08-29: 再試行レーンが 5 本になったため、ここが二重配信を防ぐ唯一かつ
        # 最重要の安全弁になる。check_delivery.sh は既定で「当日 JST 00:00 以降」しか見ず、
        # 土日月に走る再試行レーンからは金曜の本命 run が見えない。since を対象日（金曜）
        # 00:00 JST に指定して【対象週全体】を見る。
        #
        # 判定に使う 3 値（いずれか > 0 なら回さない）:
        #   delivered        : merge-and-send が success で終わった run 数 = 配信済み
        #   sending          : merge-and-send が queued/in_progress の run 数 = 今まさに配信中
        #   dispatch_pending : dispatch 起点で未完了かつ未配信の run 数 = 本命が走行中
        #   + schedule_pending: schedule 起点で未完了かつ未配信 = 別の再試行レーンが走行中
        # sending / pending を見るのが要点。delivered だけを見ていると、先行レーンが生成中
        # （60〜180 分かかる）の隙間に次のレーンが起きて 2 本同時に走り、両方が配信して
        # 二重配信になる。走行中を検知したら後発レーンは必ず降りる。
        #
        # retry_cap との関係: standby_guard.sh は「当日 2 回失敗で cron 停止」の retry_cap を
        # 持つが、これは日次レポート向けの当日スコープ判定であり、週をまたぐ再試行レーンには
        # 適さない（PM 指示「回らないまま週を終えてはならない」に反する）。対象週が未配信で
        # ある限り retry_cap は無視して回す（下の allow_retry_cap_override）。
        # ===============================================================================
        id: weekcheck
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_DATE: ${{ steps.normalize.outputs.target_date }}
          MY_RUN_ID: ${{ github.run_id }}
          CHECK_PROCEED: ${{ steps.check.outputs.proceed }}
          CHECK_REASON: ${{ steps.check.outputs.reason }}
        run: |
          set -euo pipefail
          SINCE="${TARGET_DATE}T00:00:00+09:00"
          STATS=$(bash .github/scripts/check_delivery.sh mover_weekly.yml merge-and-send "${MY_RUN_ID}" "${SINCE}")
          echo "対象週の集計: ${STATS}"
          DELIVERED=$(echo "$STATS" | jq -r '.delivered')
          SENDING=$(echo "$STATS" | jq -r '.sending')
          DPEND=$(echo "$STATS" | jq -r '.dispatch_pending')
          SPEND=$(echo "$STATS" | jq -r '.schedule_pending')
          RUNNING=$(( SENDING + DPEND + SPEND ))
          echo "対象週 ${TARGET_DATE}: delivered=${DELIVERED} sending=${SENDING} dispatch_pending=${DPEND} schedule_pending=${SPEND} (running=${RUNNING})"

          # --- 安全弁 1: すでに配信済みなら絶対に回さない ---
          if [ "$DELIVERED" -gt 0 ]; then
            echo "skip 理由: 対象週 ${TARGET_DATE} はすでに配信済み（merge-and-send success=${DELIVERED}）のため。二重配信を防止します。"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "state=delivered" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --- 安全弁 2: 別 run が走行中なら降りる（生成は 60〜180 分かかるため必須） ---
          if [ "$RUNNING" -gt 0 ]; then
            echo "skip 理由: 対象週 ${TARGET_DATE} は別の run が走行中（running=${RUNNING}）のため。先行 run に配信を譲ります。"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "state=running" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --- 未配信かつ走行中なし = このレーンが回る ---
          # standby_guard.sh が当日スコープの retry_cap で降りていても、対象週が未配信である
          # 限りここで復帰させる（PM 2026-08-29「回らないまま週を終えてはならない」）。
          if [ "$CHECK_PROCEED" != "true" ]; then
            echo "standby_guard は proceed=false（reason=${CHECK_REASON}）でしたが、対象週 ${TARGET_DATE} が未配信のため再試行レーンとして実行します。"
            echo "override=true" >> "$GITHUB_OUTPUT"
          fi
          echo "対象週 ${TARGET_DATE} は未配信・走行中なし → このレーンで生成を実行します。"
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "state=retry" >> "$GITHUB_OUTPUT"

      # ⏱予備タイマー起動通知は 2026-07-09 に削除していたが 2026-08-05 に復活。
      # 削除理由だった「Worker が週次を発火しない」は Cloudflare cron の曜日フィールドが
      # 1=日曜だったことが原因で、Worker 側で修正済み。以後は「予備が起きた＝本当に Worker 未達」
      # となり通知が正しい情報になる（無言 skip の禁止）。
      - name: Discord 通知（⏱ 予備タイマー起動）
        if: github.event_name == 'schedule' && steps.weekcheck.outputs.proceed == 'true'
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
          state: timer
          label: 動意銘柄レポート週次 予備タイマー起動（${{ steps.lane.outputs.label }}）
          date: ${{ steps.normalize.outputs.target_date }}
          meaning: 対象週分がまだ配信されていないため、自動再試行レーンが代わりに生成を開始しました。価格データが揃っていればレポートはこのあと届きます。
          action_required: 不要（この後の配信をお待ちください）

      - name: Discord 通知（🚨 自動リトライ停止）
        # PM 2026-08-29: 週次では当日スコープの retry_cap を weekcheck が上書きして回し続けるため、
        # この通知は「対象週が未配信なのにリトライ停止」という誤情報になる。schedule 起動では
        # 発火させない（dispatch 経路のみ残す）。最終未配信のエスカレーションは escalate ジョブが担う。
        if: contains(steps.check.outputs.reason, 'retry_cap') && github.event_name != 'schedule'
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
          state: alert
          label: 動意銘柄レポート週次 自動リトライ停止
          meaning: 当日 2 回以上失敗したため cron の自動再実行を停止しました。今週分は未配信です。
          action_required: run ログ確認 → 原因解消後に手動 dispatch（force_rerun=true）で再実行

      - name: Discord 通知（guard 失敗）
        if: failure() || cancelled()
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_MOVERS || secrets.DISCORD_WEBHOOK_URL }}
          state: failed
          label: 動意銘柄レポート週次 guard 失敗
          meaning: 実行前チェック（当日重複判定）自体がエラーになり、生成ジョブが起動していません。
          action_required: run ログ確認 → 手動 dispatch で再実行

  escalate:
    # ===================================================================================
    # PM 2026-08-29 確定（「回らないまま週を終えるようなことがあってはならない」）
    # 最終再試行レーン（月曜 JST 07:00・cron '0 21 * * 0'）の run で、対象週が最後まで
    # 未配信のまま終わった場合に PM へエスカレーション通知を出す。
    #
    # 発火条件（全て満たす時のみ）:
    #   1. schedule 起動である
    #   2. 最終レーン（lane=再試行5）である
    #   3. merge-and-send が success で終わらなかった = 対象週が未配信のまま
    # always() で常に評価し、内部で配信有無を再判定してから通知するため、
    # 「途中レーンで配信できた週」に誤ってエスカレーションが飛ぶことはない。
    # ===================================================================================
    needs: [guard, price-gate, setup-raw, generate-market, merge-and-send]
    if: always() && github.event_name == 'schedule' && needs.guard.outputs.lane_id == 'retry5'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout report-pipelines (通知 action / 判定スクリプト用)
        uses: actions/checkout@v4

      - name: 対象週が最終的に配信できたかを再判定
        id: final
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_DATE: ${{ needs.guard.outputs.target_date }}
        run: |
          set -euo pipefail
          if [ -z "${TARGET_DATE:-}" ]; then
            # guard が skip 等で target_date を出せなかった場合は対象週の金曜を自力で算出
            DOW=$(TZ=Asia/Tokyo date +%u)
            case "$DOW" in
              1) TARGET_DATE=$(TZ=Asia/Tokyo date -d "-3 day" +%Y-%m-%d) ;;
              6) TARGET_DATE=$(TZ=Asia/Tokyo date -d "-1 day" +%Y-%m-%d) ;;
              7) TARGET_DATE=$(TZ=Asia/Tokyo date -d "-2 day" +%Y-%m-%d) ;;
              *) TARGET_DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d) ;;
            esac
            echo "guard の target_date が空のため自力算出: ${TARGET_DATE}"
          fi
          echo "target_date=${TARGET_DATE}" >> "$GITHUB_OUTPUT"
          SINCE="${TARGET_DATE}T00:00:00+09:00"
          # 自分の run は除外しない（自 run の merge-and-send 成功も「配信できた」と数えるため）
          STATS=$(bash .github/scripts/check_delivery.sh mover_weekly.yml merge-and-send 0 "${SINCE}")
          echo "対象週の最終集計: ${STATS}"
          DELIVERED=$(echo "$STATS" | jq -r '.delivered')
          FAILED=$(echo "$STATS" | jq -r '.failed')
          echo "failed=${FAILED}" >> "$GITHUB_OUTPUT"
          if [ "$DELIVERED" -gt 0 ]; then
            echo "対象週 ${TARGET_DATE} は配信済み（${DELIVERED} 件）。エスカレーション不要。"
            echo "undelivered=false" >> "$GITHUB_OUTPUT"
          else
            echo "対象週 ${TARGET_DATE} は全 5 レーンを使い切っても未配信。エスカレーションします。"
            echo "undelivered=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 未配信の理由を要約
        id: why
        if: steps.final.outputs.undelivered == 'true'
        env:
          GATE: ${{ needs.price-gate.result }}
          SETUP: ${{ needs.setup-raw.result }}
          GEN: ${{ needs.generate-market.result }}
          SEND: ${{ needs.merge-and-send.result }}
        run: |
          set -euo pipefail
          if [ "$GATE" = "failure" ]; then
            R="対象週金曜の株価データ（price_history）が最後まで着荷せず、価格データ着荷ゲートで停止しました"
          elif [ "$SETUP" = "failure" ]; then
            R="元データ（movers raw / 週間ランキング parquet）の生成に失敗しました"
          elif [ "$GEN" = "failure" ]; then
            R="市場セクションの生成（Claude 実行）が 3 回の試行で完了しませんでした"
          elif [ "$SEND" = "failure" ]; then
            R="統合または Discord 送信が失敗しました"
          else
            R="各ジョブの結果は price-gate=${GATE} / setup-raw=${SETUP} / generate-market=${GEN} / merge-and-send=${SEND} でした"
          fi
          echo "理由: $R"
          echo "reason=$R" >> "$GITHUB_OUTPUT"

      - name: Discord 通知（🚨 週を越えて未配信・エスカレーション）
        if: steps.final.outputs.undelivered == 'true'
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
          state: alert
          label: 動意銘柄レポート週次 週を越えて未配信（自動復旧に失敗・要手動リカバリ）
          date: ${{ steps.final.outputs.target_date }}
          meaning: 対象週（金曜 ${{ steps.final.outputs.target_date }}）の週次動意レポートを、土曜から月曜朝までの自動再試行 5 回すべてで配信できないまま週を越えました。原因は「${{ steps.why.outputs.reason }}」です。自動での復旧手段は尽きており、以降は自動で回りません。
          action_required: 手動リカバリをお願いします。(1) price_history.yml の run を確認し価格データを着荷させる (2) 本 workflow を手動 dispatch（force_rerun=true・target_date=${{ steps.final.outputs.target_date }}）で再実行、または (3) ローカルで /mover-report 系スキルを実行

  price-gate:
    # ===================================================================================
    # PM 2026-08-29 確定（「parquet の数値が出ていなかったら回らないように設計しろ」）
    # 対象週金曜の EOD が price_history parquet に入っていない状態では、週次動意レポートを
    # 生成も配信もしない。旧挙動（品質注記を付けて配信続行・PM 2026-07-12 絶対配信原則）は
    # 廃止する。yml 冒頭の「絶対配信原則」は【データが揃っている前提での配信絶対】であり、
    # 対象日データ未着時は本ゲートが優先する（原則そのものは他の品質問題に対して有効）。
    #
    # 【なぜ必要か】price_history.yml は cron 起票 JST 16:00 だが実着地は翌 04 時台まで遅れる
    # 実測がある。本命 Worker は金曜 22:43 に発火するため、金曜経路では対象日 EOD が構造的に
    # 未着になりうる。予備レーンは土曜へ移した（案3）が、Worker 側は変更できないため二重防御。
    #
    # 【動作】private repo を clone し、bi/outputs/price_history/{YYYY}.parquet の最新日が
    # 対象日以上かを判定する。未着なら JQuants で補完（make_price_history_master.py daily）を
    # 試み、それでも未着なら 10 分間隔で最大 6 回まで再判定する（最悪 60 分 + 補完時間）。
    # 最後まで揃わなければ exit 4 → 本ジョブ failure → setup-raw / generate-market /
    # merge-and-send は needs で全て起動しない（レポート生成なし・Discord 本体送信なし）。
    # ===================================================================================
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    # 待機 30 分（10 分 × 3 回）+ 補完 4 回分（各最大 30 分だが実測は数分）+ clone/setup 10 分。
    # 長時間の待機は本ジョブで抱えず、土日月の再試行レーン 5 本で時間軸をカバーする。
    timeout-minutes: 90
    outputs:
      target_date: ${{ needs.guard.outputs.target_date }}
    steps:
      - name: Checkout report-pipelines
        uses: actions/checkout@v4
        with:
          path: report-pipelines

      - name: Setup SSH for private repo
        env:
          PRIVATE_REPO_DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_REPO_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone private repo (mizuki-fund)
        run: |
          git clone git@github.com:mzinvestment1105/mizuki-fund.git private-repo

      - name: Copy pipelines from Public into private working tree
        run: |
          cp -f report-pipelines/bi/pipelines/*.py private-repo/bi/pipelines/
          cp -f report-pipelines/bi/pipelines/requirements.txt private-repo/bi/pipelines/
          mkdir -p private-repo/bi/pipelines/lib private-repo/bi/pipelines/ops
          cp -rf report-pipelines/bi/pipelines/lib/*.py private-repo/bi/pipelines/lib/ 2>/dev/null || true
          cp -f report-pipelines/bi/pipelines/ops/check_price_history_date.py private-repo/bi/pipelines/ops/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: report-pipelines/bi/pipelines/requirements.txt

      - name: Install dependencies
        run: pip install -r report-pipelines/bi/pipelines/requirements.txt

      - name: 対象日の価格データ着荷ハードゲート（未着なら以降を実行しない）
        id: gate
        working-directory: ./private-repo
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          set +e
          # PM 2026-08-29 改定（実効性の再配分）: price-gate 単体の待機は 30 分（10 分 × 3 回）へ
          # 短縮する。8/28 実績のように price_history の着地が 12 時間遅れるケースは、1 ジョブで
          # 待ち続けるのではなく土日月の再試行レーン 5 本で時間軸をカバーする設計としたため、
          # ここで GHA のジョブ枠を長時間占有する意味がない。
          # ただし --topup（make_price_history_master.py daily による JQuants 直接取得）は
          # 毎回・毎リトライで必ず試す。price_history.yml の着地を待たず自力で取りに行けるのが
          # 最短経路であり、多くの場合ここで揃って当該レーン内で配信まで到達する。
          python bi/pipelines/ops/check_price_history_date.py             --expect-date ${{ needs.guard.outputs.target_date }}             --retries 3 --interval-seconds 600 --topup
          ec=$?
          echo "exit_code=$ec" >> $GITHUB_OUTPUT
          if [ "$ec" -eq 0 ]; then
            echo "価格データ着荷を確認しました。生成へ進みます。"
            exit 0
          fi
          if [ "$ec" -eq 4 ]; then
            echo "::error::対象日 ${{ needs.guard.outputs.target_date }} の価格データが price_history に未着のため、週次動意レポートの生成・配信を見送ります"
          else
            echo "::error::価格データ着荷判定そのものが失敗しました (exit=$ec)"
          fi
          exit $ec

      - name: Discord 通知（⛔ データ未着で生成見送り）
        # PM 2026-08-29: レポート本体は送らない。運用通知のみを動意チャンネルへ出す
        # （専用の運用チャンネル webhook が存在しないため、無言 skip 禁止の原則に従い
        #  レポートと同じ DISCORD_WEBHOOK_MOVERS へ ⛔ 通知として送る）。
        if: steps.gate.outputs.exit_code == '4'
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
          state: blocked
          label: 動意銘柄レポート週次 データ未着のため生成見送り
          date: ${{ needs.guard.outputs.target_date }}
          meaning: 対象週金曜の株価データ（price_history）が届かなかったため、前週の数値で誤ったレポートを出すことを避けて今週分の生成・配信を見送りました。レポートは配信していません。
          action_required: price_history.yml の run を確認 → 価格データ着荷後に本 workflow を手動 dispatch（force_rerun=true・target_date に対象週の金曜を指定）

      - name: Discord 通知（❌ 着荷判定の失敗）
        if: (failure() || cancelled()) && steps.gate.outputs.exit_code != '4'
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
          state: failed
          label: 動意銘柄レポート週次 失敗（価格データ着荷判定）
          date: ${{ needs.guard.outputs.target_date }}
          meaning: 価格データの着荷判定そのものがエラーになり、生成ジョブが起動していないため今週分は未配信です。
          action_required: run ログ確認 → 手動 dispatch（force_rerun=true）で再実行

  setup-raw:
    needs: [guard, price-gate]
    if: needs.guard.outputs.proceed == 'true'
    # PM 2026-05-30 確定: 週次 workflow にも raw 生成 step を追加。日次 workflow と同様、
    # 週次実行時に make_mover_report.py で当週分の raw を新規生成し artifact 共有する。
    # これ以前は raw 生成 step がなく、private リポに commit 済の最新 raw（2026-05-22）を
    # 流用してレポートを生成していたため、5/29 週次が 5/22 内容の使い回しになる事故が発生。
    # PM 2026-07-12: 週間ランキング parquet 生成 step（make_sector_report.py・約 5〜15 分）を
    # 追加したため 20 分では不足。movers raw 生成（スクレイピング遅延日あり）と合わせ 40 分へ。
    # PM 2026-09-05: d0f7f85 で取得母集団が 50 銘柄 → 255 銘柄（5.1 倍）へ拡大したため 40 分では不足し、
    # 9/5 週次が「Generate movers raw」step の 40 分ちょうどで強制打ち切り（191/255 銘柄目）となった。
    # 同じ 255 銘柄で完走している日次（mover_report_daily.yml の setup-raw）と揃えて 90 分へ。
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # 実生成の入口だけを直列化する（workflow 単位の concurrency は本命の金曜 22:43 発火を塞ぐため置かない）。
    concurrency:
      group: mover_weekly-setup-raw
      cancel-in-progress: false
    outputs:
      target_date: ${{ steps.date.outputs.value }}
    steps:
      - name: Determine target date
        id: date
        env:
          GUARD_DATE: ${{ needs.guard.outputs.target_date }}
        run: |
          echo "value=${GUARD_DATE}" >> $GITHUB_OUTPUT

      - name: Checkout report-pipelines
        uses: actions/checkout@v4
        with:
          path: report-pipelines

      - name: Setup SSH for private repo
        env:
          PRIVATE_REPO_DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_REPO_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone private repo (mizuki-fund)
        run: |
          git clone git@github.com:mzinvestment1105/mizuki-fund.git private-repo

      - name: Copy pipelines and static files from Public into private working tree
        run: |
          cp -f report-pipelines/bi/pipelines/*.py private-repo/bi/pipelines/
          cp -f report-pipelines/bi/pipelines/requirements.txt private-repo/bi/pipelines/
          mkdir -p private-repo/bi/pipelines/lib
          cp -rf report-pipelines/bi/pipelines/lib/*.py private-repo/bi/pipelines/lib/ 2>/dev/null || true
          # PDF 配信用の埋め込みフォント（assets/fonts/*.woff2）を Public から overlay
          mkdir -p private-repo/bi/pipelines/assets/fonts
          cp -rf report-pipelines/bi/pipelines/assets/fonts/* private-repo/bi/pipelines/assets/fonts/ 2>/dev/null || true
          mkdir -p private-repo/agents private-repo/playbook
          cp -f report-pipelines/agents/*.md private-repo/agents/ 2>/dev/null || true
          cp -f report-pipelines/playbook/*.md private-repo/playbook/ 2>/dev/null || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: report-pipelines/bi/pipelines/requirements.txt

      - name: Install dependencies
        run: pip install -r report-pipelines/bi/pipelines/requirements.txt

      - name: Generate weekly ranking parquet (make_sector_report.py --anchor friday)
        # PM 2026-07-12 確定: 週間ランキング（Return_W01・Close_Latest 等）の供給源
        # sector_stock_weekly.parquet の再生成をプロンプト任せ（旧 prompts/mover-weekly.md Step 4）に
        # せず、workflow の機械 step へ昇格する（2026-07-10 に 7/3 生成のコミット済み parquet を
        # 「当週」として全行誤配信・2986 -66.3%／4596 +55.4% 事故の再発防止）。
        # --expect-price-date: 価格データが対象日（当週金曜）に届いていなければ exit 3。
        #   PM 2026-08-29 改定: exit 3 は「生成中止」へ戻す。price-gate ジョブを通過している以上、
        #   ここでの不一致は clone 済み parquet と JQuants 補完の両方が対象日に届かなかった
        #   異常事態であり、前週の窓で作った数値を配信してはならない（旧「品質注記つきで
        #   必ず配信」= PM 2026-07-12 は廃止）。yml 冒頭の絶対配信原則は「データが揃っている
        #   前提での配信絶対」であり、対象日データ未着時は本ゲートが優先する。
        # --cold-lookback-days 90: price_history parquet が clone に無い場合の JQuants コールド
        #   フェッチを W01〜W08 計算に必要な約 13 週分へ短縮（3年分≈90分→数分）。
        # 生成した parquet は artifact で generate-market の 4 並列へ配布する（commit はしない＝
        # リポの parquet 鮮度管理は従来どおり sector_report_weekly_full.yml の責務）。
        id: weekly_parquet
        working-directory: ./private-repo/bi/pipelines
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          set +e
          python make_sector_report.py --anchor friday \
            --expect-price-date ${{ steps.date.outputs.value }} --cold-lookback-days 90
          ec=$?
          echo "exit_code=$ec" >> $GITHUB_OUTPUT
          FLAGS=../../market/daily/${{ steps.date.outputs.value }}_weekly_quality_flags.txt
          # PM 2026-08-29: EOD 未着注記による配信経路は廃止。フラグファイルは artifact の
          # 収集対象に含まれるため空で作るが、内容を書くことはもう無い。
          : > "$FLAGS"
          if [ "$ec" -eq 3 ]; then
            ASOF=$(python -c "import pandas as pd; print(pd.read_parquet('../outputs/sector_stock_weekly.parquet')['PriceDataAsOf'].iloc[0])" 2>/dev/null || echo "取得不可")
            echo "::error::週間ランキングの価格データが対象週の金曜（${{ steps.date.outputs.value }}）に未着（実際の価格最新日 ${ASOF}）。前週の窓で誤配信しないため生成を中止します"
            echo "asof=${ASOF}" >> $GITHUB_OUTPUT
            exit 3
          fi
          exit $ec

      - name: Upload weekly ranking parquet as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sector-stock-weekly-${{ steps.date.outputs.value }}
          path: private-repo/bi/outputs/sector_stock_weekly.parquet
          retention-days: 7
          if-no-files-found: error

      - name: Generate movers raw (make_mover_report.py --no-pdf)
        # 週次 workflow が当週分の raw を新規生成。3 並列の generate-market が artifact 経由で共有。
        # PM 2026-07-12（絶対配信原則・日次 raw 側は維持）: --date-gate（注記モード）を付与。対象日 EOD 未着でも中止せず
        # 真のデータ日付のまま生成し、品質注記を raw 冒頭と {date}_quality_flags.txt に出力する。
        working-directory: ./private-repo/bi/pipelines
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          EDINETDB_API_KEYS: ${{ secrets.EDINETDB_API_KEYS }}
          PYTHONIOENCODING: utf-8
        run: |
          python make_mover_report.py --date ${{ steps.date.outputs.value }} --no-pdf --date-gate

      - name: Append 立花証券 e支店 API context to movers raw
        working-directory: ./private-repo/bi/pipelines
        env:
          TACHIBANA_DEMO_AUTH_ID: ${{ secrets.TACHIBANA_DEMO_AUTH_ID }}
          TACHIBANA_DEMO_PRIVATE_KEY_PEM: ${{ secrets.TACHIBANA_DEMO_PRIVATE_KEY_PEM }}
          TACHIBANA_DEMO_API_BASE: ${{ secrets.TACHIBANA_DEMO_API_BASE }}
          PYTHONIOENCODING: utf-8
        continue-on-error: true
        run: |
          if [ -z "$TACHIBANA_DEMO_AUTH_ID" ]; then
            echo "[INFO] 立花証券 Secrets 未設定・skip"
            exit 0
          fi
          python fetch_tachibana_mover_context.py --date ${{ steps.date.outputs.value }}

      - name: Upload movers raw as artifact
        # PM 2026-07-12: 品質フラグ 2 種（EOD 未着 / 週間ランキング窓ずれ）を同梱し merge-and-send の
        # 注記挿入 step へ届ける。パスの共通親が market/daily のためダウンロード側はフラット配置のまま。
        uses: actions/upload-artifact@v4
        with:
          name: movers-raw-${{ steps.date.outputs.value }}
          path: |
            private-repo/market/daily/${{ steps.date.outputs.value }}_movers_raw.md
            private-repo/market/daily/${{ steps.date.outputs.value }}_quality_flags.txt
            private-repo/market/daily/${{ steps.date.outputs.value }}_weekly_quality_flags.txt
          retention-days: 7
          if-no-files-found: error

      - name: Discord 通知（⛔ データ未着で生成見送り・週間ランキング）
        # PM 2026-08-29: price-gate 通過後に週間ランキング parquet 側で対象日不一致が出た場合も
        # 「注記して配信」ではなく生成中止とする。レポート本体は送らず運用通知のみ。
        if: failure() && steps.weekly_parquet.outputs.exit_code == '3'
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
          state: blocked
          label: 動意銘柄レポート週次 データ未着のため生成見送り
          date: ${{ steps.date.outputs.value }}
          meaning: 週間ランキングの価格データが対象週の金曜に届いておらず（実際の最新日 ${{ steps.weekly_parquet.outputs.asof }}）、前週の数値で誤ったレポートを出すことを避けて生成・配信を見送りました。レポートは配信していません。
          action_required: price_history.yml の run を確認 → 価格データ着荷後に本 workflow を手動 dispatch（force_rerun=true・target_date に対象週の金曜を指定）

      - name: Discord 通知（❌ raw 生成失敗）
        if: (failure() || cancelled()) && steps.weekly_parquet.outputs.exit_code != '3'
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
          state: failed
          label: 動意銘柄レポート週次 失敗（raw 生成）
          date: ${{ steps.date.outputs.value }}
          meaning: 週次動意の元データ（raw または週間ランキング parquet）の生成が失敗し、後続の市場別生成が始まらないため今週分は未配信です。
          action_required: run ログ確認 → 手動 dispatch（force_rerun=true）で再実行

  generate-market:
    needs: setup-raw
    runs-on: ubuntu-latest
    # PM 2026-08-26: 4 並列を 1 実行へ統合し、1 ジョブが 3 市場 40 銘柄を書くため各試行の枠を拡張
    # （gen1 45→60 分・gen2/gen3 30→45 分）。
    # 最悪ケース = 前段（clone/setup/fonts/playwright/parquet 配布）12 分 + 1 回目 60 分 + 待機 1 分
    #            + 2 回目 45 分 + 待機 3 分 + 3 回目 45 分 + 検証/artifact 3 分 = 169 分 → 180 分。
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # PM 2026-08-26 確定: 固定プロンプト121KB×4重複を解消するため1実行へ統合。
        # 並び順はグロース→スタンダード→プライム（prompts/mover-weekly.md が制御）。
        # 旧構成 [prime, standard, growth_a, growth_b] の4分割は「出力32Kトークン上限」が根拠だったが、
        # 2026-07-07 に CLAUDE_CODE_MAX_OUTPUT_TOKENS を 64000 へ引き上げ済みで根拠が消滅した。
        # matrix 構造自体は参照箇所の書き換えを最小にするため残し、値だけを [all] の1値に畳む。
        market: [all]
    steps:
      - name: Checkout report-pipelines
        uses: actions/checkout@v4
        with:
          path: report-pipelines

      - name: Setup SSH for private repo
        env:
          PRIVATE_REPO_DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_REPO_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone private repo (mizuki-fund)
        run: |
          git clone git@github.com:mzinvestment1105/mizuki-fund.git private-repo

      - name: Copy pipelines and static files from Public into private working tree
        run: |
          cp -f report-pipelines/bi/pipelines/*.py private-repo/bi/pipelines/
          cp -f report-pipelines/bi/pipelines/requirements.txt private-repo/bi/pipelines/
          mkdir -p private-repo/bi/pipelines/lib
          cp -rf report-pipelines/bi/pipelines/lib/*.py private-repo/bi/pipelines/lib/ 2>/dev/null || true
          # PDF 配信用の埋め込みフォント（assets/fonts/*.woff2）を Public から overlay
          mkdir -p private-repo/bi/pipelines/assets/fonts
          cp -rf report-pipelines/bi/pipelines/assets/fonts/* private-repo/bi/pipelines/assets/fonts/ 2>/dev/null || true
          mkdir -p private-repo/agents private-repo/playbook
          cp -f report-pipelines/agents/*.md private-repo/agents/ 2>/dev/null || true
          cp -f report-pipelines/playbook/*.md private-repo/playbook/ 2>/dev/null || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: report-pipelines/bi/pipelines/requirements.txt

      - name: Install dependencies
        run: pip install -r report-pipelines/bi/pipelines/requirements.txt

      - name: Install Japanese fonts (Noto Sans CJK JP)
        # PM 2026-08-19 承認（動意日次 mover_report_daily.yml からの横展開）: `sudo apt-get update -qq`
        # が出力ゼロのまま数十分ハングし、ジョブ枠に到達して配信ごと落ちる事故（GitHub 側の一時事象）の
        # 恒久対策。①ステップ単位 timeout ②各コマンドを timeout コマンドで打ち切り ③待機つき 3 回リトライ。
        #
        # 【失敗してもジョブを落とさない理由】本 workflow の誌面生成は send_report_pdf_discord.py →
        # bi/pipelines/lib/md_to_pdf.py で行い、同モジュールは assets/fonts の日本語サブセット woff2
        # （NotoSansJP / NotoSerifJP / BIZ UDPGothic）を base64 で @font-face 埋め込みする設計＝
        # システムのフォント選択に一切依存しない。よって apt のフォントが無くても誌面が豆腐（文字化け）に
        # なることはなく、ここで落とすと「配信できたはずの日を落とす」だけになる。
        # 時間予算: 1 試行 = update 75 秒 + install 120 秒 = 最大 195 秒。新規試行は開始 280 秒までに
        # 限るので最悪 475 秒で自己終了し、ステップ枠 8 分（480 秒）内に必ず警告を出して抜ける。
        timeout-minutes: 8
        continue-on-error: true
        run: |
          set -u
          DEADLINE=$(( $(date +%s) + 280 ))
          for i in 1 2 3; do
            if [ "$i" -gt 1 ] && [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "時間予算を超過したため再試行を打ち切ります"
              break
            fi
            if timeout 75 sudo apt-get update -qq \
               && timeout 120 sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra; then
              echo "日本語フォント導入に成功しました（${i} 回目）"
              exit 0
            fi
            echo "日本語フォント導入に失敗またはハングしました（${i}/3 回目）"
            if [ "$i" -lt 3 ]; then
              sleep $((i * 15))
            fi
          done
          echo "::warning::日本語フォントの apt 導入をスキップしました。PDF は assets/fonts の埋め込みフォント（base64 @font-face）で描画するため誌面に影響はなく、配信を続行します"
          exit 0

      - name: Install Playwright Chromium
        run: |
          playwright install chromium --with-deps

      - name: Download weekly ranking parquet artifact (from setup-raw)
        # PM 2026-07-12 確定: setup-raw が対象日ゲート付きで再生成した sector_stock_weekly.parquet を
        # 4 並列ジョブへ配布し、clone 内のコミット済み旧 parquet（前週 AsOf の可能性）を上書きする。
        uses: actions/download-artifact@v4
        with:
          name: sector-stock-weekly-${{ needs.setup-raw.outputs.target_date }}
          path: /tmp/sector-stock-weekly

      - name: Place weekly ranking parquet into private working tree
        run: |
          mkdir -p private-repo/bi/outputs
          cp -f /tmp/sector-stock-weekly/sector_stock_weekly.parquet private-repo/bi/outputs/sector_stock_weekly.parquet
          echo "Placed sector_stock_weekly.parquet ($(stat -c%s private-repo/bi/outputs/sector_stock_weekly.parquet) bytes)"

      - name: Download movers raw artifact (from setup-raw)
        uses: actions/download-artifact@v4
        with:
          name: movers-raw-${{ needs.setup-raw.outputs.target_date }}
          path: /tmp/movers-raw

      - name: Place movers raw into private working tree
        working-directory: ./private-repo
        env:
          TARGET_DATE: ${{ needs.setup-raw.outputs.target_date }}
          TARGET_MARKET: ${{ matrix.market }}
        run: |
          mkdir -p market/daily
          SRC=/tmp/movers-raw/${TARGET_DATE}_movers_raw.md
          DST=market/daily/${TARGET_DATE}_movers_raw.md
          # PM 2026-08-26 確定: 統合後は全市場を1実行が担当するため raw は無加工で全量を渡す
          # （旧 case 文による市場別スライスは統合により不要）。
          cp "$SRC" "$DST"
          echo "Placed $DST for market=$TARGET_MARKET ($(wc -l < "$DST") lines / source $(wc -l < "$SRC") lines)"

      - name: Check screening_master parquet existence (no update・PM 2026-05-23 確定)
        working-directory: ./private-repo/bi/pipelines
        env:
          PYTHONIOENCODING: utf-8
          TARGET_DATE: ${{ needs.setup-raw.outputs.target_date }}
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          import pandas as pd

          parquet = Path("../outputs/screening_master.parquet")
          if not parquet.exists():
              print(f"[WARN] screening_master.parquet が見つかりません: {parquet}")
              sys.exit(0)
          df = pd.read_parquet(parquet)
          latest = pd.to_datetime(df["DataDate"]).max().date().isoformat() if "DataDate" in df.columns else "unknown"
          target = os.environ.get("TARGET_DATE", "")
          print(f"screening_master DataDate: {latest} (target: {target})")
          PY

      - name: 既存週次レポートファイルを削除（前回不良ファイル読込スキップ防止）
        working-directory: ./private-repo
        env:
          TARGET_DATE: ${{ needs.setup-raw.outputs.target_date }}
          TARGET_MARKET: ${{ matrix.market }}
        run: |
          for SUFFIX in "" "_${TARGET_MARKET}"; do
            TARGET_FILE="market/daily/movers/${TARGET_DATE}_weekly${SUFFIX}.md"
            if [ -f "$TARGET_FILE" ]; then
              echo "Removing existing $TARGET_FILE..."
              rm -f "$TARGET_FILE"
            fi
          done

      # PM 2026-08-19 承認（動意日次 mover_report_daily.yml からの横展開）: Anthropic 側の過負荷応答
      # （API Error: 529 overloaded_error）を初回 API 呼び出しで受けて即 exit 1 する事故の恒久対策。
      # 第三者製の新規 action を足さず、continue-on-error + outcome 判定の再試行ステップだけで構成する。
      # 529 は即時再試行が無意味なため待機を指数的に伸ばす（60 秒 → 180 秒）。3 ステップとも
      # continue-on-error のため、成否は最後の Verify ステップ 1 箇所（成果物ファイルが非空か）で決まる。
      - name: Generate ${{ matrix.market }} market section via Claude Code (Opus 5 + effort high)
        id: gen1
        continue-on-error: true
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-5
          prompt_file: report-pipelines/prompts/mover-weekly.md
          allowed_tools: "Read,Write,Edit,Bash,Grep,Glob,WebSearch,WebFetch"
          timeout_minutes: "60"
          # PM 2026-07-07: 32001 出力トークン上限で市場セクションが途中終了する事故の予防で 64000 へ。
          claude_env: |
            CLAUDE_CODE_EFFORT_LEVEL: high
            CLAUDE_CODE_MAX_OUTPUT_TOKENS: 64000
        env:
          TARGET_DATE: ${{ needs.setup-raw.outputs.target_date }}
          TARGET_MARKET: ${{ matrix.market }}
          PRIVATE_REPO_ROOT: private-repo
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: 64000

      # PM 2026-09-05 承認: 枠切れ（Spending cap reached）は待機しても同一 run 内では回復しない。
      # 実測（2026-09-04 の夜間PTS動意 run）では枠切れ後の再試行が 1.5 秒で即時拒否されるだけで、
      # 待機が枠のリセット（数十分先）に届かず、空振りが当日の自動リトライ上限を食い潰していた。
      # よって枠切れを検出した試行の後続は打ち切る（一時障害のリトライは従来どおり残す）。
      - name: Detect spending cap (attempt 1)
        id: cap1
        if: success() && steps.gen1.outcome == 'failure'
        env:
          EXECUTION_FILE: ${{ steps.gen1.outputs.execution_file }}
          ATTEMPT: '1'
        run: bash report-pipelines/.github/scripts/detect_spending_cap.sh

      - name: Wait before retry 2 (Claude overloaded 等の一時エラー)
        if: success() && steps.gen1.outcome == 'failure' && steps.cap1.outputs.capped != 'true'
        env:
          TARGET_DATE: ${{ needs.setup-raw.outputs.target_date }}
          TARGET_MARKET: ${{ matrix.market }}
        run: |
          F="private-repo/market/daily/movers/${TARGET_DATE}_weekly_${TARGET_MARKET}.md"
          # 途中まで書かれた不完全ファイルは退避（削除しない）。再試行が白紙から書き直せるようにする。
          if [ -f "$F" ]; then
            mv "$F" "/tmp/${TARGET_DATE}_weekly_${TARGET_MARKET}.attempt1.partial.md"
            echo "1 回目の不完全な出力を /tmp へ退避しました（再試行が白紙から書き直せるようにするため）"
          fi
          echo "1 回目が失敗しました。60 秒待機して再試行します（529 は即時再試行が無意味なため）"
          sleep 60

      - name: Generate ${{ matrix.market }} market section via Claude Code (retry 2)
        id: gen2
        if: success() && steps.gen1.outcome == 'failure' && steps.cap1.outputs.capped != 'true'
        continue-on-error: true
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-5
          prompt_file: report-pipelines/prompts/mover-weekly.md
          allowed_tools: "Read,Write,Edit,Bash,Grep,Glob,WebSearch,WebFetch"
          timeout_minutes: "45"
          claude_env: |
            CLAUDE_CODE_EFFORT_LEVEL: high
            CLAUDE_CODE_MAX_OUTPUT_TOKENS: 64000
        env:
          TARGET_DATE: ${{ needs.setup-raw.outputs.target_date }}
          TARGET_MARKET: ${{ matrix.market }}
          PRIVATE_REPO_ROOT: private-repo
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: 64000

      - name: Detect spending cap (attempt 2)
        id: cap2
        if: success() && steps.gen2.outcome == 'failure'
        env:
          EXECUTION_FILE: ${{ steps.gen2.outputs.execution_file }}
          ATTEMPT: '2'
        run: bash report-pipelines/.github/scripts/detect_spending_cap.sh

      - name: Wait before retry 3 (Claude overloaded 等の一時エラー)
        if: success() && steps.gen2.outcome == 'failure' && steps.cap2.outputs.capped != 'true'
        env:
          TARGET_DATE: ${{ needs.setup-raw.outputs.target_date }}
          TARGET_MARKET: ${{ matrix.market }}
        run: |
          F="private-repo/market/daily/movers/${TARGET_DATE}_weekly_${TARGET_MARKET}.md"
          # 途中まで書かれた不完全ファイルは退避（削除しない）。再試行が白紙から書き直せるようにする。
          if [ -f "$F" ]; then
            mv "$F" "/tmp/${TARGET_DATE}_weekly_${TARGET_MARKET}.attempt2.partial.md"
            echo "2 回目の不完全な出力を /tmp へ退避しました（再試行が白紙から書き直せるようにするため）"
          fi
          echo "2 回目も失敗しました。180 秒待機して最終再試行します"
          sleep 180

      - name: Generate ${{ matrix.market }} market section via Claude Code (retry 3)
        id: gen3
        if: success() && steps.gen2.outcome == 'failure' && steps.cap2.outputs.capped != 'true'
        continue-on-error: true
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-5
          prompt_file: report-pipelines/prompts/mover-weekly.md
          allowed_tools: "Read,Write,Edit,Bash,Grep,Glob,WebSearch,WebFetch"
          timeout_minutes: "45"
          claude_env: |
            CLAUDE_CODE_EFFORT_LEVEL: high
            CLAUDE_CODE_MAX_OUTPUT_TOKENS: 64000
        env:
          TARGET_DATE: ${{ needs.setup-raw.outputs.target_date }}
          TARGET_MARKET: ${{ matrix.market }}
          PRIVATE_REPO_ROOT: private-repo
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: 64000

      - name: Verify generated weekly market section (成否の一元判定)
        # 上の 3 ステップは全て continue-on-error のため、ジョブの成否はここだけで決まる。
        # 「どの試行で成功したか」に依存せず成果物の実在で判定するので、リトライ成功を失敗扱いする
        # / 失敗を成功扱いする判定崩れが起きない。
        env:
          TARGET_DATE: ${{ needs.setup-raw.outputs.target_date }}
          TARGET_MARKET: ${{ matrix.market }}
        run: |
          F="private-repo/market/daily/movers/${TARGET_DATE}_weekly_${TARGET_MARKET}.md"
          echo "attempt outcomes: gen1=${{ steps.gen1.outcome }} gen2=${{ steps.gen2.outcome }} gen3=${{ steps.gen3.outcome }}"
          if [ ! -s "$F" ]; then
            echo "::error::${TARGET_MARKET} 市場セクション（週次）が 3 回の試行で生成されませんでした: $F"
            exit 1
          fi
          echo "生成成功: $F ($(wc -l < "$F") lines)"

      - name: Upload market section as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mover-weekly-${{ matrix.market }}-${{ needs.setup-raw.outputs.target_date }}
          path: private-repo/market/daily/movers/${{ needs.setup-raw.outputs.target_date }}_weekly_${{ matrix.market }}.md
          retention-days: 7
          if-no-files-found: error

      - name: Discord 通知（❌ 市場別失敗）
        if: failure() || cancelled()
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
          state: failed
          label: 動意銘柄レポート週次 失敗（${{ matrix.market }} 市場の生成）
          date: ${{ needs.setup-raw.outputs.target_date }}
          meaning: ${{ matrix.market }} 市場セクションの生成が失敗し、統合レポートが組めないため今週分は未配信です。
          action_required: run ログ確認 → 手動 dispatch（force_rerun=true）で再実行。ログに「Spending cap reached」がある場合は Claude 利用枠切れ＝リセット時刻以降に force_rerun=true

  merge-and-send:
    needs: [setup-raw, generate-market]
    runs-on: ubuntu-latest
    # PM 2026-08-19: フォント導入の堅牢化でステップ枠 8 分を確保したため、旧 15 分枠では
    # フォント（最大 8 分）+ Playwright（実測 6 分）+ 統合/送信/commit で溢れる。日次の
    # merge-and-send と同じ 30 分へ揃える。
