          echo "Placed $OUTPUT ($(wc -l < "$OUTPUT") lines)"

      - name: Download movers raw artifact (品質フラグ取得用)
        # setup-raw が出力した品質フラグを注記挿入 step へ渡す。
        # PM 2026-08-29: 週間ランキング窓ずれフラグ（{date}_weekly_quality_flags.txt）は
        # 生成中止側へ移したため常に空。日次 raw 側フラグのみが注記対象。
        uses: actions/download-artifact@v4
        with:
          name: movers-raw-${{ needs.setup-raw.outputs.target_date }}
          path: /tmp/movers-raw

      - name: 品質検査（件数/タイトル日付/相互参照・不合格でも送信は止めない）
        # PM 2026-07-12 改定（絶対配信原則）: check_mover_counts の exit 3（品質不合格）は検知
        # シグナルとして受けて step は成功で通し、次の注記挿入 step が品質注記を機械挿入して
        # 必ず配信する（旧「⛔ 送信中止＝未配信」は PM 却下）。--date でタイトル日付検知も適用。
        # PM 2026-09-05 追加: check_mover_counts は誌面内の相互参照表記（「→ 値下がり N 位を参照」等・
        # _common_rules.md §40）も lib/crossref_check.py で検出しログへ出す。これは警告のみで
        # exit code を変えないため配信は止まらない（絶対配信原則）。次回生成で Claude が是正する。
        # exit 1（ファイル読込不可等のインフラ失敗）のみ step 失敗（❌）。
        id: gate
        working-directory: ./private-repo
        env:
          TARGET_DATE: ${{ needs.setup-raw.outputs.target_date }}
          PYTHONIOENCODING: utf-8
        run: |
          set +e
          python bi/pipelines/check_mover_counts.py --file market/daily/movers/${TARGET_DATE}_weekly.md --date ${TARGET_DATE} 2>&1 | tee /tmp/gate.log
          ec=${PIPESTATUS[0]}
          echo "exit_code=$ec" >> $GITHUB_OUTPUT
          if [ "$ec" -eq 3 ]; then
            echo "品質ゲート不合格 → 注記を挿入して配信を続行します（PM 2026-07-12 絶対配信原則）"
            exit 0
          fi
          exit $ec

      - name: 品質注記の機械挿入（フラグ検知時のみ・各市場タイトル直後）
        # PM 2026-08-29 改定: 「対象日の価格データ未着」を注記して配信する経路は廃止した
        # （未着なら price-gate / setup-raw で生成ごと止まるため注記は不要）。
        #   廃止した注記: {date}_weekly_quality_flags.txt（週間ランキングの対象日未着＝窓ずれ）
        #   残した注記  : {date}_quality_flags.txt（make_mover_report.py --date-gate が出す
        #                 日次 raw 側の軽微な品質フラグ）／品質検査 check_mover_counts.py の
        #                 不合格内容（件数不足・タイトル日付ずれ等）。この 2 系統は「データは
        #                 揃っているが誌面に軽微な問題がある」ケースであり、yml 冒頭の
        #                 絶対配信原則どおり注記つきで配信を続ける。
        id: annotate
        working-directory: ./private-repo
        env:
          TARGET_DATE: ${{ needs.setup-raw.outputs.target_date }}
        run: |
          NOTE=""
          for FLAGS in /tmp/movers-raw/${TARGET_DATE}_quality_flags.txt; do
            if [ -s "$FLAGS" ]; then
              PART="$(tr '\n' ' ' < "$FLAGS" | sed 's/ *$//')"
              NOTE="${NOTE}${NOTE:+ ／ }${PART}"
            fi
          done
          if [ "${{ steps.gate.outputs.exit_code }}" = "3" ]; then
            # paste -d はマルチバイト区切りをバイト分割するため awk で連結（・区切り）
            DETAIL=$(grep '^  - ' /tmp/gate.log | head -5 | sed 's/^  - //' | awk 'NR>1{printf "・"} {printf "%s", $0} END{print ""}')
            NOTE="${NOTE}${NOTE:+ ／ }機械検査で不合格項目あり（${DETAIL}）"
          fi
          if [ -n "$NOTE" ]; then
            F=market/daily/movers/${TARGET_DATE}_weekly.md
            awk -v note="> ⚠️ **品質注記**: ${NOTE}" '{print} /^# 動意銘柄レポート /{print ""; print note}' "$F" > "${F}.tmp" && mv "${F}.tmp" "$F"
            echo "annotated=true" >> $GITHUB_OUTPUT
            echo "note=${NOTE}" >> $GITHUB_OUTPUT
            echo "品質注記を挿入: ${NOTE}"
          else
            echo "annotated=false" >> $GITHUB_OUTPUT
            echo "品質フラグなし・注記挿入なし"
          fi

      - name: 送信直前の最終重複チェック（二重配信の最後の防波堤）
        # ===============================================================================
        # PM 2026-08-29 追加: guard の weekcheck は「起動時点」のスナップショットであり、
        # 2 本のレーンがほぼ同時に起きた場合は両方とも weekcheck を通過しうる（互いにまだ
        # running として見えないため）。setup-raw の concurrency group は
        # cancel-in-progress: false のため後発を queue するだけで、順番に走って 2 回配信して
        # しまう。そこで【送信の直前】にもう一度、対象週に配信済み run が無いかを確認する。
        # ここは生成が終わった後なので判定は一瞬で済み、配信済みなら送信だけを skip する
        # （生成物は commit されるため無駄にならない）。
        # ===============================================================================
        id: predup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_DATE: ${{ needs.setup-raw.outputs.target_date }}
          MY_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          SINCE="${TARGET_DATE}T00:00:00+09:00"
          STATS=$(bash ../report-pipelines/.github/scripts/check_delivery.sh mover_weekly.yml merge-and-send "${MY_RUN_ID}" "${SINCE}" || echo '{"delivered":0}')
          DELIVERED=$(echo "$STATS" | jq -r '.delivered // 0')
          echo "送信直前の対象週配信済み件数: ${DELIVERED}"
          if [ "$DELIVERED" -gt 0 ]; then
            echo "::warning::対象週 ${TARGET_DATE} は他の run が既に配信済み（${DELIVERED} 件）。二重配信を避けるため本 run の Discord 送信を skip します"
            echo "skip_send=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_send=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Discord (PDF・全市場 1 本)
        id: send
        if: steps.predup.outputs.skip_send != 'true'
        working-directory: ./private-repo/bi/pipelines
        env:
          DISCORD_WEBHOOK_MOVERS: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
          PYTHONIOENCODING: utf-8
        run: |
          python send_report_pdf_discord.py --kind movers_weekly --date ${{ needs.setup-raw.outputs.target_date }}

      - name: Rotate report archives (5 件超過分を archive/ へ退避)
        working-directory: ./private-repo
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # ops/ は Copy pipelines step の対象外のため Public 側から都度 overlay（最新版を保証）
          mkdir -p bi/pipelines/ops
          cp -f ../report-pipelines/bi/pipelines/ops/rotate_report_archives.py bi/pipelines/ops/
          python bi/pipelines/ops/rotate_report_archives.py

      - name: Commit and push to private repo
        # rebase 方式は履歴書き換え・並行 push で index.lock 残留の構造的弱点があるため、
        # fresh-base 方式の共通ヘルパー（Public 側から直接実行・repo 内コピー禁止）へ置換。
        working-directory: ./private-repo
        env:
          TARGET_DATE: ${{ needs.setup-raw.outputs.target_date }}
        run: |
          bash ../report-pipelines/bi/pipelines/ops/ci_commit_push.sh \
            -m "data: mover weekly ${TARGET_DATE}" market/daily

      - name: Discord 通知（⚠️ 配信済み・品質注記あり）
        # PM 2026-07-12（絶対配信原則）: 品質問題があってもレポートは配信済み。何が注記されたかを PM へ通知。
        if: steps.annotate.outputs.annotated == 'true' && steps.send.outcome == 'success'
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
          state: partial
          label: 動意銘柄レポート週次 配信済み（品質注記あり）
          date: ${{ needs.setup-raw.outputs.target_date }}
          meaning: レポートは配信済みです。品質注記（${{ steps.annotate.outputs.note }}）を各市場の冒頭に付けています。
          action_required: レポート冒頭の品質注記を確認（数値を使う前に注記のデータ日付・週の窓を参照）

      - name: Discord 通知（⚠️ 配信済み・後処理のみ失敗）
        if: (failure() || cancelled()) && steps.send.outcome == 'success'
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
          state: partial
          label: 動意銘柄レポート週次 後処理のみ失敗
          date: ${{ needs.setup-raw.outputs.target_date }}
          meaning: レポート本体は配信済みです。配信後のアーカイブ整理または commit だけが失敗しました。
          action_required: 不要（差分は次回 run が回収）

      - name: Discord 通知（⏭ 二重配信回避で送信 skip）
        # 無言 skip の禁止（PM）: 他 run が既に配信済みだったため本 run は送信しなかった旨を残す。
        if: steps.predup.outputs.skip_send == 'true'
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
          state: none
          label: 動意銘柄レポート週次 送信 skip（二重配信回避）
          date: ${{ needs.setup-raw.outputs.target_date }}
          meaning: 対象週分は別の実行がすでに配信済みだったため、同じレポートを二重に送らないよう本実行の送信を見送りました。レポートは配信済みです。
          action_required: 不要

      - name: Discord 通知（❌ merge/送信失敗）
        # 品質フラグ（exit_code=3）は step 成功で通し注記配信するため、ここに来るのはインフラ失敗のみ。
        # predup で送信を skip した run は「他 run が配信済み」であり未配信ではないため除外する。
        if: (failure() || cancelled()) && steps.send.outcome != 'success' && steps.predup.outputs.skip_send != 'true'
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_MOVERS }}
          state: failed
          label: 動意銘柄レポート週次 失敗（統合/送信）
          date: ${{ needs.setup-raw.outputs.target_date }}
          meaning: 市場別セクションの統合または Discord 送信が失敗し、今週分は未配信です。
          action_required: run ログ確認 → 手動 dispatch（force_rerun=true）で再実行
