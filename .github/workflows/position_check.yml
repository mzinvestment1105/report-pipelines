name: ポジションチェック（朝夕）

"on":
  # PM 2026-07-07 新設（ロードマップ Phase 2-2）: /position-check の GHA 版。
  # cron 2本 = 寄り前（UTC 23:15 日-木 = JST 08:15 月-金・前日終値+夜間材料）と
  # 引け直後（UTC 06:45 月-金 = JST 15:45・当日終値）。
  # Cloudflare Worker 未登録のまま GHA cron 単独で開始（Worker 追加は別途）。
  # guard ジョブが同日同セッション（am/pm）の既存 run を検知して重複発火を防ぐ。
  workflow_dispatch:
    inputs:
      session:
        description: 'セッション (am=寄り前 / pm=引け直後・空欄で JST 時刻から自動判定)'
        required: false
        default: ''
      target_date:
        description: '対象日付 (YYYY-MM-DD・空欄で当日)'
        required: false
        default: ''
      force_rerun:
        description: 'true で同日同セッション重複ガードを無視して強制実行（修正後の再テスト用）'
        required: false
        default: 'false'
  schedule:
    - cron: '15 23 * * 0-4'
    - cron: '45 6 * * 1-5'

concurrency:
  group: position_check-daily
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      session: ${{ steps.check.outputs.session }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      # 通知 composite action（.github/actions/notify-discord）を使うため checkout が必要
      - name: Checkout report-pipelines (通知 action 用)
        uses: actions/checkout@v4

      # Secrets 未登録時に分かりやすく fail する（必須チェック）
      - name: Check required secrets (DISCORD_WEBHOOK_TRADER)
        env:
          WH: ${{ secrets.DISCORD_WEBHOOK_TRADER }}
        run: |
          if [ -z "$WH" ]; then
            echo "::error::Secrets 未登録: DISCORD_WEBHOOK_TRADER が report-pipelines の Actions Secrets にありません。Discord トレーダーチャンネルの Webhook URL を Settings > Secrets and variables > Actions に登録してください。"
            exit 1
          fi
          echo "DISCORD_WEBHOOK_TRADER: 登録確認 OK"

      - name: Determine session and check same-session duplicates
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY_JST=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          TODAY_START="${TODAY_JST}T00:00:00+09:00"
          MY_RUN_ID=${{ github.run_id }}
          EVENT="${{ github.event_name }}"
          HOUR_JST=$((10#$(TZ=Asia/Tokyo date +%H)))

          # セッション確定: 手動入力優先・なければ JST 時刻から自動判定（12時未満=am）
          INPUT_SESSION="${{ github.event.inputs.session }}"
          if [ -n "$INPUT_SESSION" ]; then
            SESSION="$INPUT_SESSION"
          elif [ "$HOUR_JST" -lt 12 ]; then
            SESSION="am"
          else
            SESSION="pm"
          fi
          if [ "$SESSION" != "am" ] && [ "$SESSION" != "pm" ]; then
            echo "::error::session は am / pm のみ指定可: ${SESSION}"
            exit 1
          fi
          echo "session=${SESSION}" >> $GITHUB_OUTPUT
          echo "Session: ${SESSION} (event=${EVENT} hour_jst=${HOUR_JST})"

          # force_rerun は「手動 workflow_dispatch かつ明示 true」の時のみ有効（誤再発火防止）
          if [ "$EVENT" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force_rerun }}" = "true" ]; then
            echo "proceed=true" >> $GITHUB_OUTPUT
            echo "reason=force_rerun (manual guard bypass)" >> $GITHUB_OUTPUT
            exit 0
          fi

          # GitHub cron は数時間遅延することがあるため、schedule 起動のみ時間帯ゲートで無害化する。
          # workflow_dispatch（PM 手動）は常に通す。妥当な発行帯 = am: JST 7-11 時 / pm: JST 15-22 時。
          if [ "$EVENT" = "schedule" ]; then
            if [ "$SESSION" = "am" ] && { [ "$HOUR_JST" -lt 7 ] || [ "$HOUR_JST" -gt 11 ]; }; then
              echo "proceed=false" >> $GITHUB_OUTPUT
              echo "reason=skip (cron outside am window: ${HOUR_JST}h JST)" >> $GITHUB_OUTPUT
              exit 0
            fi
            if [ "$SESSION" = "pm" ] && { [ "$HOUR_JST" -lt 15 ] || [ "$HOUR_JST" -gt 22 ]; }; then
              echo "proceed=false" >> $GITHUB_OUTPUT
              echo "reason=skip (cron outside pm window: ${HOUR_JST}h JST)" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          RUNS=$(gh api -X GET \
            "repos/${{ github.repository }}/actions/workflows/position_check.yml/runs" \
            -f "created=>=${TODAY_START}" \
            --jq "[.workflow_runs[] | select(.id != ${MY_RUN_ID})]")

          # 各 run のセッションを created_at（UTC）の JST 換算時刻で分類（12時未満=am）し、
          # 同セッションの run のみで重複判定する（am と pm は互いに独立して1日1回ずつ発行）。
          SAME=$(echo "$RUNS" | jq --arg s "$SESSION" \
            '[.[] | ((((.created_at|fromdate)+32400) % 86400) / 3600 | floor) as $h | select((if $h < 12 then "am" else "pm" end) == $s)]')

          ACTIVE=$(echo "$SAME" | jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting" or .status=="action_required" or .status=="pending")] | length')
          DONE_OK=$(echo "$SAME" | jq '[.[] | select(.conclusion=="success" or .conclusion=="neutral")] | length')
          DONE_FAIL=$(echo "$SAME" | jq '[.[] | select(.conclusion=="failure" or .conclusion=="cancelled" or .conclusion=="startup_failure" or .conclusion=="timed_out" or .conclusion=="stale" or .conclusion=="action_required")] | length')

          echo "Today (${TODAY_JST}) session=${SESSION}: active=${ACTIVE} done_ok=${DONE_OK} done_fail=${DONE_FAIL} (excluding self ${MY_RUN_ID})"

          if [ "$DONE_OK" -gt 0 ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=skip (already succeeded today ${SESSION}: done_ok=${DONE_OK})" >> $GITHUB_OUTPUT
          elif [ "$ACTIVE" -gt 0 ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=skip (active run exists: active=${ACTIVE})" >> $GITHUB_OUTPUT
          elif [ "$EVENT" = "schedule" ] && [ "$DONE_FAIL" -ge 2 ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=retry_cap (cron stopped: done_fail=${DONE_FAIL} >= 2)" >> $GITHUB_OUTPUT
          else
            echo "proceed=true" >> $GITHUB_OUTPUT
            if [ "$DONE_FAIL" -gt 0 ]; then
              echo "reason=recovery (done_fail=${DONE_FAIL})" >> $GITHUB_OUTPUT
            else
              echo "reason=initial" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Discord 通知（🚨 自動リトライ停止）
        if: contains(steps.check.outputs.reason, 'retry_cap')
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_TRADER }}
          state: alert
          label: ポジションチェック（${{ steps.check.outputs.session }}）自動リトライ停止
          meaning: 同セッションで 2 回以上失敗したため cron の自動再実行を停止しました。本セッション分は未配信です。
          action_required: run ログ確認 → 原因解消後に手動 dispatch（session=${{ steps.check.outputs.session }}・force_rerun=true）で再実行

      - name: Discord 通知（guard 失敗）
        if: failure() || cancelled()
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_TRADER || secrets.DISCORD_WEBHOOK_URL }}
          state: failed
          label: ポジションチェック guard 失敗
          meaning: 実行前チェック（セッション判定・当日重複判定）自体がエラーになり、生成ジョブが起動していません。
          action_required: run ログ確認 → 手動 dispatch で再実行

  generate:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Determine target date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            echo "value=${{ github.event.inputs.target_date }}" >> $GITHUB_OUTPUT
          else
            echo "value=$(TZ=Asia/Tokyo date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          fi

      - name: Checkout report-pipelines
        uses: actions/checkout@v4
        with:
          path: report-pipelines

      - name: Setup SSH for private repo
        env:
          PRIVATE_REPO_DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_REPO_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone private repo (mizuki-fund)
        run: |
          git clone git@github.com:mzinvestment1105/mizuki-fund.git private-repo

      - name: Copy pipelines and static files from Public into private working tree
        # PM が Private 側への push を忘れた場合でも、Public 側の最新ファイルで上書きすることで
        # 自動化の品質を保つ（Python スクリプト + lib/・agents/・playbook/）
        run: |
          cp -f report-pipelines/bi/pipelines/*.py private-repo/bi/pipelines/
          cp -f report-pipelines/bi/pipelines/requirements.txt private-repo/bi/pipelines/
          mkdir -p private-repo/bi/pipelines/lib
          cp -rf report-pipelines/bi/pipelines/lib/*.py private-repo/bi/pipelines/lib/ 2>/dev/null || true
          mkdir -p private-repo/agents private-repo/playbook
          cp -f report-pipelines/agents/*.md private-repo/agents/ 2>/dev/null || true
          cp -f report-pipelines/playbook/*.md private-repo/playbook/ 2>/dev/null || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: report-pipelines/bi/pipelines/requirements.txt

      - name: Install dependencies
        run: pip install -r report-pipelines/bi/pipelines/requirements.txt

      - name: Fetch position quotes (yfinance live)
        working-directory: ./private-repo/bi/pipelines
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python fetch_position_quotes.py --date ${{ steps.date.outputs.value }} --session ${{ needs.guard.outputs.session }}

      - name: 既存出力ファイルを削除（前回不良ファイル読込スキップ防止）
        working-directory: ./private-repo
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
          SESSION: ${{ needs.guard.outputs.session }}
        run: |
          TARGET_FILE="market/daily/positions/${TARGET_DATE}_${SESSION}.md"
          if [ -f "$TARGET_FILE" ]; then
            echo "Removing existing $TARGET_FILE before Claude run..."
            rm -f "$TARGET_FILE"
          fi

      - name: Generate position check via Claude Code (Opus 4.7 + max thinking)
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-4-7
          prompt_file: report-pipelines/prompts/position-check.md
          # WebSearch/WebFetch は GHA で 404（補助モデル解決不可）のため付与しない。
          # 数値は fetch_position_quotes.py の raw（yfinance ライブ）で完結。
          allowed_tools: "Read,Write,Edit,Bash,Grep,Glob"
          timeout_minutes: "20"
          claude_env: |
            MAX_THINKING_TOKENS: 32000
            CLAUDE_CODE_MAX_OUTPUT_TOKENS: 64000
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
          SESSION: ${{ needs.guard.outputs.session }}
          PRIVATE_REPO_ROOT: private-repo

      - name: 行数・品質ゲート（不足なら送信せず fail）
        # exit 3 = 品質ゲート不合格（⛔ 通知へ分岐・生成物の内容不良）/ exit 1 相当はなし
        id: gate
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
          SESSION: ${{ needs.guard.outputs.session }}
        run: |
          block() { echo "::error::$1"; echo "exit_code=3" >> $GITHUB_OUTPUT; exit 3; }
          FILE="private-repo/market/daily/positions/${TARGET_DATE}_${SESSION}.md"
          if [ ! -f "$FILE" ]; then
            block "出力ファイルが存在しません: $FILE"
          fi
          LINES=$(wc -l < "$FILE")
          if [ "$LINES" -lt 10 ]; then
            block "行数不足（${LINES} 行 < 10 行）: 生成不良のため送信を中止します"
          fi
          if ! grep -q "アラートサマリー" "$FILE"; then
            block "「アラートサマリー」セクションが欠落: 送信を中止します"
          fi
          if grep -nE "N/A|取得失敗|データなし|調査要" "$FILE"; then
            block "フォールバック表記を検出: 送信を中止します"
          fi
          echo "exit_code=0" >> $GITHUB_OUTPUT
          echo "品質ゲート OK（${LINES} 行）"

      - name: Send Discord (text)
        id: send
        env:
          DISCORD_WEBHOOK_TRADER: ${{ secrets.DISCORD_WEBHOOK_TRADER }}
          REPORT_FILE: private-repo/market/daily/positions/${{ steps.date.outputs.value }}_${{ needs.guard.outputs.session }}.md
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'EOF'
          import os
          import pathlib
          import time

          import requests

          text = pathlib.Path(os.environ["REPORT_FILE"]).read_text(encoding="utf-8").strip()
          url = os.environ["DISCORD_WEBHOOK_TRADER"]

          # Discord は 1 メッセージ 2000 文字上限のため行単位で 1900 文字に分割送信
          chunks: list[str] = []
          cur = ""
          for line in text.splitlines():
              while len(line) > 1900:
                  head, line = line[:1900], line[1900:]
                  if cur:
                      chunks.append(cur)
                      cur = ""
                  chunks.append(head)
              if len(cur) + len(line) + 1 > 1900:
                  chunks.append(cur)
                  cur = line
              else:
                  cur = f"{cur}\n{line}" if cur else line
          if cur:
              chunks.append(cur)

          for chunk in chunks:
              resp = requests.post(url, json={"content": chunk}, timeout=30)
              resp.raise_for_status()
              time.sleep(1)
          print(f"Discord 送信完了: {len(chunks)} メッセージ")
          EOF

      - name: Rotate report archives (positions 5 件超過分を archive/ へ退避)
        working-directory: ./private-repo
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # ops/ は Copy pipelines step の対象外のため Public 側から都度 overlay（最新版を保証）
          mkdir -p bi/pipelines/ops
          cp -f ../report-pipelines/bi/pipelines/ops/rotate_report_archives.py bi/pipelines/ops/
          python bi/pipelines/ops/rotate_report_archives.py

      - name: Commit and push to private repo
        # rebase 方式は履歴書き換え・並行 push で index.lock 残留の構造的弱点があるため、
        # fresh-base 方式の共通ヘルパー（Public 側から直接実行・repo 内コピー禁止）へ置換。
        working-directory: ./private-repo
        run: |
          bash ../report-pipelines/bi/pipelines/ops/ci_commit_push.sh \
            -m "data: position check ${{ steps.date.outputs.value }} ${{ needs.guard.outputs.session }}" \
            market/daily

      - name: Discord 通知（⛔ 品質ゲートで送信中止）
        if: failure() && steps.gate.outputs.exit_code == '3'
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_TRADER }}
          state: blocked
          label: ポジションチェック（${{ needs.guard.outputs.session }}）送信中止（品質ゲート不合格）
          date: ${{ steps.date.outputs.value }}
          meaning: 生成物が品質基準（必須セクション・行数・フォールバック表記なし）を満たさなかったため、配信を止めました。本セッション分は未配信です。
          action_required: run ログで不合格理由を確認 → 修正後に手動 dispatch（session=${{ needs.guard.outputs.session }}・force_rerun=true）

      - name: Discord 通知（⚠️ 配信済み・後処理のみ失敗）
        if: (failure() || cancelled()) && steps.send.outcome == 'success'
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_TRADER }}
          state: partial
          label: ポジションチェック（${{ needs.guard.outputs.session }}）後処理のみ失敗
          date: ${{ steps.date.outputs.value }}
          meaning: レポート本体は配信済みです。配信後のアーカイブ整理または commit だけが失敗しました。
          action_required: 不要（差分は次回 run が回収）

      - name: Discord 通知（❌ 失敗）
        if: (failure() || cancelled()) && steps.gate.outputs.exit_code != '3' && steps.send.outcome != 'success'
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_TRADER }}
          state: failed
          label: ポジションチェック（${{ needs.guard.outputs.session }}）失敗
          date: ${{ steps.date.outputs.value }}
          meaning: 生成または送信が完了せず、本セッション分は未配信です。
          action_required: run ログ確認 → 手動 dispatch（session=${{ needs.guard.outputs.session }}・force_rerun=true）で再実行。ログに「Spending cap reached」がある場合は Claude 利用枠切れ＝リセット時刻以降に再実行
