name: tmp X search diag
# 一時診断用（このブランチでのみ動く）。出力は経過秒・件数・画面状態の分類のみ。
"on":
  push:
    branches: ["diag/x-fetch-20261005"]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Setup SSH
        env:
          PRIVATE_REPO_DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_REPO_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Clone private
        run: git clone -q --depth 1 git@github.com:mzinvestment1105/mizuki-fund.git private-repo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          pip install -q playwright python-dotenv pyyaml
          pip install -q playwright-stealth || true
          playwright install chromium --with-deps > /dev/null 2>&1
          sudo apt-get install -y -q xvfb > /dev/null 2>&1 || true
      - name: Diag
        working-directory: ./private-repo/bi/pipelines
        env:
          X_BURNER_AUTH_TOKEN: ${{ secrets.X_BURNER_AUTH_TOKEN }}
          X_BURNER_CT0: ${{ secrets.X_BURNER_CT0 }}
          X_DAILY_TARGETS: ${{ secrets.X_DAILY_TARGETS }}
          PYTHONIOENCODING: utf-8
        run: |
          cat > /tmp/diag.py <<'PY'
          import asyncio, sys, os, time
          from urllib.parse import quote_plus
          sys.path.insert(0, ".")
          import fetch_x_posts as fx
          from playwright.async_api import async_playwright
          CHAL = "しばらくお待ちください"
          Q1 = "AI min_faves:500 lang:en -filter:replies -filter:retweets"
          Q2 = "(AI OR LLM) filter:links min_faves:100 lang:ja -filter:replies -filter:retweets"
          def counter(page):
              n = {"st": 0, "tw": 0}
              async def on_resp(r):
                  if "SearchTimeline" in r.url:
                      n["st"] += 1
                      try: n["tw"] += len(fx._extract_tweets_from_graphql(await r.json()))
                      except Exception: pass
              page.on("response", on_resp)
              return n
          async def first(tag, url):
              async with async_playwright() as p:
                  browser, ctx = await fx._new_context(p, False)
                  page = await ctx.new_page()
                  resp = await page.goto(url, wait_until="domcontentloaded", timeout=60000)
                  await asyncio.sleep(5)
                  print(f"[d] fresh_first {tag} http={resp.status if resp else None} challenged={CHAL in await page.title()}")
                  await browser.close()
          async def spa(tag, entry):
              async with async_playwright() as p:
                  browser, ctx = await fx._new_context(p, False)
                  page = await ctx.new_page()
                  n = counter(page)
                  resp = await page.goto(entry, wait_until="domcontentloaded", timeout=60000)
                  await asyncio.sleep(6)
                  print(f"[d] spa {tag} entry_http={resp.status if resp else None} challenged={CHAL in await page.title()}")
                  for qn, q in (("q1", Q1), ("q2", Q2)):
                      b = dict(n)
                      path = f"/search?q={quote_plus(q)}&src=typed_query&f=live"
                      await page.evaluate("p => { window.history.pushState({}, '', p); window.dispatchEvent(new PopStateEvent('popstate', {state: {}})); }", path)
                      await asyncio.sleep(4)
                      for _ in range(4):
                          await page.evaluate("window.scrollBy(0, document.body.scrollHeight)"); await asyncio.sleep(2)
                      print(f"[d] spa {tag} {qn} search_resp={n['st']-b['st']} tweets={n['tw']-b['tw']}")
                  await browser.close()
          async def main():
              tgt = (os.environ.get("X_DAILY_TARGETS") or "").split(",")[0].strip()
              await first("search", f"https://x.com/search?q={quote_plus(Q1)}&src=typed_query&f=live")
              await first("explore", "https://x.com/explore")
              await first("home", "https://x.com/home")
              await first("user_tl", f"https://x.com/{tgt}")
              await first("followers", f"https://x.com/{tgt}/followers")
              await spa("via_followers", f"https://x.com/{tgt}/followers")
              await spa("via_explore", "https://x.com/explore")
          asyncio.run(main())
          PY
          python /tmp/diag.py 2>&1 | grep -E "^\[d\]|Error" | head -40 || true
