name: tmp X search diag
# 一時診断用（このブランチでのみ動く）。出力は経過秒・件数・画面状態の分類のみ。
"on":
  push:
    branches: ["diag/x-fetch-20261005"]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Setup SSH
        env:
          PRIVATE_REPO_DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_REPO_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Clone private
        run: git clone -q --depth 1 git@github.com:mzinvestment1105/mizuki-fund.git private-repo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          pip install -q playwright python-dotenv pyyaml
          pip install -q playwright-stealth || true
          playwright install chromium --with-deps > /dev/null 2>&1
          sudo apt-get install -y -q xvfb > /dev/null 2>&1 || true
      - name: Diag
        working-directory: ./private-repo/bi/pipelines
        env:
          X_BURNER_AUTH_TOKEN: ${{ secrets.X_BURNER_AUTH_TOKEN }}
          X_BURNER_CT0: ${{ secrets.X_BURNER_CT0 }}
          X_DAILY_TARGETS: ${{ secrets.X_DAILY_TARGETS }}
          PYTHONIOENCODING: utf-8
        run: |
          cat > /tmp/diag.py <<'PY'
          import asyncio, sys, os, time
          from urllib.parse import quote_plus
          sys.path.insert(0, ".")
          import fetch_x_posts as fx
          from playwright.async_api import async_playwright
          CHAL = "しばらくお待ちください"
          async def visit(ctx, url, tag, wait=24):
              page = await ctx.new_page()
              n = {"gql": 0, "tw": 0, "ops": set()}
              async def on_resp(r):
                  if "/graphql/" in r.url:
                      n["gql"] += 1; n["ops"].add(r.url.split("?")[0].split("/")[-1])
                      try: n["tw"] += len(fx._extract_tweets_from_graphql(await r.json()))
                      except Exception: pass
              page.on("response", on_resp)
              t0 = time.time(); cleared = None; status = None
              try:
                  resp = await page.goto(url, wait_until="domcontentloaded", timeout=60000)
                  status = resp.status if resp else None
              except Exception as e:
                  print(f"[d] {tag} goto_error {type(e).__name__}")
              for i in range(wait // 3):
                  await asyncio.sleep(3)
                  try: title = await page.title()
                  except Exception: title = CHAL
                  if CHAL not in title:
                      cleared = round(time.time() - t0, 1)
                      await page.mouse.move(640, 500)
                      for _ in range(2):
                          await page.mouse.wheel(0, 1600); await asyncio.sleep(2)
                      break
              print(f"[d] {tag} http={status} cleared_after={cleared} gql={n['gql']} tweets={n['tw']} ops={sorted(n['ops'])[:8]}")
              await page.close()
          async def main():
              tgt = (os.environ.get("X_DAILY_TARGETS") or "").split(",")[0].strip()
              q = "AI min_faves:500 lang:en -filter:replies -filter:retweets"
              s = f"https://x.com/search?q={quote_plus(q)}&src=typed_query&f=live"
              async with async_playwright() as p:
                  browser, ctx = await fx._new_context(p, False)
                  await visit(ctx, f"https://x.com/{tgt}/followers", "followers")
                  await visit(ctx, s, "search_after_followers")
                  await visit(ctx, f"https://x.com/{tgt}", "user_tl")
                  await visit(ctx, "https://x.com/explore", "explore")
                  await browser.close()
          asyncio.run(main())
          PY
          python /tmp/diag.py 2>&1 | grep -E "^\[d\]" | sed -E 's#(ops=.*)#\1#' || true
