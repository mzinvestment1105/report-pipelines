name: tmp X search diag
# 一時診断用（このブランチでのみ動く）。出力は経過秒・件数・画面状態の分類のみ。
"on":
  push:
    branches: ["diag/x-fetch-20261005"]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Setup SSH
        env:
          PRIVATE_REPO_DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_REPO_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Clone private
        run: git clone -q --depth 1 git@github.com:mzinvestment1105/mizuki-fund.git private-repo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          pip install -q playwright python-dotenv pyyaml
          pip install -q playwright-stealth || true
          playwright install chromium --with-deps > /dev/null 2>&1
          sudo apt-get install -y -q xvfb > /dev/null 2>&1 || true
      - name: Diag
        working-directory: ./private-repo/bi/pipelines
        env:
          X_BURNER_AUTH_TOKEN: ${{ secrets.X_BURNER_AUTH_TOKEN }}
          X_BURNER_CT0: ${{ secrets.X_BURNER_CT0 }}
          X_DAILY_TARGETS: ${{ secrets.X_DAILY_TARGETS }}
          PYTHONIOENCODING: utf-8
        run: |
          cat > /tmp/diag.py <<'PY'
          import asyncio, sys, os, time
          from urllib.parse import quote_plus
          sys.path.insert(0, ".")
          import fetch_x_posts as fx
          from playwright.async_api import async_playwright
          HEADED = os.environ.get("HEADED") == "1"
          L = os.environ.get("LBL", "x")
          CHAL = "しばらくお待ちください"
          async def visit(ctx, url, tag, wait=40):
              page = await ctx.new_page()
              n = {"st": 0, "tw": 0}
              async def on_resp(r):
                  if "SearchTimeline" in r.url or "UserTweets" in r.url or "UserOriginals" in r.url:
                      n["st"] += 1
                      try:
                          n["tw"] += len(fx._extract_tweets_from_graphql(await r.json()))
                      except Exception:
                          pass
              page.on("response", on_resp)
              t0 = time.time()
              try:
                  await page.goto(url, wait_until="domcontentloaded", timeout=60000)
              except Exception as e:
                  print(f"[{L}] {tag} goto_error {type(e).__name__}")
              cleared = None
              for i in range(wait // 2):
                  await asyncio.sleep(2)
                  try:
                      await page.mouse.move(300 + i * 13 % 600, 300 + i * 7 % 400)
                      title = await page.title()
                  except Exception:
                      title = ""
                  if CHAL not in title and cleared is None:
                      cleared = round(time.time() - t0, 1)
                      for _ in range(3):
                          await page.mouse.wheel(0, 1600); await asyncio.sleep(2)
                      break
              cookies = [c["name"] for c in await ctx.cookies() if c["name"].startswith("cf") or c["name"].startswith("__cf")]
              print(f"[{L}] {tag} cleared_after={cleared} timeline_resp={n['st']} tweets={n['tw']} cf_cookies={cookies}")
              await page.close()
          async def main():
              tgt = (os.environ.get("X_DAILY_TARGETS") or "").split(",")[0].strip()
              async with async_playwright() as p:
                  browser, ctx = await fx._new_context(p, HEADED)
                  q = "AI min_faves:500 lang:en -filter:replies -filter:retweets"
                  await visit(ctx, f"https://x.com/search?q={quote_plus(q)}&src=typed_query&f=live", "search1")
                  if tgt:
                      await visit(ctx, f"https://x.com/{tgt}", "profile")
                  await visit(ctx, f"https://x.com/search?q={quote_plus(q)}&src=typed_query&f=live", "search2")
                  await browser.close()
          asyncio.run(main())
          PY
          echo "--- headless"
          LBL=headless python /tmp/diag.py 2>&1 | grep -E "^\[headless\]" || true
          echo "--- headed (xvfb)"
          HEADED=1 LBL=headed xvfb-run -a python /tmp/diag.py 2>&1 | grep -E "^\[headed\]" || true
