name: テーマ動意レポート日次

"on":
  # PM 2026-05-27 確定: Cloudflare Worker (mizuki-fund-scheduler-1) からの workflow_dispatch がメイン経路。
  # PM 2026-06-05 追加: Worker 単一経路の SPOF 回避のため、Worker (17:43 JST) の約 1 時間後に
  # GHA cron をフェイルセーフとして併用。平日のみ（UTC 月-金 = 09:45）。
  # guard ジョブで当日既存 run を検知して重複発火を防ぐ。
  workflow_dispatch:
    inputs:
      target_date:
        description: '対象日付 (YYYY-MM-DD・空欄で当日)'
        required: false
        default: ''
  schedule:
    - cron: '45 9 * * 1-5'

# PM 2026-06-05: 同一 workflow の二重実行を GHA 内部ロックで防ぐ。
# PM 2026-06-06 修正: target_date による group 分裂を防ぐため固定 group へ変更。
# Worker と cron が target_date 引数の違いで別 group に入る race window を排除。
concurrency:
  group: theme_report_daily-daily
  cancel-in-progress: false

jobs:
  guard:
    # PM 2026-06-05/06: 当日 0:00 JST 以降の同 workflow の run を集計し、
    # status 全種類（cancelled / startup_failure / timed_out / stale 等）を漏れなく分類。
    # 判定: (1) DONE_OK >= 1 → skip / (2) ACTIVE >= 1 → skip
    #       (3) cron 起動かつ DONE_FAIL >= 2 → skip（連続失敗の課金暴走防止）
    #       (4) それ以外 → proceed（initial or recovery）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      # 通知 composite action（.github/actions/notify-discord）を使うため checkout が必要
      - name: Checkout report-pipelines (通知 action 用)
        uses: actions/checkout@v4

      - name: Check today's runs
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY_JST=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          TODAY_START="${TODAY_JST}T00:00:00+09:00"
          MY_RUN_ID=${{ github.run_id }}
          EVENT="${{ github.event_name }}"

          # 2026-07-07: GitHub cron は数時間遅延することがあり、深夜に遅延着火すると日付ズレ
          # レポートを発行する事故源になる（macro/position_check と同方式の時間帯ゲートを移植）。
          # schedule(cron) 起動のみ JST 15〜23 時の外なら skip。workflow_dispatch は常に通す。
          HOUR_JST=$((10#$(TZ=Asia/Tokyo date +%H)))
          if [ "$EVENT" = "schedule" ] && { [ "$HOUR_JST" -lt 15 ] || [ "$HOUR_JST" -gt 23 ]; }; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=skip (cron outside evening window: ${HOUR_JST}h JST)" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 2026-08-05 修正: run 単位の conclusion は「guard が本体ジョブを skip した run」まで
          # success と数えてしまい、本命の発火を「本日配信済み」と誤認して無言 skip させる。
          # 実際に配信/更新を行うジョブ（generate）の結果だけで判定する。
          STATS=$(bash .github/scripts/check_delivery.sh theme_report_daily.yml generate "${MY_RUN_ID}")
          DONE_OK=$(echo "$STATS" | jq -r '.delivered')
          DONE_FAIL=$(echo "$STATS" | jq -r '.failed')
          ACTIVE=$(( $(echo "$STATS" | jq -r '.sending') + $(echo "$STATS" | jq -r '.dispatch_pending') + $(echo "$STATS" | jq -r '.schedule_pending') ))

          echo "Today (${TODAY_JST}): active=${ACTIVE} done_ok=${DONE_OK} done_fail=${DONE_FAIL} event=${EVENT} (excluding self ${MY_RUN_ID})"

          if [ "$DONE_OK" -gt 0 ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=skip (already succeeded today: done_ok=${DONE_OK})" >> $GITHUB_OUTPUT
          elif [ "$ACTIVE" -gt 0 ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=skip (active run exists: active=${ACTIVE})" >> $GITHUB_OUTPUT
          elif [ "$EVENT" = "schedule" ] && [ "$DONE_FAIL" -ge 2 ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=retry_cap (cron stopped: done_fail=${DONE_FAIL} >= 2)" >> $GITHUB_OUTPUT
          else
            echo "proceed=true" >> $GITHUB_OUTPUT
            if [ "$DONE_FAIL" -gt 0 ]; then
              echo "reason=recovery (done_fail=${DONE_FAIL})" >> $GITHUB_OUTPUT
            else
              echo "reason=initial" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Discord 通知（⏱ 予備タイマー起動）
        if: github.event_name == 'schedule' && steps.check.outputs.proceed == 'true'
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_THEME }}
          state: timer
          label: テーマ動意レポート 予備タイマー起動
          meaning: 定時の Cloudflare Worker 発火が届かなかったため、GHA 側の予備タイマーが代わりに生成を開始しました。レポートはこのあと通常どおり届きます。
          action_required: 不要（毎日続く場合のみ Worker 点検）

      - name: Discord 通知（🚨 自動リトライ停止）
        if: contains(steps.check.outputs.reason, 'retry_cap')
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_THEME }}
          state: alert
          label: テーマ動意レポート 自動リトライ停止
          meaning: 当日 2 回以上失敗したため cron の自動再実行を停止しました。本日未配信です。
          action_required: run ログ確認 → 原因解消後に手動 dispatch で再実行

      - name: Discord 通知（guard 失敗）
        if: failure() || cancelled()
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_THEME || secrets.DISCORD_WEBHOOK_URL }}
          state: failed
          label: テーマ動意レポート guard 失敗
          meaning: 実行前チェック（当日重複判定）自体がエラーになり、生成ジョブが起動していません。
          action_required: run ログ確認 → 手動 dispatch で再実行

  generate:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Determine target date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            echo "value=${{ github.event.inputs.target_date }}" >> $GITHUB_OUTPUT
          else
            echo "value=$(TZ=Asia/Tokyo date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          fi

      - name: Checkout report-pipelines
        uses: actions/checkout@v4
        with:
          path: report-pipelines

      - name: Setup SSH for private repo
        env:
          PRIVATE_REPO_DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_REPO_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone private repo (mizuki-fund)
        run: |
          git clone git@github.com:mzinvestment1105/mizuki-fund.git private-repo

      - name: Copy pipelines and static files from Public into private working tree
        run: |
          cp -f report-pipelines/bi/pipelines/*.py private-repo/bi/pipelines/
          cp -f report-pipelines/bi/pipelines/requirements.txt private-repo/bi/pipelines/
          mkdir -p private-repo/bi/pipelines/lib
          cp -rf report-pipelines/bi/pipelines/lib/*.py private-repo/bi/pipelines/lib/ 2>/dev/null || true
          # PDF 配信用の埋め込みフォント（assets/fonts/*.woff2）を Public から overlay
          mkdir -p private-repo/bi/pipelines/assets/fonts
          cp -rf report-pipelines/bi/pipelines/assets/fonts/* private-repo/bi/pipelines/assets/fonts/ 2>/dev/null || true
          mkdir -p private-repo/agents private-repo/playbook
          cp -f report-pipelines/agents/*.md private-repo/agents/ 2>/dev/null || true
          cp -f report-pipelines/playbook/*.md private-repo/playbook/ 2>/dev/null || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: report-pipelines/bi/pipelines/requirements.txt

      - name: Install dependencies
        run: pip install -r report-pipelines/bi/pipelines/requirements.txt

      - name: Install Japanese fonts (Noto Sans CJK JP)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra

      - name: Install Playwright Chromium
        run: |
          playwright install chromium --with-deps

      - name: Generate themes raw (fetch_theme_momentum.py)
        # PM 2026-07-12 改定（絶対配信原則）: exit 3 = 当日の急上昇（rise）欠落の検知シグナル。
        # 旧「exit 3 → ⛔ 生成中止＝未配信」は PM 却下。exit 3 でも step は成功で通し、送信前の
        # 注記挿入 step がレポート冒頭へ品質注記（使用ランキングが当日でない旨）を機械挿入して
        # 必ず配信する。exit 1（3ソース全滅等のインフラ失敗）のみ step 失敗（❌）。
        id: fetch_raw
        working-directory: ./private-repo/bi/pipelines
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set +e
          python fetch_theme_momentum.py
          ec=$?
          echo "exit_code=$ec" >> $GITHUB_OUTPUT
          if [ "$ec" -eq 3 ]; then
            echo "当日 rise 欠落 → 品質注記つき配信で続行（PM 2026-07-12 絶対配信原則）"
            exit 0
          fi
          exit $ec

      - name: 既存テーマレポートファイルを削除（前回不良ファイル読込スキップ防止）
        # PM 2026-05-23 確定: Claude が前回ファイルを読んで「既に完成」と判定する
        # 構造的失敗を防止（mover_weekly run 26325536581 で発生）。
        working-directory: ./private-repo
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: |
          TARGET_FILE="market/daily/theme/${TARGET_DATE}_themes_summary.md"
          if [ -f "$TARGET_FILE" ]; then
            echo "Removing existing $TARGET_FILE before Claude run..."
            rm -f "$TARGET_FILE"
          fi

      - name: Generate themes report via Claude Code (Opus 5 + effort high)
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-5
          prompt_file: report-pipelines/prompts/themes-report.md
          # PM 2026-06-28: WebSearch/WebFetch は GHA で 404（補助モデル解決不可）のため除去。
          # 代表銘柄は fetch_theme_momentum.py がスクレイプ済（top_stocks 列）・動意理由はローカル
          # 一次レポート（マクロ・動意・テーマ TDNet/掲示板 raw）＋構成銘柄の当日値動きから合成する。
          allowed_tools: "Read,Write,Edit,Bash,Grep,Glob"
          timeout_minutes: "45"
          claude_env: |
            CLAUDE_CODE_EFFORT_LEVEL: high
            CLAUDE_CODE_MAX_OUTPUT_TOKENS: 64000
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
          PRIVATE_REPO_ROOT: private-repo

      - name: 対象日整合検査（タイトル日付・不一致でも送信は止めない）
        # PM 2026-07-12 改定（絶対配信原則）: タイトル日付の対象日不一致は検知シグナル（exit_code=3）
        # として次の注記挿入 step へ渡し、送信は止めない（旧「exit 3 → ⛔ 送信中止」は PM 却下）。
        # レポート未生成（ファイル無し）のみインフラ失敗（exit 1・❌）。
        id: title_gate
        working-directory: ./private-repo
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: |
          F="market/daily/theme/${TARGET_DATE}_themes_summary.md"
          if [ ! -f "$F" ]; then
            echo "ERROR: レポート未生成: $F"
            echo "exit_code=1" >> $GITHUB_OUTPUT
            exit 1
          fi
          if ! head -1 "$F" | grep -q "${TARGET_DATE}"; then
            echo "[QUALITY FLAG] タイトル行に対象日 ${TARGET_DATE} が無い → 注記を挿入して配信続行: $(head -1 "$F")"
            echo "exit_code=3" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "[QUALITY FLAG] タイトル日付 OK: $(head -1 "$F")"
          echo "exit_code=0" >> $GITHUB_OUTPUT

      - name: 品質注記の機械挿入（フラグ検知時のみ・タイトル行直後）
        # PM 2026-07-12（絶対配信原則）: rise 欠落・タイトル日付不一致を検知した場合、md の
        # タイトル行直後へ品質注記を機械挿入して必ず配信する（Claude 側注記と重複しても可）。
        id: annotate
        working-directory: ./private-repo
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
          PYTHONIOENCODING: utf-8
        run: |
          NOTE=""
          if [ "${{ steps.fetch_raw.outputs.exit_code }}" = "3" ]; then
            SNAP=$(python -c "import pandas as pd; m=pd.read_parquet('bi/outputs/theme_momentum.parquet'); print(m[m['rank_type']=='rise']['snapshot_date'].max())" 2>/dev/null || echo "不明")
            NOTE="急上昇テーマの当日ランキングが取得できず、掲載は取得済みの最新ランキング（${SNAP} 時点）に基づく"
          fi
          if [ "${{ steps.title_gate.outputs.exit_code }}" = "3" ]; then
            NOTE="${NOTE}${NOTE:+ ／ }タイトル日付が対象日 ${TARGET_DATE} と不一致"
          fi
          if [ -n "$NOTE" ]; then
            F=market/daily/theme/${TARGET_DATE}_themes_summary.md
            awk -v note="> ⚠️ **品質注記**: ${NOTE}" 'NR==1{print; print ""; print note; next} {print}' "$F" > "${F}.tmp" && mv "${F}.tmp" "$F"
            echo "annotated=true" >> $GITHUB_OUTPUT
            echo "note=${NOTE}" >> $GITHUB_OUTPUT
            echo "品質注記を挿入: ${NOTE}"
          else
            echo "annotated=false" >> $GITHUB_OUTPUT
            echo "品質フラグなし・注記挿入なし"
          fi

      - name: Send Discord (PDF)
        id: send
        working-directory: ./private-repo/bi/pipelines
        env:
          DISCORD_WEBHOOK_THEME: ${{ secrets.DISCORD_WEBHOOK_THEME }}
          PYTHONIOENCODING: utf-8
        run: |
          python send_report_pdf_discord.py --kind themes --date ${{ steps.date.outputs.value }}

      - name: Rotate report archives (5 件超過分を archive/ へ退避)
        working-directory: ./private-repo
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # ops/ は Copy pipelines step の対象外のため Public 側から都度 overlay（最新版を保証）
          mkdir -p bi/pipelines/ops
          cp -f ../report-pipelines/bi/pipelines/ops/rotate_report_archives.py bi/pipelines/ops/
          python bi/pipelines/ops/rotate_report_archives.py

      - name: Commit and push to private repo
        # rebase 方式は履歴書き換え・並行 push で index.lock 残留の構造的弱点があるため、
        # fresh-base 方式の共通ヘルパー（Public 側から直接実行・repo 内コピー禁止）へ置換。
        working-directory: ./private-repo
        run: |
          bash ../report-pipelines/bi/pipelines/ops/ci_commit_push.sh \
            -m "data: themes daily ${{ steps.date.outputs.value }}" \
            market/daily bi/outputs/theme_momentum.parquet

      - name: Discord 通知（⚠️ 配信済み・品質注記あり）
        # PM 2026-07-12（絶対配信原則）: 品質問題があってもレポートは配信済み。何が注記されたかを PM へ通知。
        if: steps.annotate.outputs.annotated == 'true' && steps.send.outcome == 'success'
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_THEME }}
          state: partial
          label: テーマ動意レポート 配信済み（品質注記あり）
          date: ${{ steps.date.outputs.value }}
          meaning: レポートは配信済みです。品質注記（${{ steps.annotate.outputs.note }}）を冒頭に付けています。
          action_required: レポート冒頭の品質注記を確認（数値を使う前に注記のデータ日付を参照）

      - name: Discord 通知（❌ raw 取得ブロック）
        # fetch_theme_momentum.py の失敗（exit 1 = 3ソース全滅）= 株探/みんかぶが GHA ランナー IP を
        # 弾いた（405 等・リトライ済み）とみられるため、専用文言でリカバリ手段を明示する。
        # exit 3（rise 欠落）は step 成功で通し注記配信するため、ここには来ない。
        if: (failure() || cancelled()) && steps.fetch_raw.outcome == 'failure'
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_THEME }}
          state: failed
          label: テーマ動意レポート 失敗（raw 取得ブロック）
          date: ${{ steps.date.outputs.value }}
          meaning: テーマランキングの取得元（株探/みんかぶ）が GHA の接続を拒否し（IP ブロック起因・リトライ済み）、本日未配信です。
          action_required: ローカルで /themes-report を実行してリカバリ（GHA の再実行は同じ IP 帯で失敗しやすい）

      - name: Discord 通知（⚠️ 配信済み・後処理のみ失敗）
        if: (failure() || cancelled()) && steps.send.outcome == 'success'
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_THEME }}
          state: partial
          label: テーマ動意レポート 後処理のみ失敗
          date: ${{ steps.date.outputs.value }}
          meaning: レポート本体は配信済みです。配信後のアーカイブ整理または commit だけが失敗しました。
          action_required: 不要（差分は次回 run が回収）

      - name: Discord 通知（❌ 失敗）
        # 品質フラグ（exit_code=3）は step 成功で通し注記配信するため、ここに来るのはインフラ失敗のみ。
        if: (failure() || cancelled()) && steps.fetch_raw.outcome != 'failure' && steps.send.outcome != 'success'
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_THEME }}
          state: failed
          label: テーマ動意レポート 失敗
          date: ${{ steps.date.outputs.value }}
          meaning: 生成または送信が完了せず、本日未配信です。
          action_required: run ログ確認 → 手動 dispatch で再実行。ログに「Spending cap reached」がある場合は Claude 利用枠切れ＝リセット時刻以降に再実行
