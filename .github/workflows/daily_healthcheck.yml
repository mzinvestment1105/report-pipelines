name: Daily Healthcheck (dead-man switch)

"on":
  # PM 2026-06-06 新設: Worker と GHA cron が両方落ちて完全無音失敗する事故を検知。
  # 役割分担（2026-07-07 明文化）: 各 workflow の通知＝「既知の失敗を push」/
  # healthcheck＝「無音（未起動・未復旧）を検知」。二重発報を減らすためメッセージを
  # 「未起動（run ゼロ）」と「失敗のまま未復旧（failure run あり・❌通知済みのはず）」に2値化。
  # 朝刊チェック: 09:00 JST = UTC 00:00（マクロ朝刊 06:23 の 2.5h 後・cron 07:30 の 1.5h 後）
  #   + 前日夕方 ETL 3 本（financial_history 17:00 / screening_master 17:15 / price_history 16:00 JST）
  #     を前日日付で判定（price_history は 2026-07-07 退役 → 2026-07-12 復活: 日次 cron +
  #     push-back 再開・週次リターン計算の入力源のため監視対象に再追加）
  # 夕方チェック: 19:00 JST = UTC 10:00（夕方レポート想定完了の 15-30 分後）
  # 金曜夜チェック: 23:30 JST 金曜 = UTC 14:30 金曜（週次 3 本の 21:00 JST 発火から 2.5h 後・同日判定）
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * 1-5'
    - cron: '0 10 * * 1-5'
    - cron: '30 14 * * 5'

# PM 2026-06-06: 同時起動排除（cron 2 つが同時に走ることはないが念のため）
concurrency:
  group: daily_healthcheck-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 通知 composite action（.github/actions/notify-discord）を使うため checkout が必要
      - name: Checkout report-pipelines (通知 action 用)
        uses: actions/checkout@v4

      - name: Determine check scope (morning / evening / friday-weekly)
        id: scope
        run: |
          # workflows 出力は「<workflow ファイル名>=<判定基準時刻>=<配信ジョブ名>」のカンマ区切り。
          # 基準時刻は日付（YYYY-MM-DD → その日 00:00 JST）または日時（…T12:00:00+09:00）。
          # 基準時刻以降に「配信ジョブが success」または「実行中」の run があるかを check step が見る。
          # 2026-08-05 修正: 以前は run 単位の conclusion==success を見ていたため、guard が本体を
          # skip して終わった run（run 自体は success）を「発行済み」と誤判定し、夜間PTS が 3 週間
          # 未配信でも無警報だった。配信ジョブの結果だけを見るよう変更。
          HOUR_JST=$(TZ=Asia/Tokyo date +%H)
          DOW_JST=$(TZ=Asia/Tokyo date +%u)   # 1=月 ... 7=日
          TODAY_JST=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          YESTERDAY_JST=$(TZ=Asia/Tokyo date -d 'yesterday' +%Y-%m-%d)
          echo "today_jst=${TODAY_JST}" >> $GITHUB_OUTPUT
          echo "hour_jst=${HOUR_JST}" >> $GITHUB_OUTPUT

          # 2026-09-23 追加: 日本市場レーン（screening / 動意日次 / PTS / テーマ）は、判定対象日が
          # 非営業日（土日・祝日・東証年末年始＝jp_holidays.txt）なら点検対象から外す（誤 🚨 防止）。
          # マクロ朝刊・夕刊は祝日も発行するため従来どおり点検する。判定スクリプトが異常終了した
          # 場合（rc=2）は営業日扱い＝従来どおり点検する（見張りを緩めない側に倒す）。
          jp_open() { bash .github/scripts/is_tradingday.sh "$1" >/dev/null; [ $? -ne 1 ]; }

          # 2026-09-23 追加: 朝の点検は 07:00 JST 以降のみ。夕方 cron が深夜まで遅延着火した場合や
          # 深夜の手動実行が「朝スコープ」に入り、06:23 発行前のマクロ朝刊を未発行と誤検知するのを防ぐ。
          if [ $((10#$HOUR_JST)) -lt 7 ]; then
            echo "scope=none" >> $GITHUB_OUTPUT
            echo "workflows=" >> $GITHUB_OUTPUT
            echo "label=点検なし（07:00 JST 前）" >> $GITHUB_OUTPUT
            echo "::notice title=daily_healthcheck skipped::${HOUR_JST}h JST is before 07:00 - morning check not run"
            exit 0
          fi
          if [ "$HOUR_JST" -lt 12 ]; then
            # 朝スコープ: 当日朝刊 + 前日夕方 ETL 2 本（前日日付で判定）
            # position_check は PM 2026-07-09 でレーン抹消のため監視対象外
            # screening_master は平日のみ実行のため月曜朝は前週金曜分を判定
            if [ "$DOW_JST" -eq 1 ]; then
              SM_DATE=$(TZ=Asia/Tokyo date -d '3 days ago' +%Y-%m-%d)
            else
              SM_DATE="$YESTERDAY_JST"
            fi
            echo "scope=morning" >> $GITHUB_OUTPUT
            # pts_mover_report は平日 21:00 JST 発火のため前日日付で判定（月曜朝は前週金曜分＝SM_DATE と同ロジック）
            WFS="macro_report_daily.yml=${TODAY_JST}=generate,financial_history.yml=${YESTERDAY_JST}=update,price_history.yml=${YESTERDAY_JST}=update"
            if jp_open "$SM_DATE"; then
              WFS="${WFS},screening_master.yml=${SM_DATE}=update,pts_mover_report.yml=${SM_DATE}=build-and-send"
              echo "label=朝刊 + 前日 ETL 3 本 + 前夜PTS" >> $GITHUB_OUTPUT
            else
              echo "::notice title=daily_healthcheck::${SM_DATE} is a market holiday - screening_master / pts_mover_report not checked"
              echo "label=朝刊 + 前日 ETL 2 本（${SM_DATE} は休場のため screening/PTS は点検対象外）" >> $GITHUB_OUTPUT
            fi
            echo "workflows=${WFS}" >> $GITHUB_OUTPUT
          elif [ "$DOW_JST" -eq 5 ] && [ "$HOUR_JST" -ge 22 ]; then
            # 金曜夜スコープ: 金曜 21:00 JST 発火の週次 3 本を同日（金曜）日付で判定
            echo "scope=friday_weekly" >> $GITHUB_OUTPUT
            echo "workflows=largecap_weekly.yml=${TODAY_JST}=generate,mover_weekly.yml=${TODAY_JST}=merge-and-send,sector_report_weekly_full.yml=${TODAY_JST}=generate" >> $GITHUB_OUTPUT
            echo "label=金曜週次 3 本" >> $GITHUB_OUTPUT
          else
            # 夕方スコープ: 夕方 3 レポート（当日 12:00 JST 以降で判定）
            # sector_report_daily（PM 2026-07-08）・position_check（PM 2026-07-09）はレーン抹消のため監視対象外
            echo "scope=evening" >> $GITHUB_OUTPUT
            if jp_open "$TODAY_JST"; then
              echo "workflows=mover_report_daily.yml=${TODAY_JST}=merge-and-send,macro_report_evening.yml=${TODAY_JST}=generate,theme_report_daily.yml=${TODAY_JST}=generate" >> $GITHUB_OUTPUT
              echo "label=夕方 3 本" >> $GITHUB_OUTPUT
            else
              echo "::notice title=daily_healthcheck::${TODAY_JST} is a market holiday - mover_report_daily / theme_report_daily not checked"
              echo "workflows=macro_report_evening.yml=${TODAY_JST}=generate" >> $GITHUB_OUTPUT
              echo "label=夕刊のみ（${TODAY_JST} は休場のため動意・テーマは点検対象外）" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Check today's report success
        id: check
        # 2026-09-23: 07:00 JST 前（scope=none）は点検しない（🚨 も heartbeat も出さない）。
        if: steps.scope.outputs.scope != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NORUN=""
          FAILED=""
          IFS=',' read -ra ENTRIES <<< "${{ steps.scope.outputs.workflows }}"
          for entry in "${ENTRIES[@]}"; do
            entry=$(echo "$entry" | tr -d ' ')
            wf="${entry%%=*}"
            rest="${entry#*=}"
            since="${rest%%=*}"
            send_job="${rest#*=}"
            case "$since" in
              *T*) SINCE_START="$since" ;;
              *)   SINCE_START="${since}T00:00:00+09:00" ;;
            esac
            STATS=$(bash .github/scripts/check_delivery.sh "$wf" "$send_job" 0 "$SINCE_START")
            TOTAL=$(echo "$STATS" | jq -r '.total')
            SUCCESS=$(echo "$STATS" | jq -r '.delivered')
            ACTIVE=$(( $(echo "$STATS" | jq -r '.sending') + $(echo "$STATS" | jq -r '.dispatch_pending') + $(echo "$STATS" | jq -r '.schedule_pending') ))
            echo "${wf} (since ${SINCE_START} / send_job=${send_job}): total=${TOTAL} delivered=${SUCCESS} active=${ACTIVE}"
            if [ "$SUCCESS" -gt 0 ] || [ "$ACTIVE" -gt 0 ]; then
              continue
            fi
            # 2値化: run ゼロ＝未起動（Worker + cron 両方不発）/ run あり全滅＝失敗のまま未復旧
            if [ "$TOTAL" -eq 0 ]; then
              NORUN="${NORUN} ${wf}"
            else
              FAILED="${FAILED} ${wf}"
            fi
          done
          NORUN=$(echo "$NORUN" | xargs)
          FAILED=$(echo "$FAILED" | xargs)
          if [ -n "$NORUN" ] || [ -n "$FAILED" ]; then
            echo "alert=true" >> $GITHUB_OUTPUT
          else
            echo "alert=false" >> $GITHUB_OUTPUT
          fi
          # 内部向けの内訳（未起動／失敗のまま未復旧の 2 値）はログ用 detail にだけ残す。
          DETAIL=""
          if [ -n "$NORUN" ]; then
            DETAIL="未起動（run ゼロ＝Worker と GHA cron の両方が不発）: ${NORUN}。"
          fi
          if [ -n "$FAILED" ]; then
            DETAIL="${DETAIL}未配信（run はあるが配信ジョブが成功していない＝失敗または skip のまま）: ${FAILED}。"
          fi
          echo "detail=${DETAIL}" >> $GITHUB_OUTPUT
          # 2026-09-23（PM 判断・運用通知の平易化）: PM 向けの本文は和名のレポート名だけで書く。
          # 当日以外の日付で判定した項目（前日の更新・前夜の PTS 等）は「（M/D分）」を添える。
          TODAY_JST="${{ steps.scope.outputs.today_jst }}"
          NAMES=""
          NAMES_PLAIN=""
          for entry in "${ENTRIES[@]}"; do
            entry=$(echo "$entry" | tr -d ' ')
            wf="${entry%%=*}"
            rest="${entry#*=}"
            since="${rest%%=*}"
            case " ${NORUN} ${FAILED} " in
              *" ${wf} "*) ;;
              *) continue ;;
            esac
            case "$wf" in
              macro_report_daily.yml)        JP="マクロ朝刊" ;;
              macro_report_evening.yml)      JP="マクロ夕刊" ;;
              mover_report_daily.yml)        JP="動意レポート" ;;
              mover_weekly.yml)              JP="動意レポート週次" ;;
              pts_mover_report.yml)          JP="夜間PTS動意レポート" ;;
              theme_report_daily.yml)        JP="テーマ動意" ;;
              sector_report_weekly_full.yml) JP="セクター週次" ;;
              largecap_weekly.yml)           JP="大型株週次" ;;
              screening_master.yml)          JP="スクリーニング更新" ;;
              price_history.yml)             JP="株価データ更新" ;;
              financial_history.yml)         JP="財務データ更新" ;;
              *)                             JP="${wf%.yml}" ;;
            esac
            SD="${since:0:10}"
            if [ "$SD" != "$TODAY_JST" ]; then
              LABEL_ONE="${JP}（$((10#${SD:5:2}))/$((10#${SD:8:2}))分）"
            else
              LABEL_ONE="${JP}"
            fi
            NAMES="${NAMES}${NAMES:+・}${LABEL_ONE}"
            NAMES_PLAIN="${NAMES_PLAIN}${NAMES_PLAIN:+・}${JP}"
          done
          echo "meaning=${NAMES}が予定の時刻を過ぎても届いていません。" >> $GITHUB_OUTPUT
          echo "names=${NAMES_PLAIN}" >> $GITHUB_OUTPUT

      - name: Discord 通知（🚨 未発行検知）
        if: steps.check.outputs.alert == 'true'
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          state: alert
          label: '健全性チェック'
          date: ${{ steps.scope.outputs.today_jst }}
          meaning: '${{ steps.check.outputs.meaning }}'
          action_required: '次回 Claude Code で「${{ steps.check.outputs.names }}を復旧して」とお伝えください'
          detail: '${{ steps.scope.outputs.label }}｜${{ steps.check.outputs.detail }}'

      - name: Healthy heartbeat (when all OK)
        if: steps.check.outputs.alert == 'false'
        run: |
          echo "✅ ${{ steps.scope.outputs.label }}レポートすべて発行済（${{ steps.scope.outputs.today_jst }}）"

      - name: Discord 通知（❌ healthcheck 自身の失敗）
        # 見張り役の無音死を塞ぐ: healthcheck 自体が落ちたら通知する（2026-07-07）。
        if: failure() || cancelled()
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          state: failed
          label: '健全性チェック'
          meaning: '内部エラーで点検ができませんでした。未配信があっても気づけない状態です。'
          action_required: '次回 Claude Code で「健全性チェックを復旧して」とお伝えください'
          detail: 'Healthcheck 自体が失敗｜無音検知の見張り役（healthcheck）自体がエラーになりました。このままだと各レーンの未発行を検知できません。'
