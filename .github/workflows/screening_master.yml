name: スクリーニングマスター更新

"on":
  # PM 2026-05-27 確定: Cloudflare Worker (mizuki-fund-scheduler-1) からの workflow_dispatch がメイン経路。
  # PM 2026-06-30: Worker 単一経路の SPOF（実測で金曜の Worker 発火が毎週欠落）回避のため、
  # 他レポート（mover/macro/theme）と同様に GHA cron をフェイルセーフとして併用。
  # 平日のみ（UTC 月-金 = 08:15 = JST 17:15・Worker 16:13 の約 1 時間後）。
  # guard ジョブが当日の既存 run（成功・実行中）を検知し重複発火・二重 ETL を防ぐ。
  workflow_dispatch:
  schedule:
    - cron: '15 8 * * 1-5'

concurrency:
  group: screening_master-daily
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      # 通知 composite action（.github/actions/notify-discord）を使うため checkout が必要
      - name: Checkout report-pipelines (通知 action 用)
        uses: actions/checkout@v4

      - name: Check today's runs
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY_JST=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          MY_RUN_ID=${{ github.run_id }}
          EVENT="${{ github.event_name }}"

          # 2026-08-05 修正: run 単位の conclusion は「guard が本体ジョブを skip した run」まで
          # success と数えてしまい、本命の発火を「本日配信済み」と誤認して無言 skip させる。
          # 実際に配信/更新を行うジョブ（update）の結果だけで判定する。
          STATS=$(bash .github/scripts/check_delivery.sh screening_master.yml update "${MY_RUN_ID}")
          DONE_OK=$(echo "$STATS" | jq -r '.delivered')
          DONE_FAIL=$(echo "$STATS" | jq -r '.failed')
          ACTIVE=$(( $(echo "$STATS" | jq -r '.sending') + $(echo "$STATS" | jq -r '.dispatch_pending') + $(echo "$STATS" | jq -r '.schedule_pending') ))

          echo "Today (${TODAY_JST}): active=${ACTIVE} done_ok=${DONE_OK} done_fail=${DONE_FAIL} event=${EVENT}"

          if [ "$DONE_OK" -gt 0 ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=skip (already succeeded today: done_ok=${DONE_OK})" >> $GITHUB_OUTPUT
          elif [ "$ACTIVE" -gt 0 ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=skip (active run exists: active=${ACTIVE})" >> $GITHUB_OUTPUT
          elif [ "$EVENT" = "schedule" ] && [ "$DONE_FAIL" -ge 2 ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=retry_cap (cron stopped: done_fail=${DONE_FAIL} >= 2)" >> $GITHUB_OUTPUT
          else
            echo "proceed=true" >> $GITHUB_OUTPUT
            echo "reason=initial" >> $GITHUB_OUTPUT
          fi

      - name: Discord 通知（🚨 自動リトライ停止）
        if: contains(steps.check.outputs.reason, 'retry_cap')
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          state: alert
          label: スクリーニングETL 自動リトライ停止
          meaning: 当日 2 回以上失敗したため cron の自動再実行を停止しました。screening_master は前回値のまま更新されていません。
          action_required: run ログ確認 → 原因解消後に手動 dispatch で再実行

      - name: Discord 通知（guard 失敗）
        if: failure() || cancelled()
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          state: failed
          label: スクリーニングETL guard 失敗
          meaning: 実行前チェック（当日重複判定）自体がエラーになり、更新ジョブが起動していません。
          action_required: run ログ確認 → 手動 dispatch で再実行

  update:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout report-pipelines
        uses: actions/checkout@v4
        with:
          path: report-pipelines

      - name: Setup SSH for private repo
        env:
          PRIVATE_REPO_DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_REPO_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone private repo (mizuki-fund)
        run: |
          git clone git@github.com:mzinvestment1105/mizuki-fund.git private-repo

      - name: Copy pipelines into private working tree
        run: |
          cp -f report-pipelines/bi/pipelines/*.py private-repo/bi/pipelines/
          cp -f report-pipelines/bi/pipelines/requirements.txt private-repo/bi/pipelines/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: report-pipelines/bi/pipelines/requirements.txt

      - name: Install dependencies
        run: pip install -r report-pipelines/bi/pipelines/requirements.txt

      - name: Run ETL
        id: etl
        working-directory: ./private-repo/bi/pipelines
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          PYTHONIOENCODING: utf-8
          YFINANCE_STATEMENT_FALLBACK: "1"
          MARGIN_INTEREST_LOOKBACK_WEEKS: "8"
          MARGIN_INTEREST_DAY_FALLBACK: "2"
          SHORT_SALE_LOOKBACK_WEEKS: "8"
          VOLUME_BLOCK_WEEKS: "8"
          NX_FORECAST_RELAXED_REVISION: "1"
          TDNET_FORECAST_FALLBACK: "1"
        run: |
          set -o pipefail
          python make_screening_master_v2.py --check-splits-conditional 2>&1 | tee /tmp/etl.log
          ROWS=$(grep -oP 'rows=\K[0-9]+' /tmp/etl.log | tail -1 || echo "?")
          YF=$(grep -oP 'yf_used=\K[0-9]+' /tmp/etl.log | tail -1 || echo "?")
          echo "rows=$ROWS"   >> $GITHUB_OUTPUT
          echo "yf_used=$YF" >> $GITHUB_OUTPUT

      - name: Excel 変換
        working-directory: ./private-repo/bi/pipelines
        env:
          PYTHONIOENCODING: utf-8
        run: python convert_to_excel.py

      # テーマ初動レーダー用のみんかぶテーマタグ表を月次更新する。
      # 毎月第1営業日（=当月で最初に本 workflow が走った日）だけ実行。約15分（sleep 実装済み）。
      # 失敗しても既存 parquet を残したまま後続を続行する（動意・PTS は古い表でも動く）。
      - name: テーマタグ表 月次更新（毎月第1営業日のみ）
        working-directory: ./private-repo/bi/pipelines
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          OUT=../outputs/theme_master_minkabu.parquet
          THIS_MONTH=$(TZ=Asia/Tokyo date +'%Y-%m')
          # parquet の fetched_at が当月なら今月分は取得済み → スキップ
          FETCHED_MONTH=$(python -c "
          import pandas as pd, pathlib
          p = pathlib.Path('$OUT')
          if not p.exists():
              print('none')
          else:
              try:
                  s = pd.read_parquet(p, columns=['fetched_at'])['fetched_at']
                  print(str(pd.to_datetime(s, utc=True).max().tz_convert('Asia/Tokyo'))[:7])
              except Exception:
                  print('none')
          " 2>/dev/null || echo none)
          echo "theme_master fetched_month=$FETCHED_MONTH / this_month=$THIS_MONTH"
          if [ "$FETCHED_MONTH" = "$THIS_MONTH" ]; then
            echo "当月分は取得済みのためスキップ"
          else
            echo "当月初回のためテーマタグ表を更新します（約15分）"
            python fetch_minkabu_themes.py 2>&1 | tail -20
          fi

      - name: Commit and push to private repo
        # rebase 方式は履歴書き換え・並行 push で index.lock 残留の構造的弱点があるため、
        # fresh-base 方式の共通ヘルパー（Public 側から直接実行・repo 内コピー禁止）へ置換。
        working-directory: ./private-repo
        run: |
          bash ../report-pipelines/bi/pipelines/ops/ci_commit_push.sh \
            -m "data: screening master $(TZ=Asia/Tokyo date +'%Y-%m-%d')" bi/outputs

      - name: Discord 通知（✅ 完了）
        if: success()
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          state: done
          label: スクリーニングETL 完了
          meaning: screening_master を更新しました（銘柄数 ${{ steps.etl.outputs.rows }}・YF補完 ${{ steps.etl.outputs.yf_used }}銘柄）。
          action_required: 不要

      - name: Discord 通知（❌ 失敗）
        # cancelled() を含める: job timeout 超過は conclusion=cancelled になり
        # failure() だけでは発火しない穴を塞ぐ（2026-07-07）。
        if: failure() || cancelled()
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          state: failed
          label: スクリーニングETL 失敗
          meaning: 日次更新が完了せず（エラーまたは制限時間超過）、screening_master は前回値のまま更新されていません。
          action_required: run ログ確認 → 手動 dispatch で再実行
