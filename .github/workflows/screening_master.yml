name: スクリーニングマスター更新

"on":
  # PM 2026-05-27 確定: Cloudflare Worker (mizuki-fund-scheduler-1) からの workflow_dispatch がメイン経路。
  # PM 2026-06-30: Worker 単一経路の SPOF（実測で金曜の Worker 発火が毎週欠落）回避のため、
  # 他レポート（mover/macro/theme）と同様に GHA cron をフェイルセーフとして併用。
  # 平日のみ（UTC 月-金 = 08:15 = JST 17:15・Worker 16:13 の約 1 時間後）。
  # guard ジョブが当日の既存 run（成功・実行中）を検知し重複発火・二重 ETL を防ぐ。
  workflow_dispatch:
  schedule:
    - cron: '15 8 * * 1-5'

concurrency:
  group: screening_master-daily
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Check today's runs
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY_JST=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          TODAY_START="${TODAY_JST}T00:00:00+09:00"
          MY_RUN_ID=${{ github.run_id }}

          RUNS=$(gh api -X GET \
            "repos/${{ github.repository }}/actions/workflows/screening_master.yml/runs" \
            -f "created=>=${TODAY_START}" \
            --jq "[.workflow_runs[] | select(.id != ${MY_RUN_ID})]")

          ACTIVE=$(echo "$RUNS" | jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting" or .status=="action_required" or .status=="pending")] | length')
          DONE_OK=$(echo "$RUNS" | jq '[.[] | select(.conclusion=="success" or .conclusion=="neutral")] | length')

          echo "Today (${TODAY_JST}): active=${ACTIVE} done_ok=${DONE_OK}"

          if [ "$DONE_OK" -gt 0 ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=skip (already succeeded today: done_ok=${DONE_OK})" >> $GITHUB_OUTPUT
          elif [ "$ACTIVE" -gt 0 ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=skip (active run exists: active=${ACTIVE})" >> $GITHUB_OUTPUT
          else
            echo "proceed=true" >> $GITHUB_OUTPUT
            echo "reason=initial" >> $GITHUB_OUTPUT
          fi

  update:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout report-pipelines
        uses: actions/checkout@v4
        with:
          path: report-pipelines

      - name: Setup SSH for private repo
        env:
          PRIVATE_REPO_DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_REPO_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone private repo (mizuki-fund)
        run: |
          git clone git@github.com:mzinvestment1105/mizuki-fund.git private-repo

      - name: Copy pipelines into private working tree
        run: |
          cp -f report-pipelines/bi/pipelines/*.py private-repo/bi/pipelines/
          cp -f report-pipelines/bi/pipelines/requirements.txt private-repo/bi/pipelines/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: report-pipelines/bi/pipelines/requirements.txt

      - name: Install dependencies
        run: pip install -r report-pipelines/bi/pipelines/requirements.txt

      - name: Run ETL
        id: etl
        working-directory: ./private-repo/bi/pipelines
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          PYTHONIOENCODING: utf-8
          YFINANCE_STATEMENT_FALLBACK: "1"
          MARGIN_INTEREST_LOOKBACK_WEEKS: "8"
          MARGIN_INTEREST_DAY_FALLBACK: "2"
          SHORT_SALE_LOOKBACK_WEEKS: "8"
          VOLUME_BLOCK_WEEKS: "8"
          NX_FORECAST_RELAXED_REVISION: "1"
          TDNET_FORECAST_FALLBACK: "1"
        run: |
          set -o pipefail
          python make_screening_master_v2.py --check-splits-conditional 2>&1 | tee /tmp/etl.log
          ROWS=$(grep -oP 'rows=\K[0-9]+' /tmp/etl.log | tail -1 || echo "?")
          YF=$(grep -oP 'yf_used=\K[0-9]+' /tmp/etl.log | tail -1 || echo "?")
          echo "rows=$ROWS"   >> $GITHUB_OUTPUT
          echo "yf_used=$YF" >> $GITHUB_OUTPUT

      - name: Excel 変換
        working-directory: ./private-repo/bi/pipelines
        env:
          PYTHONIOENCODING: utf-8
        run: python convert_to_excel.py

      - name: Commit and push to private repo
        working-directory: ./private-repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 一時コピーしたスクリプトは戻す（Private 側の履歴を汚さない）
          git checkout -- bi/pipelines/ 2>/dev/null || true
          git add bi/outputs/
          if ! git diff --staged --quiet; then
            git commit -m "data: screening master $(date +'%Y-%m-%d')"
            git fetch origin master
            if ! git rebase origin/master; then
              git diff --name-only --diff-filter=U | xargs -I{} git checkout --theirs {}
              git diff --name-only --diff-filter=U | xargs git add
              git -c core.editor=true rebase --continue
            fi
            git push origin master
          fi

      - name: Discord 通知（成功）
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"✅ スクリーニング完了\n$(date +'%Y-%m-%d %H:%M') JST\n銘柄数: ${{ steps.etl.outputs.rows }}\nYF補完: ${{ steps.etl.outputs.yf_used }}銘柄\"}"

      - name: Discord 通知（失敗）
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"❌ スクリーニング失敗\n$(date +'%Y-%m-%d %H:%M') JST\nログ確認: https://github.com/${{ github.repository }}/actions\"}"
