name: スクリーニングマスター更新

"on":
  # PM 2026-05-27 確定: Cloudflare Worker (mizuki-fund-scheduler-1) からの workflow_dispatch に一本化。
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout report-pipelines
        uses: actions/checkout@v4
        with:
          path: report-pipelines

      - name: Setup SSH for private repo
        env:
          PRIVATE_REPO_DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_REPO_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone private repo (mizuki-fund)
        run: |
          git clone git@github.com:mzinvestment1105/mizuki-fund.git private-repo

      - name: Copy pipelines into private working tree
        run: |
          cp -f report-pipelines/bi/pipelines/*.py private-repo/bi/pipelines/
          cp -f report-pipelines/bi/pipelines/requirements.txt private-repo/bi/pipelines/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: report-pipelines/bi/pipelines/requirements.txt

      - name: Install dependencies
        run: pip install -r report-pipelines/bi/pipelines/requirements.txt

      - name: Run ETL
        id: etl
        working-directory: ./private-repo/bi/pipelines
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          PYTHONIOENCODING: utf-8
          YFINANCE_STATEMENT_FALLBACK: "1"
          MARGIN_INTEREST_LOOKBACK_WEEKS: "8"
          MARGIN_INTEREST_DAY_FALLBACK: "2"
          SHORT_SALE_LOOKBACK_WEEKS: "8"
          VOLUME_BLOCK_WEEKS: "8"
          NX_FORECAST_RELAXED_REVISION: "1"
          TDNET_FORECAST_FALLBACK: "1"
        run: |
          set -o pipefail
          python make_screening_master_v2.py --check-splits-conditional 2>&1 | tee /tmp/etl.log
          ROWS=$(grep -oP 'rows=\K[0-9]+' /tmp/etl.log | tail -1 || echo "?")
          YF=$(grep -oP 'yf_used=\K[0-9]+' /tmp/etl.log | tail -1 || echo "?")
          echo "rows=$ROWS"   >> $GITHUB_OUTPUT
          echo "yf_used=$YF" >> $GITHUB_OUTPUT

      - name: Excel 変換
        working-directory: ./private-repo/bi/pipelines
        env:
          PYTHONIOENCODING: utf-8
        run: python convert_to_excel.py

      - name: Commit and push to private repo
        working-directory: ./private-repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 一時コピーしたスクリプトは戻す（Private 側の履歴を汚さない）
          git checkout -- bi/pipelines/ 2>/dev/null || true
          git add bi/outputs/
          if ! git diff --staged --quiet; then
            git commit -m "data: screening master $(date +'%Y-%m-%d')"
            git fetch origin master
            if ! git rebase origin/master; then
              git diff --name-only --diff-filter=U | xargs -I{} git checkout --theirs {}
              git diff --name-only --diff-filter=U | xargs git add
              git -c core.editor=true rebase --continue
            fi
            git push origin master
          fi

      - name: Discord 通知（成功）
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"✅ スクリーニング完了\n$(date +'%Y-%m-%d %H:%M') JST\n銘柄数: ${{ steps.etl.outputs.rows }}\nYF補完: ${{ steps.etl.outputs.yf_used }}銘柄\"}"

      - name: Discord 通知（失敗）
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"❌ スクリーニング失敗\n$(date +'%Y-%m-%d %H:%M') JST\nログ確認: https://github.com/${{ github.repository }}/actions\"}"
