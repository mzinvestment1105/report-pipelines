name: マクロ市況ツイート日次

"on":
  # PM 2026-09-02 承認: マクロ市況ツイート案の生成を夕刊マクロ（macro_report_evening.yml）から分離した。
  #
  # PM 2026-09-03 修正（設計上の誤りの解消）:
  #   旧設計は workflow_run で「Price History Daily Update」の完走を待っていたが、これは誤りだった。
  #   実測（2026-09-02 / 09-03）: 9/2 は price_history の着地が JST 19:12 で夕刊 17:45 に間に合わず、
  #   9/3 は price_history 日次 ETL 自体が未実行だったため、2 日連続でツイートが未発行になった。
  #   一方で動意レポートは同じセクター騰落率を JQuants からライブ取得しており、両日とも正常に
  #   発行されていた。つまり price_history の着地を待つ必然性は元々なかった。
  #   これを受けて make_sector_daily.py に JQuants ライブ取得のフォールバックを追加し
  #   （parquet が第一優先、対象日が無い場合のみライブ取得。算出ロジック・出力スキーマは同一で、
  #   2026-09-02 の全 4,167 銘柄で parquet 経路と完全一致することを実測確認済み）、
  #   本 workflow の待ち対象を本来の依存先である夕刊マクロへ戻す。
  #   （ツイートの第一ソースは夕刊本文であり、price_history はセクター欄の補助入力にすぎない。）
  #
  # PM 2026-09-04 修正（「トークンを無駄にしない」と「失敗しない」の両立）:
  #   2026-09-03 の実測 2 件から、未発行の原因は 2 つとも「生成品質」ではなく運用設計だった。
  #     Run1 (workflow_run / 22:46 JST): Claude が 2 回とも API Error: 529 overloaded_error。
  #       529 はリクエスト自体が拒否されるため実測 input_tokens=0 / output_tokens=0 /
  #       total_cost_usd=0（run ログの result JSON で確認済み）。つまり一時障害であり、
  #       粘って再試行するのが正しい。当時は待機 60 秒・計 2 回で力尽きていた。
  #     Run2 (schedule / cron 0 12): GitHub cron の遅延で 15:15Z = 翌 9/4 00:15 JST に着火。
  #       時間帯ゲート（JST 17 時未満は skip）に弾かれ、かつ TODAY_JST が 9/4 になるため
  #       対象日もズレていた。救援枠が救援にならない状態だった。
  #
  # トリガー設計:
  #   (1) workflow_run（主経路）= 夕刊マクロの完走を受けて起動する。夕刊本文がツイートの
  #       素材なので、夕刊が出た直後が最短・最確実な発行タイミング。success の時のみ先へ進む。
  #   (2) workflow_dispatch = 手動リカバリ用。
  #   (3) schedule（フェイルセーフ）= 2 枠に増設。GitHub cron の実測遅延は +1h45m〜+3h15m。
  #         30 10 * * 1-5 = JST 19:30 起票（最悪 +3h15m でも 22:45 JST＝当日中に着地）
  #         0  12 * * 1-5 = JST 21:00 起票（従来枠。19:30 枠も落ちた日の最後の砦）
  #
  #   ★枠を 2 つにしてもトークンは増えない★
  #     guard は Claude を一切呼ばない（GitHub API を読むだけ）。主経路が成功した日は
  #     delivered>0 となり両枠とも guard だけで skip して終わる ＝ 追加トークン消費ゼロ。
  #     生成が走るのは「当日まだ成功していない日」に限られる。
  workflow_run:
    workflows: ["マクロレポート夕刊"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      target_date:
        description: '対象日付 (YYYY-MM-DD・空欄で当日)'
        required: false
        default: ''
      force_rerun:
        description: 'true で当日重複ガードを無視して強制実行（修正後の再テスト用）'
        required: false
        default: 'false'
  schedule:
    - cron: '30 10 * * 1-5'
    - cron: '0 12 * * 1-5'

# 二重発火を GHA 内部ロックで防ぐ（macro_report_evening.yml と同じ固定 group 方式）。
concurrency:
  group: macro_tweet_daily
  cancel-in-progress: false

jobs:
  guard:
    # 判定順:
    #   (0) 対象日 TARGET_DATE を決める。schedule 起動が JST 00:00〜04:59 の場合は
    #       「前日分の遅延着火」とみなして前日へ補正する（従来はここで無条件 skip し、
    #        救援枠を自ら捨てていた）。05:00〜16:59 の schedule は従来どおり skip。
    #   (1) workflow_run 起点で夕刊マクロが success でない → skip
    #   (2) DONE_OK >= 1 → skip（対象日すでに生成済み＝ここで Claude を呼ばずに終わる）
    #   (3) ACTIVE >= 1 → skip（走行中の run あり）
    #   (4) DONE_FAIL >= 3 → skip（暴走防止の上限。529 が長時間続く日の打ち切り）
    #   (5) それ以外 → proceed（DONE_FAIL>=1 かつ DONE_OK==0 なら recovery）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      reason: ${{ steps.check.outputs.reason }}
      target_date: ${{ steps.check.outputs.target_date }}
    steps:
      # 通知 composite action（.github/actions/notify-discord）を使うため checkout が必要
      - name: Checkout report-pipelines (通知 action 用)
        uses: actions/checkout@v4

      - name: Check today's runs
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MY_RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          FORCE_RERUN: ${{ github.event.inputs.force_rerun }}
          INPUT_DATE: ${{ github.event.inputs.target_date }}
        run: |
          # 判定ロジック本体は .github/scripts/macro_tweet_guard.sh に切り出してある
          # （ローカルで NOW_OVERRIDE を注入して単体検証できるようにするため）。
          bash .github/scripts/macro_tweet_guard.sh
        # 上記スクリプトが参照する入力は下の env で全て渡す（yml 内に判定式を書かない）。

      - name: Discord 通知（⏱ 予備タイマー起動）
        if: github.event_name == 'schedule' && steps.check.outputs.proceed == 'true'
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_SNS || secrets.DISCORD_WEBHOOK_URL }}
          state: timer
          label: マクロ市況ツイート 予備タイマー起動
          meaning: '本日のツイート案がまだ生成できていないため、GHA 側の予備タイマーが救援起動しました（本日: 成功 ${{ steps.check.outputs.done_ok }} 件・失敗 ${{ steps.check.outputs.done_fail }} 件・実行中 ${{ steps.check.outputs.active }} 件）。'
          action_required: 不要（このあとツイート案が届けば復旧完了。届かない場合のみ run ログを確認）

      - name: Discord 通知（🚨 自動リトライ停止）
        if: contains(steps.check.outputs.reason, 'retry_cap')
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_SNS || secrets.DISCORD_WEBHOOK_URL }}
          state: alert
          label: マクロ市況ツイート 自動リトライ停止
          meaning: 対象日に 3 回以上失敗したため自動再実行を停止しました（暴走防止の上限）。ツイート案は未生成です。
          action_required: run ログ確認 → 原因解消後に手動 dispatch（force_rerun=true）で再実行

      - name: Discord 通知（guard 失敗）
        if: failure() || cancelled()
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_SNS || secrets.DISCORD_WEBHOOK_URL }}
          state: failed
          label: マクロ市況ツイート guard 失敗
          meaning: 実行前チェック（当日重複判定）自体がエラーになり、生成ジョブが起動していません。
          action_required: run ログ確認 → 手動 dispatch で再実行

  generate:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    # 最悪ケース = 前段（clone/setup）5 分 + 20 分 + 待機 1 分 + 20 分 + 待機 3 分 + 20 分
    #              + 送信/commit 4 分 = 73 分。余裕を見て 85 分。
    timeout-minutes: 85
    #
    # ★想定トークンコスト★
    #   成功日（大半）: 生成 1 回のみ。後続の cron 2 枠は guard の delivered>0 で skip し
    #                   Claude を呼ばないため追加ゼロ。
    #   一時障害の日  : 拒否されたリクエストは実測 0 トークン（529 は input/output とも 0）。
    #                   同一 run 内で最大 3 試行しても、燃えるのは実際に走った分だけ。
    #                   回復 run（cron 2 枠）でも同じ規律が効くため、生成の実消費は
    #                   最悪でも「成功するまでの数回」に収まる。
    #   確定失敗の日  : 1 回で打ち切る（同一入力の再投入をしない）。約 36k 入力トークン × 1。

    steps:
      - name: Determine target date
        id: date
        # 対象日は guard が決めた値をそのまま使う（深夜遅延着火の前日補正を含む）。
        # ここで再計算すると guard の補正が無効になり、9/3 の Run2 と同じ日付ズレが再発する。
        env:
          GUARD_DATE: ${{ needs.guard.outputs.target_date }}
        run: |
          if [ -n "$GUARD_DATE" ]; then
            echo "value=${GUARD_DATE}" >> $GITHUB_OUTPUT
          else
            echo "value=$(TZ=Asia/Tokyo date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          fi

      - name: Checkout report-pipelines
        uses: actions/checkout@v4
        with:
          path: report-pipelines

      - name: Setup SSH for private repo
        env:
          PRIVATE_REPO_DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_REPO_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone private repo (mizuki-fund)
        run: |
          git clone git@github.com:mzinvestment1105/mizuki-fund.git private-repo

      - name: Copy pipelines and static files from Public into private working tree
        # PM が Private 側への push を忘れた場合でも Public 側の最新ファイルで上書きし、自動化の品質を保つ。
        # ツイートは PDF 化しないため、埋め込みフォント（assets/fonts）と Playwright は導入しない。
        run: |
          cp -f report-pipelines/bi/pipelines/*.py private-repo/bi/pipelines/
          cp -f report-pipelines/bi/pipelines/requirements.txt private-repo/bi/pipelines/
          mkdir -p private-repo/bi/pipelines/lib
          cp -rf report-pipelines/bi/pipelines/lib/*.py private-repo/bi/pipelines/lib/ 2>/dev/null || true
          mkdir -p private-repo/agents private-repo/playbook
          cp -f report-pipelines/agents/*.md private-repo/agents/ 2>/dev/null || true
          cp -f report-pipelines/playbook/*.md private-repo/playbook/ 2>/dev/null || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: report-pipelines/bi/pipelines/requirements.txt

      - name: Install dependencies
        run: pip install -r report-pipelines/bi/pipelines/requirements.txt

      - name: Check prerequisite (夕刊マクロの存在確認)
        id: precheck
        # ツイートは夕刊マクロ本文を素材にするため、夕刊が出ていない日はツイートだけ作らない。
        # 見つからない場合は warning のうえ以降を skip し、ジョブは成功扱いで終える
        # （夕刊未発行は夕刊側の workflow が別途通知するため、ここで二重に失敗通知を出さない）。
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: |
          F="private-repo/market/daily/macro/${TARGET_DATE}_evening.md"
          if [ ! -s "$F" ]; then
            echo "::warning::夕刊マクロが存在しない（または空）ため、本日のマクロ市況ツイート生成をスキップします: $F"
            echo "ready=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "夕刊マクロを確認: $F ($(wc -l < "$F") lines)"
          echo "ready=true" >> $GITHUB_OUTPUT

      # ============================================================================
      # 生成: 最大 3 試行（初回 + 再試行 2 回）。ただし「一時障害」の時だけ粘る。
      #
      # 失敗の 2 分類（classify_failure.sh が判定・実測ログで検証済み）:
      #   transient = リクエストが拒否された一時障害（529 / overloaded / rate_limit /
      #               ECONNRESET / timeout / 5xx）。2026-09-03 の実測では
      #               input_tokens=0 / output_tokens=0 / total_cost_usd=0 だった。
      #               ＝再試行してもトークンを食わないので粘る価値がある。
      #   permanent = Claude が実際に動いたうえで成果物を作らなかったケース
      #               （プロンプト側の ABORT、意図的な exit 1 など）。
      #               同じ入力で再実行しても同じ結論になり、約 36k の入力トークンを
      #               ただ燃やすだけなので同一 run 内では再試行しない。
      #
      # 判定材料は action の execution_file（失敗時も書き出される JSON）を第一に使う。
      # 実測で確認済み: run-claude.ts は exitCode != 0 の分岐でも execution_file を
      # setOutput しており、result / is_error / usage を含む完全な JSON が読める。
      # ============================================================================

      - name: Generate macro tweet via Claude Code (attempt 1)
        id: gen1
        if: success() && steps.precheck.outputs.ready == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-5
          prompt_file: report-pipelines/prompts/macro-tweet.md
          allowed_tools: "Read,Write,Edit,Bash,Grep,Glob"
          timeout_minutes: "20"
          claude_env: |
            CLAUDE_CODE_EFFORT_LEVEL: high
            CLAUDE_CODE_MAX_OUTPUT_TOKENS: 32000
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
          PRIVATE_REPO_ROOT: private-repo
          # make_sector_daily.py の JQuants ライブ取得フォールバック用（プロンプト内から Bash で呼ぶ）。
          # price_history の parquet に対象日が無い日でも 17 業種騰落率を取得できるようにする。
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}

      - name: Classify attempt 1 failure
        id: cls1
        if: success() && steps.precheck.outputs.ready == 'true' && steps.gen1.outcome == 'failure'
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
          EXECUTION_FILE: ${{ steps.gen1.outputs.execution_file }}
          ATTEMPT: '1'
        run: bash report-pipelines/.github/scripts/classify_failure.sh

      - name: Wait before attempt 2 (60s)
        if: success() && steps.precheck.outputs.ready == 'true' && steps.cls1.outputs.kind == 'transient'
        run: |
          echo "一時障害と判定しました。60 秒待機して再試行します（529 は即時再試行が無意味なため）"
          sleep 60

      - name: Generate macro tweet via Claude Code (attempt 2)
        id: gen2
        if: success() && steps.precheck.outputs.ready == 'true' && steps.cls1.outputs.kind == 'transient'
        continue-on-error: true
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-5
          prompt_file: report-pipelines/prompts/macro-tweet.md
          allowed_tools: "Read,Write,Edit,Bash,Grep,Glob"
          timeout_minutes: "20"
          claude_env: |
            CLAUDE_CODE_EFFORT_LEVEL: high
            CLAUDE_CODE_MAX_OUTPUT_TOKENS: 32000
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
          PRIVATE_REPO_ROOT: private-repo
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}

      - name: Classify attempt 2 failure
        id: cls2
        if: success() && steps.precheck.outputs.ready == 'true' && steps.gen2.outcome == 'failure'
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
          EXECUTION_FILE: ${{ steps.gen2.outputs.execution_file }}
          ATTEMPT: '2'
        run: bash report-pipelines/.github/scripts/classify_failure.sh

      - name: Wait before attempt 3 (180s)
        if: success() && steps.precheck.outputs.ready == 'true' && steps.cls2.outputs.kind == 'transient'
        run: |
          echo "2 回目も一時障害でした。180 秒待機して最終試行します（障害の収束に時間を与える）"
          sleep 180

      - name: Generate macro tweet via Claude Code (attempt 3 / final)
        id: gen3
        if: success() && steps.precheck.outputs.ready == 'true' && steps.cls2.outputs.kind == 'transient'
        continue-on-error: true
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-5
          prompt_file: report-pipelines/prompts/macro-tweet.md
          allowed_tools: "Read,Write,Edit,Bash,Grep,Glob"
          timeout_minutes: "20"
          claude_env: |
            CLAUDE_CODE_EFFORT_LEVEL: high
            CLAUDE_CODE_MAX_OUTPUT_TOKENS: 32000
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
          PRIVATE_REPO_ROOT: private-repo
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}

      - name: Verify generated macro tweet (成否の一元判定)
        # 上の生成ステップは全て continue-on-error のため、ジョブの成否はここだけで決まる。
        # 「どの試行で成功したか」に依存せず成果物の実在で判定する（従来どおり）。
        if: success() && steps.precheck.outputs.ready == 'true'
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: |
          F="private-repo/research/sns/${TARGET_DATE}_macro_tweet.md"
          echo "attempt outcomes: gen1=${{ steps.gen1.outcome }} (kind=${{ steps.cls1.outputs.kind }}) gen2=${{ steps.gen2.outcome }} (kind=${{ steps.cls2.outputs.kind }}) gen3=${{ steps.gen3.outcome }}"
          if [ ! -s "$F" ]; then
            echo "::error::マクロ市況ツイート案が生成されませんでした: $F"
            exit 1
          fi
          echo "生成成功: $F ($(wc -l < "$F") lines)"

      - name: Send macro tweet drafts to Discord (SNS)
        id: send
        if: success() && steps.precheck.outputs.ready == 'true'
        env:
          DISCORD_WEBHOOK_SNS: ${{ secrets.DISCORD_WEBHOOK_SNS }}
          TARGET_DATE: ${{ steps.date.outputs.value }}
          PYTHONIOENCODING: utf-8
        run: |
          F="private-repo/research/sns/${TARGET_DATE}_macro_tweet.md"
          if [ ! -s "$F" ]; then
            echo "::warning::マクロ市況ツイート案が生成されなかったため送信をスキップします: $F"
            exit 0
          fi
          MD=$(TZ=Asia/Tokyo date -d "${TARGET_DATE}" '+%-m月%-d日')
          cd private-repo/bi/pipelines
          python send_sns_drafts_discord.py \
            --file "../../research/sns/${TARGET_DATE}_macro_tweet.md" \
            --header "**マクロ市況ツイート / ${MD} 大引け**" \
            --hide-source

      - name: Commit and push to private repo
        # rebase 方式は履歴書き換え・並行 push で index.lock 残留の構造的弱点があるため、
        # fresh-base 方式の共通ヘルパー（Public 側から直接実行・repo 内コピー禁止）へ置換。
        if: success() && steps.precheck.outputs.ready == 'true'
        working-directory: ./private-repo
        run: |
          bash ../report-pipelines/bi/pipelines/ops/ci_commit_push.sh \
            -m "data: macro tweet ${{ steps.date.outputs.value }}" research/sns

      - name: Discord 通知（⚠️ 配信済み・後処理のみ失敗）
        if: (failure() || cancelled()) && steps.send.outcome == 'success'
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_SNS || secrets.DISCORD_WEBHOOK_URL }}
          state: partial
          label: マクロ市況ツイート 後処理のみ失敗
          date: ${{ steps.date.outputs.value }}
          meaning: ツイート案は Discord へ配信済みです。配信後の commit だけが失敗しました。
          action_required: 不要（差分は次回 run が回収）

      - name: Discord 通知（❌ 失敗）
        if: (failure() || cancelled()) && steps.send.outcome != 'success'
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_SNS || secrets.DISCORD_WEBHOOK_URL }}
          state: failed
          label: マクロ市況ツイート 失敗
          date: ${{ steps.date.outputs.value }}
          meaning: 生成または送信が完了せず、本日のツイート案は未配信です。
          action_required: run ログ確認 → 手動 dispatch（force_rerun=true）で再実行。ログに「Spending cap reached」がある場合は Claude 利用枠切れ＝リセット時刻以降に force_rerun=true
