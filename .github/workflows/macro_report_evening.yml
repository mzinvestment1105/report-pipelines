name: マクロレポート夕刊

"on":
  # PM 2026-05-27 確定: Cloudflare Worker (mizuki-fund-scheduler-1) からの workflow_dispatch がメイン経路。
  # PM 2026-06-05 追加: Worker 単一経路の SPOF 回避のため、Worker (17:33 JST) の約 1 時間後に
  # GHA cron をフェイルセーフとして併用。平日のみ（UTC 月-金 = 09:30）。
  # guard ジョブで当日既存 run を検知して重複発火を防ぐ。
  workflow_dispatch:
    inputs:
      target_date:
        description: '対象日付 (YYYY-MM-DD・空欄で当日)'
        required: false
        default: ''
  schedule:
    - cron: '30 9 * * 1-5'

concurrency:
  group: macro_report_evening-${{ github.event.inputs.target_date || 'auto' }}
  cancel-in-progress: false

jobs:
  guard:
    # PM 2026-06-05: 当日 0:00 JST 以降の同 workflow の run を集計し、
    # success または in_progress/queued/waiting が 1 件でもあれば skip。
    # failure のみ存在、または run なしの時のみ proceed。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Check today's runs
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY_JST=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          TODAY_START="${TODAY_JST}T00:00:00+09:00"
          MY_RUN_ID=${{ github.run_id }}

          RUNS=$(gh api -X GET \
            "repos/${{ github.repository }}/actions/workflows/macro_report_evening.yml/runs" \
            -f "created=>=${TODAY_START}" \
            --jq "[.workflow_runs[] | select(.id != ${MY_RUN_ID})]")

          SUCCESS=$(echo "$RUNS" | jq '[.[] | select(.conclusion=="success")] | length')
          ACTIVE=$(echo "$RUNS" | jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting")] | length')
          FAILURE=$(echo "$RUNS" | jq '[.[] | select(.conclusion=="failure")] | length')

          echo "Today (${TODAY_JST}): success=${SUCCESS} active=${ACTIVE} failure=${FAILURE} (excluding self ${MY_RUN_ID})"

          if [ "$SUCCESS" -eq 0 ] && [ "$ACTIVE" -eq 0 ]; then
            echo "proceed=true" >> $GITHUB_OUTPUT
            if [ "$FAILURE" -gt 0 ]; then
              echo "reason=recovery (failure=${FAILURE})" >> $GITHUB_OUTPUT
            else
              echo "reason=initial" >> $GITHUB_OUTPUT
            fi
          else
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=skip (success=${SUCCESS} active=${ACTIVE})" >> $GITHUB_OUTPUT
          fi

      - name: Discord notification (cron event only)
        if: github.event_name == 'schedule'
        env:
          WH: ${{ secrets.DISCORD_WEBHOOK_MACRO }}
        run: |
          if [ "${{ steps.check.outputs.proceed }}" = "true" ]; then
            MSG="🔶 GHA cron フェイルセーフ起動: マクロレポート夕刊 (${{ steps.check.outputs.reason }})"
          else
            MSG="🔵 GHA cron skip: マクロレポート夕刊 (${{ steps.check.outputs.reason }})"
          fi
          curl -s -X POST "$WH" -H "Content-Type: application/json" \
            -d "{\"content\":\"${MSG}\"}"

  generate:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Determine target date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            echo "value=${{ github.event.inputs.target_date }}" >> $GITHUB_OUTPUT
          else
            echo "value=$(TZ=Asia/Tokyo date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          fi

      - name: Checkout report-pipelines
        uses: actions/checkout@v4
        with:
          path: report-pipelines

      - name: Setup SSH for private repo
        env:
          PRIVATE_REPO_DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_REPO_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone private repo (mizuki-fund)
        run: |
          git clone git@github.com:mzinvestment1105/mizuki-fund.git private-repo

      - name: Copy pipelines and static files from Public into private working tree
        # PMがPrivate側へのpushを忘れた場合でも、Public側の最新ファイルで上書きすることで
        # 自動化の品質を保つ（agents/macro_analyst.md・playbook/*.md・Pythonスクリプト + lib/）
        run: |
          cp -f report-pipelines/bi/pipelines/*.py private-repo/bi/pipelines/
          cp -f report-pipelines/bi/pipelines/requirements.txt private-repo/bi/pipelines/
          mkdir -p private-repo/bi/pipelines/lib
          cp -rf report-pipelines/bi/pipelines/lib/*.py private-repo/bi/pipelines/lib/ 2>/dev/null || true
          mkdir -p private-repo/agents private-repo/playbook
          cp -f report-pipelines/agents/*.md private-repo/agents/ 2>/dev/null || true
          cp -f report-pipelines/playbook/*.md private-repo/playbook/ 2>/dev/null || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: report-pipelines/bi/pipelines/requirements.txt

      - name: Install dependencies
        run: pip install -r report-pipelines/bi/pipelines/requirements.txt

      - name: Install Japanese fonts (Noto Sans CJK JP)
        # GitHub Actions Ubuntu runner には Yu Gothic（Windows）が無いため、
        # Noto Sans CJK JP をインストール（中国語フォントへのフォールバック防止）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra

      - name: Install Playwright Chromium
        run: |
          playwright install chromium --with-deps

      - name: Fetch raw data (RSS + Finnhub)
        working-directory: ./private-repo/bi/pipelines
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          python fetch_rss.py --category all
          python fetch_finnhub.py --date ${{ steps.date.outputs.value }}

      - name: Fetch raw data (立花証券 e支店 API ニュース)
        # 立花証券から QUICK NQN / TDNet AI / AI 市況 500件を取得して
        # macro raw に統合する（generate_macro_report.py が自動で読み込む）。
        # 認証情報未設定なら skip（後方互換）。
        working-directory: ./private-repo/bi/pipelines
        env:
          TACHIBANA_DEMO_AUTH_ID: ${{ secrets.TACHIBANA_DEMO_AUTH_ID }}
          TACHIBANA_DEMO_PRIVATE_KEY_PEM: ${{ secrets.TACHIBANA_DEMO_PRIVATE_KEY_PEM }}
          TACHIBANA_DEMO_API_BASE: ${{ secrets.TACHIBANA_DEMO_API_BASE }}
          PYTHONIOENCODING: utf-8
        continue-on-error: true
        run: |
          if [ -z "$TACHIBANA_DEMO_AUTH_ID" ]; then
            echo "[INFO] 立花証券 Secrets 未設定・skip"
            exit 0
          fi
          python fetch_tachibana_news.py --date ${{ steps.date.outputs.value }} --limit 500

      - name: Build macro prompt (generate_macro_report.py)
        id: build_prompt
        working-directory: ./private-repo/bi/pipelines
        env:
          PYTHONIOENCODING: utf-8
        continue-on-error: true
        run: |
          set +e
          python generate_macro_report.py --date ${{ steps.date.outputs.value }} --force
          ec=$?
          echo "exit_code=$ec" >> $GITHUB_OUTPUT
          # exit 2 = 新着なし（OK）・exit 0 = 正常生成・exit 1 = エラー
          if [ "$ec" = "1" ]; then exit 1; fi
          exit 0

      - name: Skip if no new articles
        if: steps.build_prompt.outputs.exit_code == '2'
        run: |
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK_MACRO }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"⏭ マクロレポート夕刊 skip（新着記事なし）\n${{ steps.date.outputs.value }}\"}"
          exit 0

      - name: 既存マクロ夕刊ファイルを削除（前回不良ファイル読込スキップ防止）
        working-directory: ./private-repo
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: |
          TARGET_FILE="market/daily/macro/${TARGET_DATE}_evening.md"
          if [ -f "$TARGET_FILE" ]; then
            echo "Removing existing $TARGET_FILE before Claude run..."
            rm -f "$TARGET_FILE"
          fi

      - name: Generate macro evening report via Claude Code (Opus 4.7 + max thinking)
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-4-7
          prompt_file: report-pipelines/prompts/macro-report-evening.md
          allowed_tools: "Read,Write,Edit,Bash,Grep,Glob,WebSearch,WebFetch"
          timeout_minutes: "30"
          claude_env: |
            MAX_THINKING_TOKENS: 32000
            CLAUDE_CODE_MAX_OUTPUT_TOKENS: 64000
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
          PRIVATE_REPO_ROOT: private-repo
          REPORT_EDITION: evening

      - name: Send Discord (JPEG)
        working-directory: ./private-repo/bi/pipelines
        env:
          DISCORD_WEBHOOK_MACRO: ${{ secrets.DISCORD_WEBHOOK_MACRO }}
          PYTHONIOENCODING: utf-8
        run: |
          python send_report_jpeg_discord.py --kind macro_evening --date ${{ steps.date.outputs.value }}

      - name: Commit and push to private repo
        working-directory: ./private-repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Public から overlay した一時コピーをすべて掃除
          git checkout -- bi/pipelines/ agents/ playbook/ 2>/dev/null || true
          git clean -fd bi/pipelines/ agents/ playbook/ 2>/dev/null || true
          git add market/daily/
          if ! git diff --staged --quiet; then
            # 残りの未追跡・未ステージ変更を退避して rebase をクリーンに走らせる
            git stash push --keep-index --include-untracked -m "ci-cleanup" 2>/dev/null || true
            git commit -m "data: macro evening report ${{ steps.date.outputs.value }}"
            git fetch origin master
            git rebase origin/master || (git diff --name-only --diff-filter=U | xargs -I{} git checkout --theirs {}; git diff --name-only --diff-filter=U | xargs git add; git -c core.editor=true rebase --continue)
            git push origin master
            # 退避した一時変更は破棄（Public 側 overlay なので保存不要）
            git stash drop 2>/dev/null || true
          fi

      - name: Discord 通知（失敗）
        if: failure()
        env:
          DISCORD_WEBHOOK_MACRO: ${{ secrets.DISCORD_WEBHOOK_MACRO }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK_MACRO" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"❌ マクロレポート夕刊失敗\n${{ steps.date.outputs.value }}\nログ確認: https://github.com/${{ github.repository }}/actions\"}"
