name: マクロレポート夕刊

"on":
  # PM 2026-05-27 確定: Cloudflare Worker (mizuki-fund-scheduler-1) からの workflow_dispatch がメイン経路。
  # PM 2026-06-05 追加: Worker 単一経路の SPOF 回避のため、Worker (17:33 JST) の約 1 時間後に
  # GHA cron をフェイルセーフとして併用。平日のみ（UTC 月-金 = 09:30）。
  # guard ジョブで当日既存 run を検知して重複発火を防ぐ。
  workflow_dispatch:
    inputs:
      target_date:
        description: '対象日付 (YYYY-MM-DD・空欄で当日)'
        required: false
        default: ''
      force_rerun:
        description: 'true で当日重複ガードを無視して強制実行（修正後の再テスト用）'
        required: false
        default: 'false'
  schedule:
    - cron: '30 9 * * 1-5'

# PM 2026-06-06 修正: target_date による group 分裂を防ぐため固定 group へ変更。
concurrency:
  group: macro_report_evening-daily
  cancel-in-progress: false

jobs:
  guard:
    # PM 2026-06-05/06: status 全種類（cancelled / startup_failure / timed_out / stale 等）を漏れなく分類。
    # 判定: (1) DONE_OK >= 1 → skip / (2) ACTIVE >= 1 → skip
    #       (3) cron 起動かつ DONE_FAIL >= 2 → skip（連続失敗の課金暴走防止）
    #       (4) それ以外 → proceed（initial or recovery）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      # 通知 composite action（.github/actions/notify-discord）を使うため checkout が必要
      - name: Checkout report-pipelines (通知 action 用)
        uses: actions/checkout@v4

      - name: Check today's runs
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY_JST=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          MY_RUN_ID=${{ github.run_id }}
          EVENT="${{ github.event_name }}"

          # force_rerun は「手動 workflow_dispatch かつ明示 true」の時のみ有効（誤再発火防止）。
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force_rerun }}" = "true" ]; then
            echo "proceed=true" >> $GITHUB_OUTPUT
            echo "reason=force_rerun (manual guard bypass)" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 2026-08-05 修正: run 単位の conclusion は「guard が本体ジョブを skip した run」まで
          # success と数えてしまい、本命の発火を「本日配信済み」と誤認して無言 skip させる。
          # 実際に配信/更新を行うジョブ（generate）の結果だけで判定する。
          STATS=$(bash .github/scripts/check_delivery.sh macro_report_evening.yml generate "${MY_RUN_ID}")
          DONE_OK=$(echo "$STATS" | jq -r '.delivered')
          DONE_FAIL=$(echo "$STATS" | jq -r '.failed')
          ACTIVE=$(( $(echo "$STATS" | jq -r '.sending') + $(echo "$STATS" | jq -r '.dispatch_pending') + $(echo "$STATS" | jq -r '.schedule_pending') ))

          echo "Today (${TODAY_JST}): active=${ACTIVE} done_ok=${DONE_OK} done_fail=${DONE_FAIL} event=${EVENT} (excluding self ${MY_RUN_ID})"

          # 2026-08-19: 予備タイマー通知の文面へ実測値を埋めるため、判定に使った当日実績を output 化。
          echo "active=${ACTIVE}" >> $GITHUB_OUTPUT
          echo "done_ok=${DONE_OK}" >> $GITHUB_OUTPUT
          echo "done_fail=${DONE_FAIL}" >> $GITHUB_OUTPUT

          # PM 2026-06-23: GitHub cron は数時間遅延し、深夜着火すると翌 JST 日の枠を誤って消費して
          # 正規便（Worker 17:33）を skip させる事故が発生。schedule(cron) 起動のみ時間帯ゲートで無害化する。
          # workflow_dispatch（Worker・PM 手動）は常に通す。夕刊の妥当な発行帯 = JST 17〜23 時。
          HOUR_JST=$((10#$(TZ=Asia/Tokyo date +%H)))

          if [ "$EVENT" = "schedule" ] && [ "$HOUR_JST" -lt 17 ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=skip (cron outside evening window: ${HOUR_JST}h JST)" >> $GITHUB_OUTPUT
          elif [ "$DONE_OK" -gt 0 ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=skip (already succeeded today: done_ok=${DONE_OK})" >> $GITHUB_OUTPUT
          elif [ "$ACTIVE" -gt 0 ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=skip (active run exists: active=${ACTIVE})" >> $GITHUB_OUTPUT
          elif [ "$EVENT" = "schedule" ] && [ "$DONE_FAIL" -ge 2 ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=retry_cap (cron stopped: done_fail=${DONE_FAIL} >= 2)" >> $GITHUB_OUTPUT
          else
            echo "proceed=true" >> $GITHUB_OUTPUT
            if [ "$DONE_FAIL" -gt 0 ]; then
              echo "reason=recovery (done_fail=${DONE_FAIL})" >> $GITHUB_OUTPUT
            else
              echo "reason=initial" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Discord 通知（⏱ 予備タイマー起動）
        if: github.event_name == 'schedule' && steps.check.outputs.proceed == 'true'
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_MACRO }}
          state: timer
          label: マクロレポート夕刊 予備タイマー起動
          # 2026-08-19 修正: 旧文面は「Worker 発火が届かなかった」と断定していたが、Worker が正常着弾し
          # その run が失敗した場合も同じ通知が出る。guard が実際に把握している当日実績のみを述べる。
          meaning: '本日の生成がまだ成功していないため、GHA 側の予備タイマーが救援起動しました（本日: 成功 ${{ steps.check.outputs.done_ok }} 件・失敗 ${{ steps.check.outputs.done_fail }} 件・実行中 ${{ steps.check.outputs.active }} 件）。レポートはこのあと通常どおり届きます。'
          action_required: 不要（このあとレポートが届けば復旧完了。届かない場合のみ run ログを確認）

      - name: Discord 通知（🚨 自動リトライ停止）
        if: contains(steps.check.outputs.reason, 'retry_cap')
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_MACRO }}
          state: alert
          label: マクロレポート夕刊 自動リトライ停止
          meaning: 当日 2 回以上失敗したため cron の自動再実行を停止しました。本日未配信です。
          action_required: run ログ確認 → 原因解消後に手動 dispatch（force_rerun=true）で再実行

      - name: Discord 通知（guard 失敗）
        if: failure() || cancelled()
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_MACRO || secrets.DISCORD_WEBHOOK_URL }}
          state: failed
          label: マクロレポート夕刊 guard 失敗
          meaning: 実行前チェック（当日重複判定）自体がエラーになり、生成ジョブが起動していません。
          action_required: run ログ確認 → 手動 dispatch で再実行

  generate:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    # PM 2026-08-19: 529 自動リトライ（2 回・待機 60/180 秒）を足したため枠を再計算して拡張。
    # 最悪ケース = 前段（clone/setup/fonts/playwright/raw 取得）10 分 + 1 回目 30 分 + 待機 1 分
    #            + 2 回目 30 分 + 待機 3 分 + 3 回目 30 分 + 検証/送信/commit 5 分 = 109 分 → 120 分。
    timeout-minutes: 120

    steps:
      - name: Determine target date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            echo "value=${{ github.event.inputs.target_date }}" >> $GITHUB_OUTPUT
          else
            echo "value=$(TZ=Asia/Tokyo date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          fi

      - name: Checkout report-pipelines
        uses: actions/checkout@v4
        with:
          path: report-pipelines

      - name: Setup SSH for private repo
        env:
          PRIVATE_REPO_DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_REPO_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone private repo (mizuki-fund)
        run: |
          git clone git@github.com:mzinvestment1105/mizuki-fund.git private-repo

      - name: Copy pipelines and static files from Public into private working tree
        # PMがPrivate側へのpushを忘れた場合でも、Public側の最新ファイルで上書きすることで
        # 自動化の品質を保つ（agents/macro_analyst.md・playbook/*.md・Pythonスクリプト + lib/）
        run: |
          cp -f report-pipelines/bi/pipelines/*.py private-repo/bi/pipelines/
          cp -f report-pipelines/bi/pipelines/requirements.txt private-repo/bi/pipelines/
          mkdir -p private-repo/bi/pipelines/lib
          cp -rf report-pipelines/bi/pipelines/lib/*.py private-repo/bi/pipelines/lib/ 2>/dev/null || true
          # PDF 配信用の埋め込みフォント（assets/fonts/*.woff2）を Public から overlay
          mkdir -p private-repo/bi/pipelines/assets/fonts
          cp -rf report-pipelines/bi/pipelines/assets/fonts/* private-repo/bi/pipelines/assets/fonts/ 2>/dev/null || true
          mkdir -p private-repo/agents private-repo/playbook
          cp -f report-pipelines/agents/*.md private-repo/agents/ 2>/dev/null || true
          cp -f report-pipelines/playbook/*.md private-repo/playbook/ 2>/dev/null || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: report-pipelines/bi/pipelines/requirements.txt

      - name: Install dependencies
        run: pip install -r report-pipelines/bi/pipelines/requirements.txt

      - name: Install Japanese fonts (Noto Sans CJK JP)
        # PM 2026-08-19 承認（動意日次 mover_report_daily.yml からの横展開）: `sudo apt-get update -qq`
        # が出力ゼロのまま数十分ハングし、ジョブ枠に到達して配信ごと落ちる事故（GitHub 側の一時事象）の
        # 恒久対策。①ステップ単位 timeout ②各コマンドを timeout コマンドで打ち切り ③待機つき 3 回リトライ。
        #
        # 【失敗してもジョブを落とさない理由】本 workflow の誌面生成は send_report_pdf_discord.py →
        # bi/pipelines/lib/md_to_pdf.py で行い、同モジュールは assets/fonts の日本語サブセット woff2
        # （NotoSansJP / NotoSerifJP / BIZ UDPGothic）を base64 で @font-face 埋め込みする設計＝
        # システムのフォント選択に一切依存しない。よって apt のフォントが無くても誌面が豆腐（文字化け）に
        # なることはなく、ここで落とすと「配信できたはずの日を落とす」だけになる。
        # 時間予算: 1 試行 = update 75 秒 + install 120 秒 = 最大 195 秒。新規試行は開始 280 秒までに
        # 限るので最悪 475 秒で自己終了し、ステップ枠 8 分（480 秒）内に必ず警告を出して抜ける。
        timeout-minutes: 8
        continue-on-error: true
        run: |
          set -u
          DEADLINE=$(( $(date +%s) + 280 ))
          for i in 1 2 3; do
            if [ "$i" -gt 1 ] && [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "時間予算を超過したため再試行を打ち切ります"
              break
            fi
            if timeout 75 sudo apt-get update -qq \
               && timeout 120 sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra; then
              echo "日本語フォント導入に成功しました（${i} 回目）"
              exit 0
            fi
            echo "日本語フォント導入に失敗またはハングしました（${i}/3 回目）"
            if [ "$i" -lt 3 ]; then
              sleep $((i * 15))
            fi
          done
          echo "::warning::日本語フォントの apt 導入をスキップしました。PDF は assets/fonts の埋め込みフォント（base64 @font-face）で描画するため誌面に影響はなく、配信を続行します"
          exit 0

      - name: Install Playwright Chromium
        run: |
          playwright install chromium --with-deps

      - name: Fetch raw data (RSS + Finnhub)
        working-directory: ./private-repo/bi/pipelines
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          python fetch_rss.py --category all
          # Finnhub は補助ソース。取得ゼロ（exit 2）で夕刊全体を落とさない。
          # 2026-08-31 に Finnhub の 503 が exit 2 を返し、bash -e により generate ジョブが
          # 中断して夕刊が未発行になった。本命の fetch_rss.py は成功しており材料は揃って
          # いたため、補助 API の一時障害で配信が止まる状態を解消する。
          # exit 2 以外（キー不正・想定外の例外）は従来どおり失敗させる。
          python fetch_finnhub.py --date ${{ steps.date.outputs.value }} || {
            ec=$?
            if [ "$ec" = "2" ]; then
              echo "::warning::Finnhub の取得件数がゼロのため補助データなしで続行します（他ソースで代替）"
            else
              exit $ec
            fi
          }

      - name: Fetch raw data (立花証券 e支店 API ニュース)
        # 立花証券から QUICK NQN / TDNet AI / AI 市況 500件を取得して
        # macro raw に統合する（generate_macro_report.py が自動で読み込む）。
        # 認証情報未設定なら skip（後方互換）。
        working-directory: ./private-repo/bi/pipelines
        env:
          TACHIBANA_DEMO_AUTH_ID: ${{ secrets.TACHIBANA_DEMO_AUTH_ID }}
          TACHIBANA_DEMO_PRIVATE_KEY_PEM: ${{ secrets.TACHIBANA_DEMO_PRIVATE_KEY_PEM }}
          TACHIBANA_DEMO_API_BASE: ${{ secrets.TACHIBANA_DEMO_API_BASE }}
          PYTHONIOENCODING: utf-8
        continue-on-error: true
        run: |
          if [ -z "$TACHIBANA_DEMO_AUTH_ID" ]; then
            echo "[INFO] 立花証券 Secrets 未設定・skip"
            exit 0
          fi
          python fetch_tachibana_news.py --date ${{ steps.date.outputs.value }} --limit 500

      - name: Build macro prompt (generate_macro_report.py)
        id: build_prompt
        working-directory: ./private-repo/bi/pipelines
        env:
          # 市場別サマリー（J-Quants v2 指数+ブレッドス・PM 2026-07-07）用。
          # 未設定でもレポート生成は止まらない（ブロックごと省略・stderr 警告のみ）。
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          PYTHONIOENCODING: utf-8
        continue-on-error: true
        run: |
          set +e
          python generate_macro_report.py --date ${{ steps.date.outputs.value }} --force
          ec=$?
          echo "exit_code=$ec" >> $GITHUB_OUTPUT
          # exit 2 = 新着なし（OK）・exit 0 = 正常生成・exit 1 = エラー
          if [ "$ec" = "1" ]; then exit 1; fi
          exit 0

      - name: Discord 通知（⏭ 発行なし・新着記事なし）
        if: steps.build_prompt.outputs.exit_code == '2'
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_MACRO }}
          state: none
          label: マクロレポート夕刊 発行なし
          date: ${{ steps.date.outputs.value }}
          meaning: 前回以降の新着記事がなかったため、本日の夕刊は発行しません（正常動作）。
          action_required: 不要

      # 2026-07-07 構造矛盾解消: 従来は skip 通知後も生成・送信 step が続行していた
      # （後続 step に exit_code != '2' の条件が無かった）。以降の全 step に条件を付与。
      - name: 既存マクロ夕刊ファイルを削除（前回不良ファイル読込スキップ防止）
        if: success() && steps.build_prompt.outputs.exit_code != '2'
        working-directory: ./private-repo
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: |
          TARGET_FILE="market/daily/macro/${TARGET_DATE}_evening.md"
          if [ -f "$TARGET_FILE" ]; then
            echo "Removing existing $TARGET_FILE before Claude run..."
            rm -f "$TARGET_FILE"
          fi

      # PM 2026-08-19 承認（動意日次 mover_report_daily.yml からの横展開）: Anthropic 側の過負荷応答
      # （API Error: 529 overloaded_error）を初回 API 呼び出しで受けて即 exit 1 する事故の恒久対策。
      # 第三者製の新規 action を足さず、continue-on-error + outcome 判定の再試行ステップだけで構成する。
      # 529 は即時再試行が無意味なため待機を指数的に伸ばす（60 秒 → 180 秒）。3 ステップとも
      # continue-on-error のため、成否は最後の Verify ステップ 1 箇所（成果物ファイルが非空か）で決まる。
      - name: Generate macro evening report via Claude Code (Opus 5 + effort high)
        id: gen1
        if: success() && steps.build_prompt.outputs.exit_code != '2'
        continue-on-error: true
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-5
          prompt_file: report-pipelines/prompts/macro-report-evening.md
          # PM 2026-06-28: WebSearch/WebFetch は GHA で 404（補助モデル解決不可）のため除去。
          # 市況・数値・イベント解釈は raw（news/finnhub/立花）＋市況スナップショット（VIX/VI含む）で完結。
          allowed_tools: "Read,Write,Edit,Bash,Grep,Glob"
          timeout_minutes: "30"
          claude_env: |
            CLAUDE_CODE_EFFORT_LEVEL: high
            CLAUDE_CODE_MAX_OUTPUT_TOKENS: 64000
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
          PRIVATE_REPO_ROOT: private-repo
          REPORT_EDITION: evening

      - name: Wait before retry 2 (Claude overloaded 等の一時エラー)
        if: success() && steps.gen1.outcome == 'failure'
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: |
          F="private-repo/market/daily/macro/${TARGET_DATE}_evening.md"
          # 途中まで書かれた不完全ファイルは退避（削除しない）。再試行が白紙から書き直せるようにする。
          if [ -f "$F" ]; then
            mv "$F" "/tmp/${TARGET_DATE}_macro_evening.attempt1.partial.md"
            echo "1 回目の不完全な出力を /tmp へ退避しました（再試行が白紙から書き直せるようにするため）"
          fi
          echo "1 回目が失敗しました。60 秒待機して再試行します（529 は即時再試行が無意味なため）"
          sleep 60

      - name: Generate macro evening report via Claude Code (retry 2)
        id: gen2
        if: success() && steps.gen1.outcome == 'failure'
        continue-on-error: true
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-5
          prompt_file: report-pipelines/prompts/macro-report-evening.md
          allowed_tools: "Read,Write,Edit,Bash,Grep,Glob"
          timeout_minutes: "30"
          claude_env: |
            CLAUDE_CODE_EFFORT_LEVEL: high
            CLAUDE_CODE_MAX_OUTPUT_TOKENS: 64000
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
          PRIVATE_REPO_ROOT: private-repo
          REPORT_EDITION: evening

      - name: Wait before retry 3 (Claude overloaded 等の一時エラー)
        if: success() && steps.gen2.outcome == 'failure'
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: |
          F="private-repo/market/daily/macro/${TARGET_DATE}_evening.md"
          # 途中まで書かれた不完全ファイルは退避（削除しない）。再試行が白紙から書き直せるようにする。
          if [ -f "$F" ]; then
            mv "$F" "/tmp/${TARGET_DATE}_macro_evening.attempt2.partial.md"
            echo "2 回目の不完全な出力を /tmp へ退避しました（再試行が白紙から書き直せるようにするため）"
          fi
          echo "2 回目も失敗しました。180 秒待機して最終再試行します"
          sleep 180

      - name: Generate macro evening report via Claude Code (retry 3)
        id: gen3
        if: success() && steps.gen2.outcome == 'failure'
        continue-on-error: true
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-5
          prompt_file: report-pipelines/prompts/macro-report-evening.md
          allowed_tools: "Read,Write,Edit,Bash,Grep,Glob"
          timeout_minutes: "30"
          claude_env: |
            CLAUDE_CODE_EFFORT_LEVEL: high
            CLAUDE_CODE_MAX_OUTPUT_TOKENS: 64000
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
          PRIVATE_REPO_ROOT: private-repo
          REPORT_EDITION: evening

      - name: Verify generated macro evening report (成否の一元判定)
        # 上の 3 ステップは全て continue-on-error のため、ジョブの成否はここだけで決まる。
        # 「どの試行で成功したか」に依存せず成果物の実在で判定するので、リトライ成功を失敗扱いする
        # / 失敗を成功扱いする判定崩れが起きない。
        if: success() && steps.build_prompt.outputs.exit_code != '2'
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: |
          F="private-repo/market/daily/macro/${TARGET_DATE}_evening.md"
          echo "attempt outcomes: gen1=${{ steps.gen1.outcome }} gen2=${{ steps.gen2.outcome }} gen3=${{ steps.gen3.outcome }}"
          if [ ! -s "$F" ]; then
            echo "::error::マクロレポート夕刊が 3 回の試行で生成されませんでした: $F"
            exit 1
          fi
          echo "生成成功: $F ($(wc -l < "$F") lines)"

      - name: Send Discord (PDF)
        id: send
        if: success() && steps.build_prompt.outputs.exit_code != '2'
        working-directory: ./private-repo/bi/pipelines
        env:
          DISCORD_WEBHOOK_MACRO: ${{ secrets.DISCORD_WEBHOOK_MACRO }}
          PYTHONIOENCODING: utf-8
        run: |
          python send_report_pdf_discord.py --kind macro_evening --date ${{ steps.date.outputs.value }}

      # PM 2026-09-02 承認: 夕刊本体の配信（上の Send Discord）より後に置き、ツイート生成が
      # 失敗しても本体配信・commit を止めない（continue-on-error + 1 回のみ・リトライなし）。
      # 起動条件は本体誌面の成否を一元判定する Verify ステップに揃える（build_prompt が
      # exit 2 = 新着なしの日はツイートも作らない）。
      - name: Generate macro tweet via Claude Code (Opus 5 + effort high)
        id: gen_tweet
        if: success() && steps.build_prompt.outputs.exit_code != '2'
        continue-on-error: true
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-5
          prompt_file: report-pipelines/prompts/macro-tweet.md
          allowed_tools: "Read,Write,Edit,Bash,Grep,Glob"
          timeout_minutes: "20"
          claude_env: |
            CLAUDE_CODE_EFFORT_LEVEL: high
            CLAUDE_CODE_MAX_OUTPUT_TOKENS: 32000
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
          PRIVATE_REPO_ROOT: private-repo

      - name: Send macro tweet drafts to Discord (SNS)
        id: send_tweet
        if: success() && steps.build_prompt.outputs.exit_code != '2'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_SNS: ${{ secrets.DISCORD_WEBHOOK_SNS }}
          TARGET_DATE: ${{ steps.date.outputs.value }}
          PYTHONIOENCODING: utf-8
        run: |
          F="private-repo/research/sns/${TARGET_DATE}_macro_tweet.md"
          if [ ! -s "$F" ]; then
            echo "::warning::マクロ市況ツイート案が生成されなかったため送信をスキップします: $F"
            exit 0
          fi
          MD=$(TZ=Asia/Tokyo date -d "${TARGET_DATE}" '+%-m月%-d日')
          cd private-repo/bi/pipelines
          python send_sns_drafts_discord.py \
            --file "../../research/sns/${TARGET_DATE}_macro_tweet.md" \
            --header "**マクロ市況ツイート / ${MD} 大引け**" \
            --hide-source

      - name: Rotate report archives (5 件超過分を archive/ へ退避)
        if: success() && steps.build_prompt.outputs.exit_code != '2'
        working-directory: ./private-repo
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # ops/ は Copy pipelines step の対象外のため Public 側から都度 overlay（最新版を保証）
          mkdir -p bi/pipelines/ops
          cp -f ../report-pipelines/bi/pipelines/ops/rotate_report_archives.py bi/pipelines/ops/
          python bi/pipelines/ops/rotate_report_archives.py

      - name: Commit and push to private repo
        # rebase 方式は履歴書き換え・並行 push で index.lock 残留の構造的弱点があるため、
        # fresh-base 方式の共通ヘルパー（Public 側から直接実行・repo 内コピー禁止）へ置換。
        if: success() && steps.build_prompt.outputs.exit_code != '2'
        working-directory: ./private-repo
        run: |
          bash ../report-pipelines/bi/pipelines/ops/ci_commit_push.sh \
            -m "data: macro evening report ${{ steps.date.outputs.value }}" market/daily research/sns

      - name: Discord 通知（⚠️ 配信済み・後処理のみ失敗）
        if: (failure() || cancelled()) && steps.send.outcome == 'success'
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_MACRO }}
          state: partial
          label: マクロレポート夕刊 後処理のみ失敗
          date: ${{ steps.date.outputs.value }}
          meaning: レポート本体は配信済みです。配信後のアーカイブ整理または commit だけが失敗しました。
          action_required: 不要（差分は次回 run が回収）

      - name: Discord 通知（❌ 失敗）
        if: (failure() || cancelled()) && steps.send.outcome != 'success'
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_MACRO }}
          state: failed
          label: マクロレポート夕刊 失敗
          date: ${{ steps.date.outputs.value }}
          meaning: 生成または送信が完了せず、本日未配信です。
          action_required: run ログ確認 → 手動 dispatch（force_rerun=true）で再実行。ログに「Spending cap reached」がある場合は Claude 利用枠切れ＝リセット時刻以降に force_rerun=true
