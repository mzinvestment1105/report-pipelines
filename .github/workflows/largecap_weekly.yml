name: 週次大型株速報（セクター輪番）

"on":
  # PM 2026-06-28 確定: 金曜 21:00 JST = UTC 12:00（cron '0 12 * * 5'）で発火。
  # workflow_dispatch をメイン経路に併用（手動再実行 / dry_run テスト用）。
  # guard ジョブが当日既存 run を検知して重複発火を防止（mover_weekly / sector_full と同方式）。
  workflow_dispatch:
    inputs:
      target_date:
        description: '対象日付 (YYYY-MM-DD・空欄で当日の金曜)'
        required: false
        default: ''
      force_rerun:
        description: 'true で当日重複ガードを無視して強制実行（修正後の再テスト用）'
        required: false
        default: 'false'
      dry_run:
        description: 'true で Discord 送信せず生成・PDF 化のみ（送信ステップに --skip-send を付与）'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '0 12 * * 5'

# 二重発火を GHA 内部ロックで防ぐ（mover_weekly / sector_full 準拠）。
concurrency:
  group: largecap_weekly-weekly
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      # 通知 composite action（.github/actions/notify-discord）を使うため checkout が必要
      - name: Checkout report-pipelines (通知 action 用)
        uses: actions/checkout@v4

      - name: Check today's runs
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # force_rerun は「手動 workflow_dispatch かつ明示 true」の時のみ有効。
          # schedule(cron) / 通常 dispatch は既定 false のままで重複ガードが効く（誤再発火しない）。
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force_rerun }}" = "true" ]; then
            echo "proceed=true" >> $GITHUB_OUTPUT
            echo "reason=force_rerun (manual guard bypass)" >> $GITHUB_OUTPUT
            echo "force_rerun=true (手動): 重複ガードを無視して実行します"
            exit 0
          fi
          TODAY_JST=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          MY_RUN_ID=${{ github.run_id }}
          EVENT="${{ github.event_name }}"

          # 2026-08-05 修正: run 単位の conclusion は「guard が本体ジョブを skip した run」まで
          # success と数えてしまい、本命の発火を「本日配信済み」と誤認して無言 skip させる。
          # 実際に配信/更新を行うジョブ（generate）の結果だけで判定する。
          STATS=$(bash .github/scripts/check_delivery.sh largecap_weekly.yml generate "${MY_RUN_ID}")
          DONE_OK=$(echo "$STATS" | jq -r '.delivered')
          DONE_FAIL=$(echo "$STATS" | jq -r '.failed')
          ACTIVE=$(( $(echo "$STATS" | jq -r '.sending') + $(echo "$STATS" | jq -r '.dispatch_pending') + $(echo "$STATS" | jq -r '.schedule_pending') ))

          echo "Today (${TODAY_JST}): active=${ACTIVE} done_ok=${DONE_OK} done_fail=${DONE_FAIL} event=${EVENT}"

          if [ "$DONE_OK" -gt 0 ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=skip (already succeeded today: done_ok=${DONE_OK})" >> $GITHUB_OUTPUT
          elif [ "$ACTIVE" -gt 0 ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=skip (active run exists: active=${ACTIVE})" >> $GITHUB_OUTPUT
          elif [ "$EVENT" = "schedule" ] && [ "$DONE_FAIL" -ge 2 ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=retry_cap (cron stopped: done_fail=${DONE_FAIL} >= 2)" >> $GITHUB_OUTPUT
          else
            echo "proceed=true" >> $GITHUB_OUTPUT
            if [ "$DONE_FAIL" -gt 0 ]; then
              echo "reason=recovery (done_fail=${DONE_FAIL})" >> $GITHUB_OUTPUT
            else
              echo "reason=initial" >> $GITHUB_OUTPUT
            fi
          fi

      # PM 2026-07-08 確定（判断②A）: 定刻起動通知（旧 🔶/⏱）は廃止。正常時はレポート本体の
      # 配信が成功通知を兼ねる。異常系（🚨 retry_cap・❌）のみ通知する。
      - name: Discord 通知（🚨 自動リトライ停止）
        if: contains(steps.check.outputs.reason, 'retry_cap')
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_LARGECAP || secrets.DISCORD_WEBHOOK_URL }}
          state: alert
          label: 週次大型株速報 自動リトライ停止
          meaning: 当日 2 回以上失敗したため cron の自動再実行を停止しました。今週分は未配信です。
          action_required: run ログ確認 → 原因解消後に手動 dispatch（force_rerun=true）で再実行

      - name: Discord 通知（guard 失敗）
        if: failure() || cancelled()
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_LARGECAP || secrets.DISCORD_WEBHOOK_URL }}
          state: failed
          label: 週次大型株速報 guard 失敗
          meaning: 実行前チェック（当日重複判定）自体がエラーになり、生成ジョブが起動していません。
          action_required: run ログ確認 → 手動 dispatch で再実行

  generate:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    # Claude 生成 50 分目安 + clone/setup/送信のマージン。
    # PM 2026-08-19: 529 自動リトライ（2 回・待機 60/180 秒）を足したため枠を再計算して拡張。
    # 最悪ケース = 前段（clone/setup/fonts/playwright/parquet 確認）10 分 + 1 回目 50 分 + 待機 1 分
    #            + 2 回目 30 分 + 待機 3 分 + 3 回目 30 分 + 検証/送信/commit 6 分 = 130 分 → 140 分。
    timeout-minutes: 140

    steps:
      - name: Determine target date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            echo "value=${{ github.event.inputs.target_date }}" >> $GITHUB_OUTPUT
          else
            echo "value=$(TZ=Asia/Tokyo date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          fi

      - name: Checkout report-pipelines
        uses: actions/checkout@v4
        with:
          path: report-pipelines

      - name: Setup SSH for private repo
        env:
          PRIVATE_REPO_DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_REPO_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone private repo (mizuki-fund)
        run: |
          git clone git@github.com:mzinvestment1105/mizuki-fund.git private-repo

      - name: Copy pipelines and static files from Public into private working tree
        run: |
          cp -f report-pipelines/bi/pipelines/*.py private-repo/bi/pipelines/
          cp -f report-pipelines/bi/pipelines/requirements.txt private-repo/bi/pipelines/
          mkdir -p private-repo/bi/pipelines/lib
          cp -rf report-pipelines/bi/pipelines/lib/*.py private-repo/bi/pipelines/lib/ 2>/dev/null || true
          # PDF 配信用の埋め込みフォント（assets/fonts/*.woff2）を Public から overlay
          mkdir -p private-repo/bi/pipelines/assets/fonts
          cp -rf report-pipelines/bi/pipelines/assets/fonts/* private-repo/bi/pipelines/assets/fonts/ 2>/dev/null || true
          mkdir -p private-repo/agents private-repo/playbook
          cp -f report-pipelines/agents/*.md private-repo/agents/ 2>/dev/null || true
          cp -f report-pipelines/playbook/*.md private-repo/playbook/ 2>/dev/null || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: report-pipelines/bi/pipelines/requirements.txt

      - name: Install dependencies
        run: pip install -r report-pipelines/bi/pipelines/requirements.txt

      - name: Install Japanese fonts (Noto Sans CJK JP)
        # PM 2026-08-19 承認（動意日次 mover_report_daily.yml からの横展開）: `sudo apt-get update -qq`
        # が出力ゼロのまま数十分ハングし、ジョブ枠に到達して配信ごと落ちる事故（GitHub 側の一時事象）の
        # 恒久対策。①ステップ単位 timeout ②各コマンドを timeout コマンドで打ち切り ③待機つき 3 回リトライ。
        #
        # 【失敗してもジョブを落とさない理由】本 workflow の誌面生成は send_report_pdf_discord.py →
        # bi/pipelines/lib/md_to_pdf.py で行い、同モジュールは assets/fonts の日本語サブセット woff2
        # （NotoSansJP / NotoSerifJP / BIZ UDPGothic）を base64 で @font-face 埋め込みする設計＝
        # システムのフォント選択に一切依存しない。よって apt のフォントが無くても誌面が豆腐（文字化け）に
        # なることはなく、ここで落とすと「配信できたはずの日を落とす」だけになる。
        # 時間予算: 1 試行 = update 75 秒 + install 120 秒 = 最大 195 秒。新規試行は開始 280 秒までに
        # 限るので最悪 475 秒で自己終了し、ステップ枠 8 分（480 秒）内に必ず警告を出して抜ける。
        timeout-minutes: 8
        continue-on-error: true
        run: |
          set -u
          DEADLINE=$(( $(date +%s) + 280 ))
          for i in 1 2 3; do
            if [ "$i" -gt 1 ] && [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "時間予算を超過したため再試行を打ち切ります"
              break
            fi
            if timeout 75 sudo apt-get update -qq \
               && timeout 120 sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra; then
              echo "日本語フォント導入に成功しました（${i} 回目）"
              exit 0
            fi
            echo "日本語フォント導入に失敗またはハングしました（${i}/3 回目）"
            if [ "$i" -lt 3 ]; then
              sleep $((i * 15))
            fi
          done
          echo "::warning::日本語フォントの apt 導入をスキップしました。PDF は assets/fonts の埋め込みフォント（base64 @font-face）で描画するため誌面に影響はなく、配信を続行します"
          exit 0

      - name: Install Playwright Chromium
        run: |
          playwright install chromium --with-deps

      - name: Check screening_master parquet existence (no update・PM 2026-05-23 確定)
        # screening_master 更新は約 5 時間かかるため本 workflow 内では走らせない。
        # screening_master.yml の cron で別途更新される設計に依存・存在確認のみ。
        working-directory: ./private-repo/bi/pipelines
        env:
          PYTHONIOENCODING: utf-8
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          import pandas as pd

          parquet = Path("../outputs/screening_master.parquet")
          if not parquet.exists():
              print(f"[WARN] screening_master.parquet が見つかりません: {parquet}")
              print("       本 workflow では更新しない設計のため、screening_master.yml が事前に走っている前提です")
              sys.exit(0)
          df = pd.read_parquet(parquet)
          latest = pd.to_datetime(df["DataDate"]).max().date().isoformat() if "DataDate" in df.columns else "unknown"
          target = os.environ.get("TARGET_DATE", "")
          print(f"screening_master DataDate: {latest} (target: {target})")
          print("PM 確定: 古くてもそのまま使う・更新は実行しない")
          PY

      - name: 既存の週次大型株レポートファイルを削除（前回不良ファイル読込スキップ防止）
        working-directory: ./private-repo
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: |
          TARGET_FILE="market/daily/largecap/${TARGET_DATE}.md"
          if [ -f "$TARGET_FILE" ]; then
            echo "Removing existing $TARGET_FILE before Claude run..."
            rm -f "$TARGET_FILE"
          fi

      # PM 2026-08-19 承認（動意日次 mover_report_daily.yml からの横展開）: Anthropic 側の過負荷応答
      # （API Error: 529 overloaded_error）を初回 API 呼び出しで受けて即 exit 1 する事故の恒久対策。
      # 第三者製の新規 action を足さず、continue-on-error + outcome 判定の再試行ステップだけで構成する。
      # 529 は即時再試行が無意味なため待機を指数的に伸ばす（60 秒 → 180 秒）。3 ステップとも
      # continue-on-error のため、成否は最後の Verify ステップ 1 箇所（成果物ファイルが非空か）で決まる。
      - name: Generate largecap weekly report via Claude Code (Opus 5 + effort high)
        id: gen1
        continue-on-error: true
        # Claude が private クローンから最新 macro/sector/theme + 台帳 + セクターマップを読み、
        # 二軸でセクター約3つを選定 → weekly_largecap_sectors.py --survey/--select で素材取得
        # （市場系数値は yfinance ライブ・HTTP のみで GHA でも動く）→ 本文生成 → 保存。
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-5
          prompt_file: report-pipelines/prompts/largecap-weekly.md
          allowed_tools: "Read,Write,Edit,Bash,Grep,Glob"
          timeout_minutes: "50"
          claude_env: |
            CLAUDE_CODE_EFFORT_LEVEL: high
            CLAUDE_CODE_MAX_OUTPUT_TOKENS: 32000
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
          PRIVATE_REPO_ROOT: private-repo
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          EDINETDB_API_KEYS: ${{ secrets.EDINETDB_API_KEYS }}
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: 32000

      # PM 2026-09-05 承認: 枠切れ（Spending cap reached）は待機しても同一 run 内では回復しない。
      # 実測（2026-09-04 の夜間PTS動意 run）では枠切れ後の再試行が 1.5 秒で即時拒否されるだけで、
      # 待機が枠のリセット（数十分先）に届かず、空振りが当日の自動リトライ上限を食い潰していた。
      # よって枠切れを検出した試行の後続は打ち切る（一時障害のリトライは従来どおり残す）。
      - name: Detect spending cap (attempt 1)
        id: cap1
        if: success() && steps.gen1.outcome == 'failure'
        env:
          EXECUTION_FILE: ${{ steps.gen1.outputs.execution_file }}
          ATTEMPT: '1'
        run: bash report-pipelines/.github/scripts/detect_spending_cap.sh

      - name: Wait before retry 2 (Claude overloaded 等の一時エラー)
        if: success() && steps.gen1.outcome == 'failure' && steps.cap1.outputs.capped != 'true'
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: |
          F="private-repo/market/daily/largecap/${TARGET_DATE}.md"
          # 途中まで書かれた不完全ファイルは退避（削除しない）。再試行が白紙から書き直せるようにする。
          if [ -f "$F" ]; then
            mv "$F" "/tmp/${TARGET_DATE}_largecap.attempt1.partial.md"
            echo "1 回目の不完全な出力を /tmp へ退避しました（再試行が白紙から書き直せるようにするため）"
          fi
          echo "1 回目が失敗しました。60 秒待機して再試行します（529 は即時再試行が無意味なため）"
          sleep 60

      - name: Generate largecap weekly report via Claude Code (retry 2)
        id: gen2
        if: success() && steps.gen1.outcome == 'failure' && steps.cap1.outputs.capped != 'true'
        continue-on-error: true
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-5
          prompt_file: report-pipelines/prompts/largecap-weekly.md
          allowed_tools: "Read,Write,Edit,Bash,Grep,Glob"
          timeout_minutes: "30"
          claude_env: |
            CLAUDE_CODE_EFFORT_LEVEL: high
            CLAUDE_CODE_MAX_OUTPUT_TOKENS: 32000
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
          PRIVATE_REPO_ROOT: private-repo
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          EDINETDB_API_KEYS: ${{ secrets.EDINETDB_API_KEYS }}
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: 32000

      - name: Detect spending cap (attempt 2)
        id: cap2
        if: success() && steps.gen2.outcome == 'failure'
        env:
          EXECUTION_FILE: ${{ steps.gen2.outputs.execution_file }}
          ATTEMPT: '2'
        run: bash report-pipelines/.github/scripts/detect_spending_cap.sh

      - name: Wait before retry 3 (Claude overloaded 等の一時エラー)
        if: success() && steps.gen2.outcome == 'failure' && steps.cap2.outputs.capped != 'true'
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: |
          F="private-repo/market/daily/largecap/${TARGET_DATE}.md"
          # 途中まで書かれた不完全ファイルは退避（削除しない）。再試行が白紙から書き直せるようにする。
          if [ -f "$F" ]; then
            mv "$F" "/tmp/${TARGET_DATE}_largecap.attempt2.partial.md"
            echo "2 回目の不完全な出力を /tmp へ退避しました（再試行が白紙から書き直せるようにするため）"
          fi
          echo "2 回目も失敗しました。180 秒待機して最終再試行します"
          sleep 180

      - name: Generate largecap weekly report via Claude Code (retry 3)
        id: gen3
        if: success() && steps.gen2.outcome == 'failure' && steps.cap2.outputs.capped != 'true'
        continue-on-error: true
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-5
          prompt_file: report-pipelines/prompts/largecap-weekly.md
          allowed_tools: "Read,Write,Edit,Bash,Grep,Glob"
          timeout_minutes: "30"
          claude_env: |
            CLAUDE_CODE_EFFORT_LEVEL: high
            CLAUDE_CODE_MAX_OUTPUT_TOKENS: 32000
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
          PRIVATE_REPO_ROOT: private-repo
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          EDINETDB_API_KEYS: ${{ secrets.EDINETDB_API_KEYS }}
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: 32000

      - name: Verify generated largecap weekly report (成否の一元判定)
        # 上の 3 ステップは全て continue-on-error のため、ジョブの成否はここだけで決まる。
        # 「どの試行で成功したか」に依存せず成果物の実在で判定するので、リトライ成功を失敗扱いする
        # / 失敗を成功扱いする判定崩れが起きない。
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: |
          F="private-repo/market/daily/largecap/${TARGET_DATE}.md"
          echo "attempt outcomes: gen1=${{ steps.gen1.outcome }} gen2=${{ steps.gen2.outcome }} gen3=${{ steps.gen3.outcome }}"
          if [ ! -s "$F" ]; then
            echo "::error::週次大型株レポートが 3 回の試行で生成されませんでした: $F"
            exit 1
          fi
          echo "生成成功: $F ($(wc -l < "$F") lines)"

      - name: レポート生成確認（欠落なら fail・空配信防止）
        # exit 3 = 品質ゲート不合格（⛔ 通知へ分岐・生成物の欠落/不完全）
        id: gate
        working-directory: ./private-repo
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: |
          block() { echo "::error::$1"; echo "exit_code=3" >> $GITHUB_OUTPUT; exit 3; }
          TARGET_FILE="market/daily/largecap/${TARGET_DATE}.md"
          if [ ! -f "$TARGET_FILE" ]; then
            block "レポートが生成されていません: $TARGET_FILE"
          fi
          LINES=$(wc -l < "$TARGET_FILE")
          echo "Generated $TARGET_FILE ($LINES lines)"
          if [ "$LINES" -lt 30 ]; then
            block "レポートが極端に短い（$LINES 行）・生成不完全とみなし送信中止"
          fi
          echo "exit_code=0" >> $GITHUB_OUTPUT

      - name: 相互参照ゲート（警告のみ・配信は止めない）
        # PM 2026-09-05 指示（_common_rules.md §40）: 誌面で他セクション・他順位・他銘柄行を
        # 指し示す表記（「〜を参照」「前述」「上記の」「同上」「再掲」等）を全レポート種別で禁止する。
        # 重複銘柄も各セクションで「何の会社」「なぜ動いた」を独立して書き切る。
        # 検出は警告のみ（continue-on-error）で配信は止めない（§36 絶対配信原則との整合）。
        # ログに残った検出は次回生成時に Claude が是正する。
        continue-on-error: true
        working-directory: ./private-repo
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python bi/pipelines/lib/crossref_check.py --file market/daily/largecap/${{ steps.date.outputs.value }}.md || true

      - name: Send Discord (PDF)
        id: send
        working-directory: ./private-repo/bi/pipelines
        env:
          DISCORD_WEBHOOK_LARGECAP: ${{ secrets.DISCORD_WEBHOOK_LARGECAP }}
          PYTHONIOENCODING: utf-8
        run: |
          SKIP=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            SKIP="--skip-send"
            echo "dry_run=true: --skip-send で生成・PDF 化のみ実行（Discord 送信なし）"
          fi
          python send_report_pdf_discord.py --kind largecap_weekly --date ${{ steps.date.outputs.value }} $SKIP

      - name: Rotate report archives (5 件超過分を archive/ へ退避)
        working-directory: ./private-repo
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # ops/ は Copy pipelines step の対象外のため Public 側から都度 overlay（最新版を保証）
          mkdir -p bi/pipelines/ops
          cp -f ../report-pipelines/bi/pipelines/ops/rotate_report_archives.py bi/pipelines/ops/
          python bi/pipelines/ops/rotate_report_archives.py

      - name: Commit and push to private repo
        # 生成物（market/daily/largecap/{date}.md・更新後 research/largecap/sector_ledger.json）を
        # private repo に commit-back（既存方式・Public へは出さない）。
        # always() で生成 step 失敗時もここを通すが、差分が無ければ no-op。
        # rebase 方式は並行 push に弱いため fresh-base 方式の共通ヘルパーへ置換。
        if: ${{ always() }}
        working-directory: ./private-repo
        run: |
          bash ../report-pipelines/bi/pipelines/ops/ci_commit_push.sh \
            -m "data: largecap weekly ${{ steps.date.outputs.value }}" \
            market/daily/largecap research/largecap

      - name: Discord 通知（⛔ 生成確認で送信中止）
        if: failure() && steps.gate.outputs.exit_code == '3'
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_LARGECAP || secrets.DISCORD_WEBHOOK_URL }}
          state: blocked
          label: 週次大型株速報 送信中止（生成確認不合格）
          date: ${{ steps.date.outputs.value }}
          meaning: レポートが未生成または極端に短く不完全だったため、配信を止めました。今週分は未配信です。
          action_required: run ログで生成失敗理由を確認 → 修正後に手動 dispatch（force_rerun=true）

      - name: Discord 通知（⚠️ 配信済み・後処理のみ失敗）
        if: (failure() || cancelled()) && steps.send.outcome == 'success'
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_LARGECAP || secrets.DISCORD_WEBHOOK_URL }}
          state: partial
          label: 週次大型株速報 後処理のみ失敗
          date: ${{ steps.date.outputs.value }}
          meaning: レポート本体は配信済みです。配信後のアーカイブ整理または commit だけが失敗しました。
          action_required: 不要（差分は次回 run が回収）

      - name: Discord 通知（❌ 失敗）
        if: (failure() || cancelled()) && steps.gate.outputs.exit_code != '3' && steps.send.outcome != 'success'
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_LARGECAP || secrets.DISCORD_WEBHOOK_URL }}
          state: failed
          label: 週次大型株速報 失敗
          date: ${{ steps.date.outputs.value }}
          meaning: 生成または送信が完了せず、今週分は未配信です。
          action_required: run ログ確認 → 手動 dispatch（force_rerun=true）で再実行。ログに「Spending cap reached」がある場合は Claude 利用枠切れ＝リセット時刻以降に force_rerun=true
