name: X リムーブ候補 日次

# PM 2026-09-02: 運用 X アカウント（ノクトラ）の「片思いフォロー」を毎日棚卸しし、
# リムーブ候補レポートを無人で発行する（PM 指示 2026-09-04 で週次から日次へ変更）。素材は daily_data_sync.yml（毎日 06:00 JST）が
# Private へ commit back している profile_daily_{date}.json の following / followers。
#
# 生成物（すべて Private リポへ commit back）:
#   bi/outputs/x_posts/oneway_follows_{date}.csv   … 片思い全件の分類結果
#   bi/outputs/x_posts/unfollow_console_{date}.js  … 解除用 Console スクリプト（C_unfollow 0 件なら生成されない）
#   research/sns/{date}_follow_unfollow.md         … PM 向けレポート本文（PDF 化して Discord 送信）
#
# 設計上の注意（このリポジトリは Public のため）:
#   - 対象アカウント名・ハンドル・フォロー関係の中身を公開ログへ一切 echo しない。
#     make_unfollow_candidates.py の stdout はハンドルを含むため *.log へ隔離し、
#     公開ログへ出すのは exit code・ファイルの有無（bool）・件数のみとする。
#   - artifact のアップロードはしない（Public リポの artifact は第三者が取得可能）。
#   - X へは一切アクセスしない。本 workflow は daily_data_sync が取得済みの
#     ローカル JSON だけを読む純粋な集計処理であり、cookie 系 Secrets も使わない。
"on":
  schedule:
    # UTC 08:00 = JST 17:00 起票（PM 指示 2026-09-04: 毎日 17 時）。
    # GitHub cron は数十分〜数時間遅延し得るため、guard の時間帯ゲートは JST 15〜23 時を許容する。
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: '対象日付 (YYYY-MM-DD・空欄で当日)'
        required: false
        default: ''
      force_rerun:
        description: 'true で当日重複ガードを無視して強制実行（修正後の再テスト用）'
        required: false
        default: 'false'

# 二重発火を GHA 内部ロックで防ぐ（macro_tweet_daily.yml と同じ固定 group 方式）。
concurrency:
  group: x_unfollow_daily
  cancel-in-progress: false

jobs:
  guard:
    # 判定: (1) workflow_dispatch かつ force_rerun=true → 無条件 proceed
    #       (2) cron 起動かつ JST 15 時未満 → skip（深夜着火が翌 JST 日の枠を消費する事故の防止）
    #       (3) DONE_OK >= 1 → skip（当日すでに生成済み）
    #       (4) ACTIVE >= 1 → skip（走行中の run あり）
    #       (5) cron 起動かつ DONE_FAIL >= 2 → skip（連続失敗の課金暴走防止）
    #       (6) それ以外 → proceed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      # 通知 composite action（.github/actions/notify-discord）を使うため checkout が必要
      - name: Checkout report-pipelines (通知 action 用)
        uses: actions/checkout@v4

      - name: Check today's runs
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY_JST=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          MY_RUN_ID=${{ github.run_id }}
          EVENT="${{ github.event_name }}"

          # force_rerun は「手動 workflow_dispatch かつ明示 true」の時のみ有効（誤再発火防止）。
          if [ "$EVENT" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force_rerun }}" = "true" ]; then
            echo "proceed=true" >> $GITHUB_OUTPUT
            echo "reason=force_rerun (manual guard bypass)" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 実際に生成/送信を行うジョブ（generate）の結果だけで当日実績を判定する
          # （guard が本体を skip した run まで success と数える誤認を避ける）。
          STATS=$(bash .github/scripts/check_delivery.sh x_unfollow_daily.yml generate "${MY_RUN_ID}")
          DONE_OK=$(echo "$STATS" | jq -r '.delivered')
          DONE_FAIL=$(echo "$STATS" | jq -r '.failed')
          ACTIVE=$(( $(echo "$STATS" | jq -r '.sending') + $(echo "$STATS" | jq -r '.dispatch_pending') + $(echo "$STATS" | jq -r '.schedule_pending') ))

          echo "Today (${TODAY_JST}): active=${ACTIVE} done_ok=${DONE_OK} done_fail=${DONE_FAIL} event=${EVENT} (excluding self ${MY_RUN_ID})"

          echo "active=${ACTIVE}" >> $GITHUB_OUTPUT
          echo "done_ok=${DONE_OK}" >> $GITHUB_OUTPUT
          echo "done_fail=${DONE_FAIL}" >> $GITHUB_OUTPUT

          # GitHub cron は数時間遅延し、深夜着火すると翌 JST 日の枠を誤って消費する。
          # schedule(cron) 起動のみ時間帯ゲートで無害化する（本レポートの妥当な発行帯 = JST 15〜23 時）。
          HOUR_JST=$((10#$(TZ=Asia/Tokyo date +%H)))

          if [ "$EVENT" = "schedule" ] && [ "$HOUR_JST" -lt 15 ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=skip (cron outside window: ${HOUR_JST}h JST)" >> $GITHUB_OUTPUT
          elif [ "$DONE_OK" -gt 0 ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=skip (already succeeded today: done_ok=${DONE_OK})" >> $GITHUB_OUTPUT
          elif [ "$ACTIVE" -gt 0 ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=skip (active run exists: active=${ACTIVE})" >> $GITHUB_OUTPUT
          elif [ "$EVENT" = "schedule" ] && [ "$DONE_FAIL" -ge 2 ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "reason=retry_cap (cron stopped: done_fail=${DONE_FAIL} >= 2)" >> $GITHUB_OUTPUT
          else
            echo "proceed=true" >> $GITHUB_OUTPUT
            if [ "$DONE_FAIL" -gt 0 ]; then
              echo "reason=recovery (done_fail=${DONE_FAIL})" >> $GITHUB_OUTPUT
            else
              echo "reason=initial" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Discord 通知（🚨 自動リトライ停止）
        if: contains(steps.check.outputs.reason, 'retry_cap')
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_SNS || secrets.DISCORD_WEBHOOK_URL }}
          state: alert
          label: X リムーブ候補 日次 自動リトライ停止
          meaning: 当日 2 回以上失敗したため cron の自動再実行を停止しました。本日のリムーブ候補レポートは未発行です。
          action_required: run ログ確認 → 原因解消後に手動 dispatch（force_rerun=true）で再実行

      - name: Discord 通知（guard 失敗）
        if: failure() || cancelled()
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_SNS || secrets.DISCORD_WEBHOOK_URL }}
          state: failed
          label: X リムーブ候補 日次 guard 失敗
          meaning: 実行前チェック（当日重複判定）自体がエラーになり、生成ジョブが起動していません。
          action_required: run ログ確認 → 手動 dispatch で再実行

  generate:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    # 集計は純粋なローカル JSON 処理で数十秒。前段（clone/setup/fonts/playwright）が支配的。
    timeout-minutes: 30

    steps:
      - name: Determine target date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            echo "value=${{ github.event.inputs.target_date }}" >> $GITHUB_OUTPUT
          else
            echo "value=$(TZ=Asia/Tokyo date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          fi

      - name: Checkout report-pipelines
        uses: actions/checkout@v4
        with:
          path: report-pipelines

      - name: Setup SSH for private repo
        env:
          PRIVATE_REPO_DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_REPO_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone private repo (mizuki-fund)
        run: |
          git clone git@github.com:mzinvestment1105/mizuki-fund.git private-repo

      - name: Copy pipelines and static files from Public into private working tree
        # PM が Private 側への push を忘れた場合でも Public 側の最新ファイルで上書きし、自動化の品質を保つ。
        # make_unfollow_candidates.py も Public に同期済みのため、この overlay で最新版が適用される。
        # なお除外リスト bi/data/x_influencers.yaml は Private のみに存在し（フォロー関係の中身のため
        # Public へは出さない）、clone した実物がそのまま使われる。無い場合は除外なしで動く実装。
        run: |
          cp -f report-pipelines/bi/pipelines/*.py private-repo/bi/pipelines/
          cp -f report-pipelines/bi/pipelines/requirements.txt private-repo/bi/pipelines/
          mkdir -p private-repo/bi/pipelines/lib
          cp -rf report-pipelines/bi/pipelines/lib/*.py private-repo/bi/pipelines/lib/ 2>/dev/null || true
          # PDF 配信用の埋め込みフォント（assets/fonts/*.woff2）を Public から overlay
          mkdir -p private-repo/bi/pipelines/assets/fonts
          cp -rf report-pipelines/bi/pipelines/assets/fonts/* private-repo/bi/pipelines/assets/fonts/ 2>/dev/null || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: report-pipelines/bi/pipelines/requirements.txt

      - name: Install dependencies
        run: pip install -r report-pipelines/bi/pipelines/requirements.txt

      - name: Install Japanese fonts (Noto Sans CJK JP)
        # largecap_weekly.yml と同一の耐ハング実装（`sudo apt-get update -qq` が出力ゼロのまま
        # ハングしジョブ枠に到達する GitHub 側の一時事象への対策。①ステップ timeout ②各コマンドを
        # timeout で打ち切り ③待機つき 3 回リトライ）。
        # 失敗してもジョブを落とさない: PDF 描画は lib/md_to_pdf.py が assets/fonts の日本語
        # サブセット woff2 を base64 で @font-face 埋め込みする設計＝システムのフォント選択に
        # 依存しないため、apt フォントが無くても誌面は豆腐にならない。
        timeout-minutes: 8
        continue-on-error: true
        run: |
          set -u
          DEADLINE=$(( $(date +%s) + 280 ))
          for i in 1 2 3; do
            if [ "$i" -gt 1 ] && [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "時間予算を超過したため再試行を打ち切ります"
              break
            fi
            if timeout 75 sudo apt-get update -qq \
               && timeout 120 sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra; then
              echo "日本語フォント導入に成功しました（${i} 回目）"
              exit 0
            fi
            echo "日本語フォント導入に失敗またはハングしました（${i}/3 回目）"
            if [ "$i" -lt 3 ]; then
              sleep $((i * 15))
            fi
          done
          echo "::warning::日本語フォントの apt 導入をスキップしました。PDF は assets/fonts の埋め込みフォント（base64 @font-face）で描画するため誌面に影響はなく、配信を続行します"
          exit 0

      - name: Install Playwright Chromium
        # lib/md_to_pdf.py は Chromium の印刷機能で A4 PDF を出力するため必須。
        run: |
          playwright install chromium --with-deps

      - name: Check prerequisite (当日 following データの存在確認)
        id: precheck
        # 本レポートは daily_data_sync.yml が取得した following / followers を集計するだけで、
        # X へは一切アクセスしない。よって当日データが無い日はレポートだけ作らずに終える。
        # cookie 失効時、fetch_x_profile.py は例外を握り潰して following: [] のまま exit 0 する
        # ため、ファイルの存在ではなく following の実件数が 1 件以上あることを検査する。
        # 見つからない場合は warning のうえ以降を skip し、ジョブは成功扱いで終える
        # （0 件は daily_data_sync 側の件数ゲートが既に Discord 通知するため、二重に鳴らさない）。
        # 公開ログへはハンドルを出さず、件数と bool のみを出す。
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: |
          python - <<'PY' > precheck_out.txt
          import json, os

          date = os.environ.get("TARGET_DATE", "")
          path = f"private-repo/bi/outputs/x_posts/gha/profile_daily_{date}.json"
          if not os.path.exists(path):
              print("json_exists=false")
              print("following_count=0")
              print("ready=false")
              raise SystemExit(0)
          print("json_exists=true")

          d = json.load(open(path, encoding="utf-8"))
          accounts = d.get("accounts", [])
          # 対象アカウントは複数あり得るため「1 件でも following を取れているか」で判定する。
          # index のみを出し、screen_name は出さない。
          total = 0
          for i, a in enumerate(accounts):
              n = len(a.get("following") or [])
              print(f"account{i}: following={n}")
              total += n
          print(f"account_count={len(accounts)}")
          print(f"following_count={total}")
          print("ready=" + ("true" if total > 0 else "false"))
          PY
          cat precheck_out.txt
          grep -E '^[A-Za-z_][A-Za-z0-9_]*=' precheck_out.txt >> $GITHUB_OUTPUT || true
          READY=$(grep -E '^ready=' precheck_out.txt | tail -1 | cut -d= -f2)
          if [ "$READY" != "true" ]; then
            echo "::warning::当日（${TARGET_DATE}）の following データが無い（または 0 件）ため、本日のリムーブ候補レポート生成をスキップします。SNS デイリーデータ同期の状態と cookie を確認してください"
          fi

      - name: Generate unfollow candidates
        id: gen
        if: success() && steps.precheck.outputs.ready == 'true'
        working-directory: ./private-repo/bi/pipelines
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
          PYTHONIOENCODING: utf-8
        run: |
          # stdout にはフォロー関係のハンドルが含まれるため公開ログへは出さず *.log へ隔離する。
          # exit 1 は 2 系統あり、切り分けのために終了後にファイルの有無で判別する:
          #   (a) 出力先に当日分の既存ファイルがある（上書き防止の中止）… MD が既に存在する
          #   (b) following が見つからない等のデータ不足 … MD が存在しない
          set +e
          python make_unfollow_candidates.py --date "${TARGET_DATE}" > unfollow.log 2>&1
          ec=$?
          set -e
          echo "exit_code=${ec}"
          echo "exit_code=${ec}" >> $GITHUB_OUTPUT

          MD="../../research/sns/${TARGET_DATE}_follow_unfollow.md"
          CSV="../outputs/x_posts/oneway_follows_${TARGET_DATE}.csv"
          JS="../outputs/x_posts/unfollow_console_${TARGET_DATE}.js"
          [ -s "$MD" ] && echo "md_exists=true"  || echo "md_exists=false"
          [ -s "$CSV" ] && echo "csv_exists=true" || echo "csv_exists=false"
          # JS は C_unfollow 0 件だと生成されない（＝存在しなくても正常）
          if [ -s "$JS" ]; then echo "js_exists=true"; echo "js_exists=true" >> $GITHUB_OUTPUT
          else echo "js_exists=false"; echo "js_exists=false" >> $GITHUB_OUTPUT; fi

          if [ "$ec" -ne 0 ]; then
            if [ -s "$MD" ]; then
              echo "::warning::当日分のレポートが既に存在するため、スクリプトが上書きせず中止しました（exit ${ec}）。既存ファイルをそのまま配信します"
            else
              echo "::error::リムーブ候補の生成に失敗しました（exit ${ec}・当日分の成果物なし）。データ不足の可能性があります"
              exit 1
            fi
          fi

          if [ ! -s "$MD" ]; then
            echo "::error::スクリプトは正常終了しましたがレポートが生成されていません: ${MD}"
            exit 1
          fi
          echo "生成成功: research/sns/${TARGET_DATE}_follow_unfollow.md ($(wc -l < "$MD") lines)"

      - name: Send report to Discord (SNS) as PDF
        id: send
        if: success() && steps.precheck.outputs.ready == 'true'
        # 送信手段の選定根拠（PM 2026-09-02）:
        #   - 全レポートの送信形式は PDF に統一し JPEG を禁止（_cr §33）。本レポートも PDF で送る。
        #   - send_report_pdf_discord.py は --kind が KIND_CONFIG のキーに閉じており、本レポート用の
        #     kind が無い。kind の追加は Public/Private 両方の共有スクリプトの改修になるため、
        #     ここでは既存スクリプトを一切変更せず lib/md_to_pdf.render_markdown_to_pdf を直接呼ぶ。
        #   - send_sns_drafts_discord.py は「## 候補X：」セクションを必須とし、無ければ exit 1 する。
        #     本レポートの見出しは「## 【A】リム候補」等で候補セクション形式ではないため使えない。
        #   - 添付の multipart 形式は send_report_pdf_discord.py の _post_pdf と同一（payload_json +
        #     files[0]）に揃えてある。
        # unfollow_console_{date}.js の PM への渡し方:
        #   Discord は任意拡張子のファイルを添付できるため、.js をそのまま同一メッセージに添付する
        #   （PM が Chrome の Console へ貼る手間を最小化する＝クリック1回でダウンロードできる）。
        #   ただし .js は環境によってプレビューできないため、本文にも Private リポ内のパスを併記して
        #   リポからも辿れるようにする。C_unfollow 0 件の日は JS が生成されないので PDF のみ送る。
        env:
          DISCORD_WEBHOOK_SNS: ${{ secrets.DISCORD_WEBHOOK_SNS }}
          TARGET_DATE: ${{ steps.date.outputs.value }}
          PYTHONIOENCODING: utf-8
        working-directory: ./private-repo/bi/pipelines
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path

          sys.path.insert(0, str(Path(__file__).resolve().parent))
          sys.path.insert(0, os.getcwd())
          import requests
          from lib.md_to_pdf import render_markdown_to_pdf

          date = os.environ["TARGET_DATE"]
          webhook = os.environ.get("DISCORD_WEBHOOK_SNS", "")
          if not webhook:
              print("ERROR: DISCORD_WEBHOOK_SNS not set", file=sys.stderr)
              raise SystemExit(1)

          repo = Path(os.getcwd()).parents[1]          # private-repo のルート
          md_path = repo / "research" / "sns" / f"{date}_follow_unfollow.md"
          js_path = repo / "bi" / "outputs" / "x_posts" / f"unfollow_console_{date}.js"
          out_dir = repo / "bi" / "outputs" / "report_pdfs"
          out_dir.mkdir(parents=True, exist_ok=True)
          pdf_path = out_dir / f"x_unfollow_{date}.pdf"

          md_text = md_path.read_text(encoding="utf-8")
          # kind は KIND_META の既存キーから選ぶ（新規キー追加は共有モジュールの改修になるため避ける）。
          render_markdown_to_pdf(md_text, pdf_path, kind="review", target_date=date)
          print(f"rendered: {pdf_path.name} size={pdf_path.stat().st_size:,} bytes")

          note = "**X リムーブ候補（日次）** " + date
          files_payload = {}
          attachments = []
          opened = []
          try:
              f_pdf = pdf_path.open("rb")
              opened.append(f_pdf)
              attachments.append({"id": 0, "filename": pdf_path.name})
              files_payload["files[0]"] = (pdf_path.name, f_pdf, "application/pdf")

              if js_path.exists() and js_path.stat().st_size > 0:
                  f_js = js_path.open("rb")
                  opened.append(f_js)
                  attachments.append({"id": 1, "filename": js_path.name})
                  files_payload["files[1]"] = (js_path.name, f_js, "text/javascript")
                  note += (
                      "\n解除用 Console スクリプトを添付しました（`" + js_path.name + "`）。"
                      "リポでは `bi/outputs/x_posts/" + js_path.name + "` にあります。"
                  )
              else:
                  note += "\n解除対象は 0 件のため、Console スクリプトはありません。"

              payload = {"content": note, "attachments": attachments}
              files_payload["payload_json"] = (
                  None, json.dumps(payload, ensure_ascii=False), "application/json",
              )
              r = requests.post(webhook, files=files_payload, timeout=60)
          finally:
              for f in opened:
                  f.close()

          print(f"status {r.status_code} attachments={len(attachments)}")
          if r.status_code >= 400:
              print(f"body: {r.text[:400]}", file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Commit and push to private repo
        if: success() && steps.precheck.outputs.ready == 'true'
        working-directory: ./private-repo
        run: |
          bash ../report-pipelines/bi/pipelines/ops/ci_commit_push.sh \
            -m "data: x unfollow candidates ${{ steps.date.outputs.value }}" \
            bi/outputs/x_posts research/sns

      - name: Discord 通知（⚠️ 配信済み・後処理のみ失敗）
        if: (failure() || cancelled()) && steps.send.outcome == 'success'
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_SNS || secrets.DISCORD_WEBHOOK_URL }}
          state: partial
          label: X リムーブ候補 日次 後処理のみ失敗
          date: ${{ steps.date.outputs.value }}
          meaning: リムーブ候補レポートは Discord へ配信済みです。配信後の commit だけが失敗しました。
          action_required: 不要（差分は次回 run が回収）

      - name: Discord 通知（❌ 失敗）
        if: (failure() || cancelled()) && steps.send.outcome != 'success'
        uses: ./report-pipelines/.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_SNS || secrets.DISCORD_WEBHOOK_URL }}
          state: failed
          label: X リムーブ候補 日次 失敗
          date: ${{ steps.date.outputs.value }}
          meaning: 生成または送信が完了せず、本日のリムーブ候補レポートは未配信です。
          action_required: run ログ確認 → 手動 dispatch（force_rerun=true）で再実行

      - name: 成否サマリ（bool のみ）
        if: always()
        run: |
          echo "date=${{ steps.date.outputs.value }}"
          echo "ready=${{ steps.precheck.outputs.ready }}"
          echo "gen_ok=${{ steps.gen.outcome == 'success' }}"
          echo "js_exists=${{ steps.gen.outputs.js_exists }}"
          echo "send_ok=${{ steps.send.outcome == 'success' }}"
